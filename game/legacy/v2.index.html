<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydropower Tycoon</title>
<style>
:root, [data-theme="field"]{
  --surface:#f1ead9; --raised:#f8f3e6; --text:#2b2a26; --text2:#55503f; --border:#b5a98c;
  --gen:#1d6e68; --pump:#a3472c; --ren:#2f6f86; --warn:#8a5f10; --alarm:#9e2b25; --accent:#4f6b3a;
  --ochre:#c58b2a; --shadow:0 2px 0 rgba(43,42,38,.18), 0 6px 18px rgba(43,42,38,.14);
  --fh: Georgia, "Iowan Old Style", "Palatino Linotype", serif; --fb: "Segoe UI", system-ui, sans-serif;
  --fm: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; --r:6px;
  --grain: repeating-linear-gradient(0deg, rgba(90,70,30,.035) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(90,70,30,.025) 0 1px, transparent 1px 4px);
  --blur:none; --btn:#e7dcc2; --btnText:#2b2a26; --focus:#2f6f86;
}
[data-theme="brass"]{
  --surface:#1f2428; --raised:#2a3136; --text:#ece6d8; --text2:#c2b9a6; --border:#b08d57;
  --gen:#5aa89b; --pump:#e07a6b; --ren:#8bbbe0; --warn:#e0b25a; --alarm:#ff8f80; --accent:#b08d57;
  --ochre:#b08d57; --shadow:0 2px 0 rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.35);
  --fh: "Copperplate", "Palatino Linotype", Georgia, serif; --fb: "Palatino Linotype", Georgia, serif;
  --grain: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.08));
  --btn:#343c42; --btnText:#ece6d8; --focus:#e0b25a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#9fb3a8;color:var(--text);font-family:var(--fb);font-size:14px}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.pane{background:var(--surface);background-image:var(--grain);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--text)}
button,select,input{font:inherit;color:var(--btnText)}
button{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--border);background:var(--btn);border-radius:6px;cursor:pointer}
button:hover{filter:brightness(1.05)}
button[aria-pressed="true"],button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme="brass"] button[aria-pressed="true"],[data-theme="brass"] button.on{color:#1f2428}
button:disabled{opacity:.55;cursor:not-allowed}
select,input[type=number],input[type=text]{min-height:44px;background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:0 8px;color:var(--text)}
input[type=range]{min-height:44px;width:100%;accent-color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--fh);margin:.2em 0 .4em;font-weight:600}
h2{font-size:18px}h3{font-size:15px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.muted{color:var(--text2)}
.warn{color:var(--warn)} .alarm{color:var(--alarm)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dotted var(--border)}
.kv b{font-family:var(--fm);font-weight:600}
/* top bar */
:root{--dockH:72px;--glass:color-mix(in srgb,var(--surface) 92%,transparent);--soft:color-mix(in srgb,var(--text) 7%,transparent);--hair:color-mix(in srgb,var(--border) 55%,transparent);--r2:12px}
#top,#instr,#presets,#tools{border-radius:var(--r2);border-color:var(--hair)}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:4px;align-items:center;padding:4px 8px 4px 10px;min-height:56px;z-index:20;flex-wrap:nowrap}
#top .stat{display:flex;flex-direction:column;justify-content:center;line-height:1.15;padding:0 14px;border-left:1px solid var(--hair);white-space:nowrap;min-width:0}
#top .stat:first-of-type{border-left:0}
#top .stat .lbl{font-size:10px;letter-spacing:.09em}
#top .stat b{font-size:15px;font-weight:600}
#tSeason{overflow:hidden;text-overflow:ellipsis;max-width:190px}
#top .brand{display:flex;align-items:center;padding-right:10px}
#top .brand svg{width:32px;height:32px}
#top .spacer{flex:1}
#top button{min-height:40px;min-width:40px;border:0;background:transparent;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:var(--text)}
#top button:hover{background:var(--soft);filter:none}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.timectl{display:flex;align-items:center;gap:8px}
#top #bPause{background:var(--accent);color:#fff;min-width:96px;font-weight:600;padding:0 14px 0 11px;box-shadow:0 1px 0 rgba(0,0,0,.18)}
#top #bPause:hover{background:var(--accent);filter:brightness(1.08)}
[data-theme="brass"] #top #bPause{color:#1f2428}
#top #bPause .ico{fill:currentColor;stroke:none;width:16px;height:16px}
.stepper{display:flex;align-items:center;background:var(--soft);border-radius:10px;padding:2px}
#top .stepper button{min-height:36px;min-width:36px;padding:0;font-size:20px;line-height:1}
#top .stepper button:disabled{opacity:.3}
.speedBox{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:2px 4px;line-height:1.1}
#speedLbl{font-size:14px;font-weight:600;white-space:nowrap}
.pips{display:flex;gap:3px;margin-top:3px}
#top .pips button{min-height:10px;min-width:0;width:12px;height:6px;padding:0;border-radius:3px;background:color-mix(in srgb,var(--text) 22%,transparent)}
#top .pips button[aria-pressed="true"]{background:var(--accent)}
#top .pips button:hover{background:var(--text2)}
#top #bTurn{font-size:12px;color:var(--text2);border:1px solid var(--hair);min-height:32px;padding:0 10px;border-radius:8px}
#top #bTurn[aria-pressed="true"]{background:var(--soft);color:var(--text);border-color:var(--accent);font-weight:600}
#top #bStep{font-size:12px;min-height:32px;border:1px solid var(--accent);color:var(--accent)}
#behind{font-size:11px;color:var(--warn);border:1px solid var(--warn);padding:2px 6px;border-radius:6px}
#top #bBell{position:relative}
#bellN{position:absolute;top:2px;right:0;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px;font-size:10px;border-radius:8px;background:var(--alarm);color:#fff}
#bellN:empty{display:none}
@media (max-width:1100px){#tSeason{max-width:120px}#top .stat{padding:0 10px}}
@media (max-width:900px){ .hide-s{display:none!important} #top .stat{padding:0 9px} }
@media (max-width:600px){ .hide-xs{display:none!important}
  #top{padding:4px 6px;gap:2px}#top .brand{display:none}#top .stat{padding:0 7px}#top .stat b{font-size:13px}#tSeason{max-width:84px}
  .timectl{gap:4px}#top #bPause{min-width:40px;padding:0 10px}#top #bPause .tx{display:none}
  .speedBox{min-width:50px}#speedLbl{font-size:12px}.pips{display:none}#top .stepper button{min-width:30px}
}
/* instrument strip */
#instr{position:fixed;top:72px;left:8px;display:flex;gap:0;z-index:15;padding:6px 4px;background:var(--glass)}
#instr .g{display:flex;flex-direction:column;align-items:flex-start;padding:0 8px;border-left:1px solid var(--hair)}
#instr .g:first-child{border-left:0}
#instr canvas{width:96px;height:66px}
#instr .g span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);padding-left:4px}
@media (max-width:700px){#instr{display:none}}
/* presets: compact camera popover */
#presets{position:fixed;left:8px;top:192px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;z-index:15;padding:3px;background:var(--glass)}
#presets #camBtn{min-height:34px;min-width:0;border:0;background:transparent;font-size:12px;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;color:var(--text);border-radius:9px}
#presets #camBtn:hover{background:var(--soft);filter:none}
#presets #camBtn .caret{width:12px;height:12px;transition:transform .15s}
#presets.open #camBtn .caret{transform:rotate(180deg)}
#camCur{color:var(--text2)}
#presets .list{display:none;flex-direction:column;gap:1px;width:100%;border-top:1px solid var(--hair);padding-top:3px}
#presets.open .list{display:flex}
#presets .list button{min-height:32px;min-width:0;border:0;background:transparent;font-size:12px;text-align:left;padding:0 10px;border-radius:7px;color:var(--text)}
#presets .list button:hover{background:var(--soft);filter:none}
#presets .list button[aria-pressed="true"]{background:var(--accent);color:#fff}
[data-theme="brass"] #presets .list button[aria-pressed="true"]{color:#1f2428}
@media (max-width:700px){#presets{top:72px}}
/* chips */
#chips{position:fixed;top:72px;right:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:15;max-width:300px}
.chip{padding:6px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.chip.amber{border-color:var(--warn);color:var(--warn);animation:pulse 1.6s ease-in-out infinite}
.chip.red{border-color:var(--alarm);color:var(--alarm);font-weight:600}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(197,139,42,.0)}50%{box-shadow:0 0 0 5px rgba(197,139,42,.35)}}
/* toolbar: floating dock */
#tools{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:2px;padding:5px;z-index:20;max-width:calc(100vw - 16px);background:var(--glass)}
#tools .grp{display:flex;gap:2px;padding:0 5px;border-left:1px solid var(--hair);align-items:center}
#tools .grp:first-child{border-left:0}
#tools button[data-tool]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:62px;min-height:52px;padding:4px 6px;border:0;background:transparent;border-radius:9px;color:var(--text2);font-size:11px;letter-spacing:.02em;white-space:nowrap}
#tools button[data-tool]:hover{background:var(--soft);color:var(--text);filter:none}
#tools button[data-tool][aria-pressed="true"]{background:var(--accent);color:#fff}
[data-theme="brass"] #tools button[data-tool][aria-pressed="true"]{color:#1f2428}
#tools .tl{max-width:68px;overflow:hidden;text-overflow:ellipsis}
#tools select{max-width:150px;min-height:40px;font-size:12px;border-radius:9px;background:var(--soft);border-color:transparent}
@media (max-width:900px){#tools button[data-tool]{min-width:50px;padding:4px 3px}#tools .grp{padding:0 2px}#tools select{max-width:96px}}
@media (max-width:640px){
  :root{--dockH:124px}
  #tools{left:8px;right:8px;transform:none;flex-wrap:wrap;justify-content:center;max-width:none;padding:4px;bottom:8px;gap:2px 0}
  #tools .grp:last-child{order:-1;width:100%;border-left:0;padding:0 2px 3px;border-bottom:1px solid var(--hair);margin-bottom:2px}
  #tools select{max-width:none;width:100%;min-height:36px}
  #tools .grp{padding:0 2px}
  #tools button[data-tool]{min-width:0;flex:1;min-height:50px;font-size:9.5px;padding:3px 0}
  #tools .grp:not(:last-child){flex:1 1 auto}
  #tools .grp:nth-child(1){flex:4 1 0}#tools .grp:nth-child(2){flex:2 1 0}#tools .grp:nth-child(3){flex:3 1 0}
  #tools .tl{max-width:none;font-size:9px;letter-spacing:0}
  #chips{top:116px;max-width:240px}
}
/* panel: centered floating Oxford field notebook */
#panel{
  position:fixed;left:50%;top:calc(50% - 8px);transform:translate(-50%,-50%);
  width:min(620px,calc(100vw - 24px));max-height:calc(100vh - var(--dockH) - 94px);
  z-index:25;display:flex;flex-direction:column;overflow:hidden;
  border-radius:4px 12px 12px 4px;
  border:1px solid #9c9279;border-left:14px solid #1d3557;
  background-color:#fdfaf1;
  background-image:
    radial-gradient(circle at 12px 14px,#3e4756 3.6px,#1f2630 4.5px,transparent 5.2px),
    linear-gradient(90deg,#d8e2ec 0,#d8e2ec 22px,transparent 22px),
    linear-gradient(90deg,transparent 48px,rgba(194,78,66,.30) 48px,rgba(194,78,66,.30) 49px,transparent 49px,transparent 52px,rgba(194,78,66,.18) 52px,rgba(194,78,66,.18) 53px,transparent 53px),
    repeating-linear-gradient(180deg,transparent 0 27px,rgba(68,116,166,.13) 27px 28px);
  background-size:24px 28px,24px 100%,100% 100%,100% 28px;
  background-position:0 10px,0 0,0 0,0 0;
  background-repeat:repeat-y,no-repeat,no-repeat,repeat;
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.7),
    3px 3px 0 #efe8d5,
    4px 4px 0 #c6baa0,
    6px 6px 0 #e7dfc9,
    7px 7px 0 #b4a78c,
    0 20px 46px rgba(15,20,28,.34);
  color:#23252a;
}
#panel::before{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:16px;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(180deg,transparent 0 9px,#8c99aa 9px 12px,#eef3f8 12px 14px,#5b6573 14px 16px,transparent 16px 28px);
  border-radius:0 3px 3px 0;opacity:.92;
}
[data-theme="brass"] #panel{
  border-color:#68563a;border-left-color:#3a2e1d;
  background-color:#1e252c;color:#ede6d5;
  background-image:
    radial-gradient(circle at 12px 14px,#11161b 3.6px,#0b0f13 4.5px,transparent 5.2px),
    linear-gradient(90deg,#161c22 0,#161c22 22px,transparent 22px),
    linear-gradient(90deg,transparent 48px,rgba(205,112,92,.28) 48px,rgba(205,112,92,.28) 49px,transparent 49px,transparent 52px,rgba(205,112,92,.16) 52px,rgba(205,112,92,.16) 53px,transparent 53px),
    repeating-linear-gradient(180deg,transparent 0 27px,rgba(139,187,224,.10) 27px 28px);
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.06),
    3px 3px 0 #262f37,
    4px 4px 0 #4d412d,
    0 22px 50px rgba(0,0,0,.55);
}
[data-theme="brass"] #panel::before{
  background:repeating-linear-gradient(180deg,transparent 0 9px,#9d7c49 9px 12px,#e0be83 12px 14px,#654e2c 14px 16px,transparent 16px 28px);
}
#panel.split{width:min(760px,calc(100vw - 24px))}
#panel.compact{width:min(500px,calc(100vw - 24px))}
#panel.notebook{width:min(700px,calc(100vw - 24px))}
#panel .nb-nav{display:flex;gap:3px;padding:6px 12px 0 60px;background:rgba(29,53,87,.06);border-bottom:1px solid rgba(68,116,166,.22);overflow-x:auto;scrollbar-width:none}
[data-theme="brass"] #panel .nb-nav{background:rgba(0,0,0,.18);border-bottom-color:rgba(176,141,87,.25)}
#panel .nb-nav button{min-height:28px;min-width:0;padding:3px 9px;font-size:11px;font-weight:600;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--text2);white-space:nowrap}
#panel .nb-nav button:hover{background:rgba(68,116,166,.09);color:var(--text);filter:none}
#panel .nb-nav button[aria-pressed="true"]{background:#fdfaf1;color:#1d3557;border-color:rgba(68,116,166,.28);box-shadow:inset 0 2.5px 0 var(--nb-c,#1d3557)}
[data-theme="brass"] #panel .nb-nav button[aria-pressed="true"]{background:#1e252c;color:#ece6d8;border-color:rgba(176,141,87,.4);box-shadow:inset 0 2.5px 0 var(--nb-c,#e0b25a)}
#panel header{display:flex;align-items:center;gap:8px;padding:9px 14px 7px 60px;border-bottom:1.5px solid rgba(68,116,166,.26);background:transparent}
[data-theme="brass"] #panel header{border-bottom-color:rgba(176,141,87,.28)}
#panel header h2{flex:1;margin:0;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:18px;letter-spacing:.01em}
#panel #pClose{min-height:32px;min-width:32px;padding:0;border-radius:50%;background:transparent;border-color:rgba(68,116,166,.28)}
#pBody{overflow:auto;padding:10px 16px 14px 60px;flex:1}
.tabs{display:flex;gap:4px;padding:6px 14px 0 60px;margin-top:0;flex-wrap:wrap;border-bottom:1px solid rgba(68,116,166,.18)}
.tabs button{border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:none;min-height:34px;font-size:12px;background:transparent;color:var(--text2);padding:0 12px}
.tabs button:hover{background:rgba(68,116,166,.08);filter:none;color:var(--text)}
[data-theme="field"] .tabs button{background:transparent}
[data-theme="field"] .tabs button[aria-pressed="true"]{background:rgba(255,255,255,.72);color:#1d3557;border-color:rgba(68,116,166,.28);box-shadow:inset 0 2.5px 0 #a3472c}
[data-theme="brass"] .tabs button[aria-pressed="true"]{background:rgba(255,255,255,.07);color:#ece6d8;border-color:rgba(176,141,87,.35);box-shadow:inset 0 2.5px 0 var(--accent)}
.section{border:1px solid var(--border);border-radius:6px;padding:8px;margin:8px 0;background:var(--raised)}
#panel .section{background:rgba(255,255,255,.46);border:1px solid rgba(68,116,166,.20);border-radius:6px;box-shadow:none}
[data-theme="brass"] #panel .section{background:rgba(0,0,0,.18);border-color:rgba(176,141,87,.22)}
@media (max-width:600px){
  #panel{width:calc(100vw - 12px);border-left-width:10px}
  #panel::before{width:12px}
  #panel .nb-nav,#panel header,.tabs,#pBody{padding-left:42px}
}
/* card */
#card{position:fixed;z-index:30;width:320px;max-width:calc(100vw - 16px);padding:10px;max-height:70vh;overflow:auto}
#card h3{display:flex;justify-content:space-between;align-items:center;margin-top:0}
#card .x{min-height:36px;min-width:36px;padding:0}
#card::after{content:"";position:absolute;width:12px;height:12px;background:inherit;border-left:1px solid var(--border);border-bottom:1px solid var(--border);left:-7px;top:24px;transform:rotate(45deg);display:var(--arrow,block)}
.seg{display:flex;gap:4px}
.seg button{flex:1}
/* tooltip */
#tip{position:fixed;z-index:40;pointer-events:none;padding:4px 8px;font-size:12px;border-radius:6px;white-space:nowrap}
/* drawer */
#drawer{position:fixed;left:8px;right:8px;bottom:calc(var(--dockH) + 10px);height:48vh;z-index:24;display:flex;flex-direction:column}
#drawer header{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border)}
#drawer .body{display:grid;grid-template-columns:2fr 1fr;gap:10px;padding:10px;overflow:auto;flex:1}
#drawer canvas.chart{width:100%;height:120px;display:block;border:1px solid var(--border);border-radius:6px;background:var(--raised)}
@media (max-width:900px){
#drawer .body{grid-template-columns:1fr}}
#hgl{width:100%;height:110px;border:1px solid var(--border);border-radius:6px;background:var(--raised)}
#hgl.amber{box-shadow:0 0 0 2px var(--warn)} #hgl.red{box-shadow:0 0 0 2px var(--alarm)}
#pBody{overflow-x:auto}
table.rules{width:100%;min-width:760px;border-collapse:collapse;font-size:12px}
table.rules td{padding:2px}
table.rules select,table.rules input{min-height:36px;width:100%;font-size:12px}
table.rules select{min-width:128px;padding-left:8px}
table.rules input[type=number]{min-width:60px;padding:0 6px}
table.rules td{padding:3px}
/* ---- custom controls ---- */
button{border-radius:9px;font-weight:500;min-height:40px;border-color:var(--hair)}
.section{border-radius:12px;border-color:var(--hair);padding:10px 12px}
.seg{gap:3px;background:var(--soft);padding:3px;border-radius:11px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:36px}
.seg button:hover{background:var(--soft);filter:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
[data-theme="brass"] .seg button[aria-pressed="true"]{color:#1f2428}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:24px;min-height:0;margin:0;border-radius:12px;background:color-mix(in srgb,var(--text) 24%,transparent);position:relative;cursor:pointer;transition:background .15s;border:0;vertical-align:middle}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
input[type=checkbox]:checked{background:var(--accent)}
input[type=checkbox]:checked::after{transform:translateX(16px)}
label.row:has(>input[type=checkbox]){flex-wrap:nowrap;justify-content:space-between;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--hair);cursor:pointer}
label.row:has(>input[type=checkbox])>input{order:2}
label.row:has(>input[type=checkbox]):last-child{border-bottom:0}
table.rules input[type=checkbox]{width:34px;height:20px}

    h=118+22*fbm(tp,0,x/380,z/380)+8*fbm(tp,8,x/130,z/130)+3*fbm(tp,16,x/45,z/45);
    const dux=x-L.up.x,duz=z-L.up.z;h+=92*Math.exp(-(dux*dux+duz*duz)/(2*360*360));
    const dlx=x-L.lo.x,dlz=z-L.lo.z;h-=10*Math.exp(-(dlx*dlx+dlz*dlz)/(2*420*420));
    // notch through the rim toward the lower lake, closed by the dam
    const nx=x-L.dam.x,nz=z-L.dam.z;const along=nx*L.dir.x+nz*L.dir.z,across=-nx*L.dir.z+nz*L.dir.x;
    const Lp=L.phDist;const sg=s.sculpt?SC.openSig(s,along,Lp):40;let w=Math.exp(-across*across/(2*sg*sg));if(along>Lp)w*=Math.exp(-(along-Lp)*(along-Lp)/(2*30*30));if(along<-40)w*=Math.exp(-(along+40)*(along+40)/(2*50*50));
    const nv=(s.upper.bottom+1)+(L.padY-s.upper.bottom-1)*clamp(along/Lp,0,1);
    if(nv<h)h=h*(1-w)+nv*w;
    h=Math.min(h,bowlH(s.upper,L.up.x,L.up.z,x,z,raw?1:shoreF(s,0,x,z))+0.6*fbm(tp,4,x/30,z/30));
    h=Math.min(h,bowlH(s.lower,L.lo.x,L.lo.z,x,z,raw?1:shoreF(s,1,x,z))+0.5*fbm(tp,6,x/28,z/28));
    // Natural earthen rim around the lower lake so 100%-full water never floods flat outer valleys
    const rMaxL=bowlR(s.lower,s.lower.hMax)*(raw?1:shoreF(s,1,x,z));
    const dLo=Math.sqrt(dlx*dlx+dlz*dlz);
    if(dLo>rMaxL-2&&dLo<rMaxL+55){const rimW=sstep(rMaxL-2,rMaxL+12,dLo)*sstep(rMaxL+55,rMaxL+22,dLo);const yRim=s.lower.bottom+s.lower.hMax+2.8;if(yRim>h)h=h*(1-rimW)+yRim*rimW;}
  } else {
    const cp=s.cp;const xc=cX(cp,z),sl=cSlope(cp,z);const d=absf(x-xc)/Math.sqrt(1+sl*sl);const w=cW(cp,z),b=cBed(cp,z);
    const e=Math.max(0,d-w/2);const Hr=cp.relief;
    h=b+Hr*(1-Math.exp(-e/(cp.m*Hr)));
    const ha=sstep(0,160,e);
    h+=ha*(Hr*0.42*fbm(tp,0,x/420,z/420)+10*fbm(tp,8,x/150,z/150))+3*fbm(tp,16,x/48,z/48)*Math.min(1,e/30+0.25);
    const rw=riverW(cp,z);if(d<rw/2+5){const t=Math.min(1,d/(rw/2));const ch=b-1.8*Math.max(0,1-t*t)-0.25;const bl=sstep(rw/2+5,rw/2,d);h=h*(1-bl)+Math.min(h,ch)*bl;}
    if(L){h=Math.min(h,bowlH(s.lower,L.lo.x,L.lo.z,x,z,raw?1:shoreF(s,1,x,z))+0.5*fbm(tp,6,x/28,z/28));}
  }
  if(s.sculpt){const o=SC.off(s,x,z);if(o!==0){h+=o;if(h<62)h=62;}} // level shaping (zero in protected zones)
  if(L){ // powerhouse pad + tailrace cut + lower-reservoir valve outlet stream channel
    const px=x-L.ph.x,pz=z-L.ph.z;const dp=Math.sqrt(px*px+pz*pz);
    if(dp<46){const bl=sstep(46,26,dp);h=h*(1-bl)+L.padY*bl;}
    const tx=L.tail.x-L.ph.x,tz=L.tail.z-L.ph.z;const tl=Math.sqrt(tx*tx+tz*tz)||1;const u=clamp((px*tx+pz*tz)/(tl*tl),0,1);
    const qx=px-u*tx,qz=pz-u*tz;const dq=Math.sqrt(qx*qx+qz*qz);if(dq<14){const bl=sstep(14,6,dq);const ty=L.padY-1.5;if(ty<h)h=h*(1-bl)+ty*bl;}
    const vs=valveStreamInfo(s,raw);
    if(vs){
      const rx=x-vs.ox,rz=z-vs.oz;const along=rx*vs.dx+rz*vs.dz;const lat0=-rx*vs.dz+rz*vs.dx;const alat0=absf(lat0);
      // 1. Earthen ridge / mound that holds back the lower lake and hides the buried pipe
      if(along>vs.rMax-6&&along<vs.dOut+4&&alat0<34){
        const wM=sstep(vs.rMax-6,vs.rMax+7,along)*sstep(vs.dOut+4,vs.dOut-7,along)*sstep(34,10,alat0);
        const yM=Math.max(h,vs.yCrest);
        h=h*(1-wM)+yM*wM;
      }
      // 2. Plunge pool & wide flat-bottomed creek channel starting at the far/outside edge of the ridge
      if(along>vs.dOut-4){
        const meand=12*Math.sin(Math.max(0,along-(vs.dOut+4))/65);
        const lat=lat0-meand;
        const alat=absf(lat);
        if(alat<30){
          const yBed=(vs.y0-2.2)-0.036*Math.max(0,along-vs.dOut);
          const yChan=yBed+Math.pow(Math.max(0,(alat-6.5)/20),1.5)*14;
          const bl=sstep(vs.dOut-4,vs.dOut+3,along)*sstep(30,8,alat);
          if(yChan<h)h=h*(1-bl)+yChan*bl;
        }
      }
    }
  }
  return h;
}

/* ---------- reservoir geometry §3.1: V(h)=a1·h + a2·h² + a3·h³ ---------- */
function resVol(r,h){return r.a1*h+r.a2*h*h+r.a3*h*h*h;}
function resArea(r,h){return r.a1+2*r.a2*h+3*r.a3*h*h;}
function resLevel(r,V){if(V<=0)return 0;if(r.a3===0){if(r.a2===0)return V/r.a1;return (-r.a1+Math.sqrt(r.a1*r.a1+4*r.a2*V))/(2*r.a2);}
  let h=Math.min(Math.sqrt(V/Math.max(r.a2,1e-9)),Math.pow(V/r.a3,1/3));for(let i=0;i<40;i++){h=Math.max(0,h-(resVol(r,h)-V)/Math.max(1e-6,resArea(r,h)));}return h;}
function capU(s){return s.dam.built?resVol(s.upper,Math.max(0,s.dam.height-CONFIG.res.freeboard)):0;}
function capL(s){return resVol(s.lower,s.lower.hMax);}

/* ---------- layout ---------- */
function bowlR(r,h){return Math.sqrt((r.a1+2*r.a2*h+3*r.a3*h*h)/PI);}
function classicLayout(s){
  const C=CONFIG.classic;let up={x:C.upper.x,z:C.upper.z},lo={x:C.lower.x,z:C.lower.z};
  if(s.sculpt){const T=SC.xf(s.sculpt.gen);up=T(up,true);lo=T(lo,true);}
  let dx=lo.x-up.x,dz=lo.z-up.z;const dl=Math.sqrt(dx*dx+dz*dz);dx/=dl;dz/=dl;
  const rD=bowlR(s.upper,28)+15;const dam={x:up.x+dx*rD,z:up.z+dz*rD,dx:-dz,dz:dx,span:62,arc:true,cx:up.x,cz:up.z,r:rD};
  const rP=bowlR(s.lower,C.lower.hMax)+30;const ph={x:lo.x-dx*rP,z:lo.z-dz*rP,yaw:0};
  const rT=bowlR(s.lower,C.lower.h0)-10;const tail={x:lo.x-dx*rT,z:lo.z-dz*rT};
  const padY=s.lower.bottom+CONFIG.cav.setT-2;
  const phDist=Math.sqrt((ph.x-dam.x)*(ph.x-dam.x)+(ph.z-dam.z)*(ph.z-dam.z));
  let parcels=[{x:-430,z:330},{x:430,z:-400},{x:-120,z:600}];
  if(s.sculpt){const T=SC.xf(s.sculpt.gen);parcels=parcels.map(p=>T(p,false));}
  return {up,lo,dir:{x:dx,z:dz},dam,ph,tail,padY,phDist,parcels,size:1600};
}
function procLayout(s){
  const cp=s.cp,zd=s.station,P=CONFIG.proc;const zL=zd+P.lowerOffset;
  const lo={x:cX(cp,zL),z:zL};const Lres=Math.max(10,s.dam.height)/cp.S0;const zu=Math.max(-780,zd-Lres*0.5);
  const up={x:cX(cp,zu),z:zu};
  const sl=cSlope(cp,zd);const tl=Math.sqrt(1+sl*sl);const tx=sl/tl,tz=1/tl;
  const w=cW(cp,zd);const dam={x:cX(cp,zd),z:zd,dx:tz,dz:-tx,span:w/2+cp.m*P.maxDam*0.6+20,arc:false};
  const side=(cX(cp,zL)-cX(cp,zd))>0?-1:1;
  const rP=bowlR(s.lower,P.lowerHMax);
  const ph={x:lo.x+side*rP*0.55,z:lo.z-rP*0.82,yaw:0};
  const rT=bowlR(s.lower,P.lowerH0)-8;let tdx=lo.x-ph.x,tdz=lo.z-ph.z;const td=Math.sqrt(tdx*tdx+tdz*tdz)||1;
  const phd=Math.sqrt((lo.x-ph.x)*(lo.x-ph.x)+(lo.z-ph.z)*(lo.z-ph.z));
  const tail={x:ph.x+tdx/td*(phd-rT),z:ph.z+tdz/td*(phd-rT)};
  const padY=s.lower.bottom+CONFIG.cav.setT-2;
  let dx=ph.x-dam.x,dz=ph.z-dam.z;const dl=Math.sqrt(dx*dx+dz*dz)||1;
  const parcels=[];const zs=[zd+170,zd-160,zL+120];
  for(let i=0;i<3;i++){const z=clamp(zs[i],-700,700);const sd=i===1?-side:side;const x=clamp(cX(cp,z)+sd*310,-700,700);parcels.push({x,z});}
  return {up,lo,dir:{x:dx/dl,z:dz/dl},dam,ph,tail,padY,phDist:dl,parcels,size:1600,side};
}
function penstockRoute(s){ // polyline from the dam intake to the powerhouse, sampled on terrain (metres)
  const L=s.layout;const pts=[];const N=16;
  const sx=L.dam.x+L.dir.x*10,sz=L.dam.z+L.dir.z*10,ex=L.ph.x-L.dir.x*14,ez=L.ph.z-L.dir.z*14;
  pts.push({x:L.dam.x-L.dir.x*6,z:L.dam.z-L.dir.z*6,y:s.upper.bottom+2});
  for(let i=0;i<=N;i++){const t=i/N;const x=sx+(ex-sx)*t,z=sz+(ez-sz)*t;pts.push({x,z,y:terrainH(s,x,z,true)+0.9});}
  pts.push({x:L.ph.x,z:L.ph.z,y:L.padY+3});
  return pts;
}
function routeLen(pts){let l=0;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];l+=Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y)+(a.z-b.z)*(a.z-b.z));}return l;}
function chokePoints(cp){const P=CONFIG.proc;const out=[];let prev=cW(cp,P.stationMin-10),cur=cW(cp,P.stationMin);
  for(let z=P.stationMin;z<=P.stationMax;z+=5){const nxt=cW(cp,z+5);if(cur<=prev&&cur<=nxt&&cur<cp.w0*P.chokeMaxW)out.push({z,w:cur,x:cX(cp,z)});prev=cur;cur=nxt;}
  if(out.length===0){let best=P.stationMin,bw=1e9;for(let z=P.stationMin;z<=P.stationMax;z+=5){const w=cW(cp,z);if(w<bw){bw=w;best=z;}}out.push({z:best,w:bw,x:cX(cp,best)});}
  return out;}

/* ---------- site construction ---------- */
function emptyTiles(){const t=[];for(let i=0;i<48;i++)t.push({solar:null,wind:null,battery:null});return t;}
function tileRC(i){const p=iint(i/16);const k=i-p*16;const r=iint(k/4);return {p,r,c:k-r*4};}
function baseSite(id,name,kind,seed){

    acc:{eGen:0,ePump:0,eRen:0,eRenAvail:0,eBin:0,eBout:0,eNet:0,envUnmet:0,callE:0,qGenV:0,qPumpV:0},
    hist:[],yr:{eRen:0,capH:0},ledger:{transfer:0,riverIn:0,rainU:0,rainL:0,evapU:0,evapL:0,spillU:0,spillL:0,env:0,valve:0,runoffU:0,runoffL:0}};

function makeClassicSite(seed){
  const C=CONFIG.classic;const s=baseSite(0,'Twin Tarns (Classic)','classic',seed);
  Object.assign(s.upper,{a1:C.upper.a1,a2:C.upper.a2,a3:0,bottom:C.upper.bottom});
  Object.assign(s.lower,{a1:C.lower.a1,a2:C.lower.a2,a3:0,bottom:C.lower.bottom,hMax:C.lower.hMax,excav:0});
  s.upper.V=resVol(s.upper,C.upper.h0);s.lower.V=resVol(s.lower,C.lower.h0);
  s.dam={cls:C.damCls,height:C.damH,built:true,value:damCost('earth',0,C.damH,120),crack:null,raising:null,storm:false,stormSpill:false,crestLen:120};
  s.layout=classicLayout(s);s.penstock.L=CONFIG.penstock.classicL;s.envQ=C.envQ;s.maxDam=C.maxDam;s.route=penstockRoute(s);
  return s;
}
function makeProcSite(id,name,seed,bias,river,station,height){
  const P=CONFIG.proc;const s=baseSite(id,name,'proc',seed);s.bias=bias;s.river=river;s.cp=canyonParams(seed,bias,river);
  s.station=clamp(station,P.stationMin,P.stationMax);const cp=s.cp;const w=cW(cp,s.station);
  Object.assign(s.upper,{a1:0,a2:w/(2*cp.S0),a3:cp.m/(3*cp.S0),bottom:cBed(cp,s.station)});
  const zL=s.station+P.lowerOffset;
  Object.assign(s.lower,{a1:P.lowerA1,a2:P.lowerA2,a3:0,bottom:cBed(cp,zL)-P.lowerDrop,hMax:P.lowerHMax,excav:0});
  s.lower.V=resVol(s.lower,P.lowerH0);s.maxDam=P.maxDam;
  s.envQ=P.envFrac*P.baseFlow[river];s.riverStore=P.baseFlow[river]*P.riverK;
  if(height>0){const h=iint(height);s.dam={cls:h>32?(h>48?'arch':'gravity'):'earth',height:h,built:true,value:0,crack:null,raising:null,storm:false,stormSpill:false,crestLen:w+2*cp.m*h};
    s.dam.value=damCost(s.dam.cls,0,h,s.dam.crestLen);s.upper.V=resVol(s.upper,Math.max(0,h-CONFIG.res.freeboard))*0.6;}
  s.layout=procLayout(s);s.route=penstockRoute(s);s.penstock.L=routeLen(s.route)+20;
  return s;
}
function damCost(cls,h0,h1,crest){ // §9.2 cost of raising wall from h0 to h1 (integrated face area, thickening with height)
  const c=CONFIG.dam.classes[cls].costM2;let cost=0;const n=Math.max(1,iint((h1-h0)*2+0.5));const dh=(h1-h0)/n;
  for(let i=0;i<n;i++){const hm=h0+(i+0.5)*dh;cost+=c*crest*dh*(1+hm/CONFIG.dam.crestFactor);}return cost;}
function crestLen(s,h){return s.kind==='classic'?120:cW(s.cp,s.station)+2*s.cp.m*h;}

function defaultRules(){
  const r=[{on:true,pri:5,cond:'price_lt',val:35,cond2:'upper_lt',val2:95,act:'pump',flow:2.5},
    {on:true,pri:6,cond:'price_gt',val:85,cond2:'upper_gt',val2:8,act:'gen',flow:3},
    {on:false,pri:4,cond:'ren_gt',val:0.3,cond2:'upper_lt',val2:95,act:'pump_local',flow:2.5}];
  for(let i=r.length;i<8;i++)r.push({on:false,pri:1,cond:'always',val:0,cond2:'none',val2:0,act:'idle',flow:0});return r;}

/* ---------- climate §5 ---------- */
function climateAt(seed,H){
  const day=iint(H/24),hour=H-day*24,doy=day-360*iint(day/360);
  const sea=Math.sin(TAU*(doy-45)/360);const aut=Math.max(0,Math.sin(TAU*(doy-135)/360));
  const heat=(sea>0.5&&snoise(seed,31,day/4)>0.68)?1:0;
  const storm=hu(seed,32,day)<0.045+0.05*aut?1:0;
  const T=10+11*sea+5*Math.sin(TAU*(hour-9)/24)+(snoise(seed,33,H/30)-0.5)*6+heat*7-storm*3;
  const cloud=clamp(snoise(seed,34,H/7)*0.9+0.08*(1-sea)+storm*0.6-heat*0.3,0,1);
  const rain=cloud>0.62?(cloud-0.62)*7*(1+storm*2.5):0;
  const wind=Math.max(0,2.2+6*snoise(seed,35,H/5)+0.75*(1-sea)+storm*13+(snoise(seed,37,H/1.5)-0.5)*2);
  const wdir=TAU*snoise(seed,36,H/20);
  return {day,hour,doy,sea,T,cloud,rain,wind,wdir,storm,heat};
}
function sunAt(doy,hr){ // §5.1 solar geometry; vector in world frame (x east, y up, z south)
  const lat=CONFIG.climate.lat*DEG;const dec=23.44*DEG*Math.sin(TAU*(doy-45)/360);const w=(hr-12)*15*DEG;
  const se=Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(w);
  const east=-Math.cos(dec)*Math.sin(w),north=Math.cos(lat)*Math.sin(dec)-Math.sin(lat)*Math.cos(dec)*Math.cos(w);
  return {se,x:east,y:se,z:-north,Gc:se>0?1050*Math.pow(se,1.15):0};
}
function irradiance(cl,sun){return sun.Gc*(1-0.72*Math.pow(cl.cloud,2.2))*(cl.storm?0.6:1);} // §5.2
function priceAt(seed,H,cl,emerg){ // §6.1 duck-curve spot price before own-dispatch impact
  const M=CONFIG.market;const h=cl.hour;const sun=sunAt(cl.doy,h+0.5);const sunF=(sun.Gc/1050)*(1-cl.cloud*0.8);
  const seaSun=0.5+0.5*cl.sea;
  let p=M.base+M.morning*hgauss(h,7.5,1.6)+M.evening*hgauss(h,19,2.0)-M.night*hgauss(h,3,2.5)-(M.dipBase+M.dipSun*seaSun)*sunF
    +M.noise*(snoise(seed,41,H/3)-0.5)*2+M.winter*Math.max(0,-cl.sea)+M.storm*cl.storm+8*cl.heat*hgauss(h,16,3);
  if(emerg)p*=M.emergMult;return p;
}
function emergActive(em,day,hour){return !!em&&em.day===day&&hour>=em.start&&hour<em.start+em.dur;}

/* ---------- hydraulics §2 ---------- */
function hydraulics(s,Q){ // §2.2 Darcy–Weisbach with Swamee–Jain friction factor + minor losses
  const P=CONFIG.phys,pen=s.penstock;const D=pen.D;const A=PI*D*D/4;const v=Q/A;const Re=v*D/P.nu;
  const eps=CONFIG.penstock.materials[pen.mat].eps*(1+(CONFIG.penstock.roughGrowth-1)*(1-pen.health/100));
  let f=0;if(Re>2300){const t=Math.log(eps/(3.7*D)+5.74/Math.pow(Re,0.9))/LN10;f=0.25/(t*t);}else if(Re>1)f=64/Re;
  const hv=v*v/(2*P.g);return {v,Re,f,hf:(f*pen.L/D+P.Kminor)*hv,hv};
}
function etaCurve(emax,x){const d=1-x;return Math.max(0,emax*(1-CONFIG.eff.c*d*d));} // §2.4
function healthF(h){const f=CONFIG.eff.healthFloor;return f+(1-f)*h/100;}
function grossHead(s){return (s.upper.bottom+resLevel(s.upper,s.upper.V))-(s.lower.bottom+resLevel(s.lower,s.lower.V));} // §2.1
function genPower(s,Q,Hg){const T=CONFIG.turbine[s.turbine.tier];const h=hydraulics(s,Q);const Hn=Hg-h.hf;const eta=etaCurve(T.eta,Q/T.Qr)*healthF(s.turbine.health);
  return {P:Math.max(0,CONFIG.phys.rho*CONFIG.phys.g*Q*Hn*eta),Hn,eta,h};} // §2.3 P=ρgQHnη
function pumpPower(s,Q,Hg){const Pm=CONFIG.pump[s.pump.tier];const h=hydraulics(s,Q);const H=Hg+h.hf;const eta=Math.max(0.2,etaCurve(Pm.eta,Q/Pm.Qr)*healthF(s.pump.health));
  return {P:CONFIG.phys.rho*CONFIG.phys.g*Q*H/eta,H,eta,h};} // §2.3 P=ρgQH/η
function solveQ(fn,s,Hg,Pt,qmax){let lo=0,hi=qmax;if(fn(s,hi,Hg).P<=Pt)return hi;for(let i=0;i<30;i++){const m=(lo+hi)/2;if(fn(s,m,Hg).P<Pt)lo=m;else hi=m;}return (lo+hi)/2;}
function reserveCap(s){ // §7.2 power reachable within the response window at the shared ramp rate
  if(!s.dam.built||s.turbine.busy||s.penstock.busy||s.turbine.health<=0)return 0;
  const T=CONFIG.turbine[s.turbine.tier];const Hg=grossHead(s);if(s.q<0)return pumpPower(s,-s.q,Hg).P;
  const q0=Math.max(0,s.q);const q1=Math.min(T.Qr*CONFIG.eff.xMaxT,q0+CONFIG.ramp.rate*CONFIG.reserve.window);
  return Math.max(0,genPower(s,q1,Hg).P-(q0>0?genPower(s,q0,Hg).P:0));
}

function stepBatteries(st,s,dt,cb){ // §7.4 batteries: RTE split evenly, SOC window, cycle fade

function stepReservoirs(st,s,dt){ // §3.2 exact mass balance: ΔV = Σ Q·dt

function addJob(st,site,kind,hours,p){const sec=st.demo&&(kind==='raise'||kind==='excavate'||kind==='build')?0:hours*3600;const j={id:st.nextJob++,site,kind,rem:sec,total:Math.max(1,sec),p};

/* ---------- step §1 ---------- */
function step(st){
  if(!st.started||st.bankrupt)return 0;
  while(st.queue.length)applyAction(st,st.queue.shift());
  if(st.god.stale){st.god.stale=false;if(st.god.enabled&&st.god.planner)godPlan(st);}
  let dt=CONFIG.time.dtBySpeed[st.speed];const rem=3600-st.secInHour;if(dt>rem)dt=rem; // never cross an hour boundary
  for(let i=0;i<st.sites.length;i++){const s=st.sites[i];stepWeather(st,s,dt);stepRenewables(st,s,dt);stepPlant(st,s,dt);stepReservoirs(st,s,dt);stepWear(st,s,dt);stepAccumulate(st,s,dt);}
  stepJobs(st,dt);
  for(const s of st.sites){if(s.call&&s.call.el>=CONFIG.reserve.callDur)endCall(st,s);}
  st.secInHour+=dt;st.t+=dt;st.tick++;
  if(st.secInHour>=3600){st.secInHour=0;settleHour(st);st.hour++;st.H++;if(st.hour>=24){st.hour=0;dayBoundary(st);}climateHour(st);hourEvents(st);godHour(st);checkQuests(st);if(st.turnMode)st.turnPending=false;}
  return dt;
}
function endCall(st,s){const c=s.call;const R=CONFIG.reserve;const avg=c.t>0?c.sum/c.t:0;const ok=avg>=R.okFrac*c.mw*1e6&&c.last>=R.okFrac*c.mw*1e6;

/* ---------- hourly settlement §6.3 ---------- */

function settleHour(st){

    const net=rev+avail-om-env;total+=net;st.reserve.revenue+=avail;

    s.yr.eRen+=a.eRen;s.yr.capH+=renCapMW(s);

}
function hourEvents(st){

}
function genContracts(st){const c=st.contracts;c.offers=[];
  const a=0.4+iint(rnd(st,'contracts')*10)/10;c.offers.push({id:'c'+c.nextId++,name:'Evening peak block',mw:a,h0:18,h1:21,days:20,premium:25,penalty:120,firm:true});

/* ---------- god mode §10: forecast-driven exact planner ---------- */
/* The 24 h market.forecast is priceAt() at the settled hours (the same function the sim settles with), so it is exact
   except for a grid emergency that is not yet scheduled (a new one is drawn at each midnight, p = 0.1/day). The planner is a
   finite-horizon dynamic program over the discretised upper-lake volume (linear interpolation between nodes, continuous
   refinement of the executed flow) for the hydro unit, plus a second DP over state of charge for every battery, coordinated by
   two alternating sweeps. A shadow price of stored water (terminal value) is bisected so the plan returns to its starting

const GODP={nodes:48,genX:[0.15,0.3,0.45,0.6,0.75,0.9,1.0,1.1],pumpX:[0.5,0.65,0.8,0.95,1.1],iters:9,bNodes:25,bFrac:[-1,-0.75,-0.5,-0.25,0,0.25,0.5,0.75,1]};

function renForecastMW(st,s,cl,hour,onlyTile){ // mean renewable output over an hour (MW) from the climate model; 3 sub-samples of the sun path

  for(let i=0;i<48;i++){const t=s.tiles[i];if(onlyTile>=0&&i!==onlyTile)continue;if((!t.solar||t.solar.building)&&(!t.wind||t.wind.building))continue;const rc=tileRC(i);
    if(t.solar&&!t.solar.building){const tier=S.tiers[t.solar.tier];let sh=1;if(t.wind)sh*=S.shadeSame;if(rc.r<3){const n=s.tiles[i+4];if(n&&n.wind)sh*=S.shadeNorth;}

      const v=cl.wind*(0.9+0.25*hu(s.seed,5,1))*Math.pow(tier.hub/10,W.shear)*Math.pow(W.wake,up);let p=0;

function godCtx(st,s){ // per-hour planning inputs for a site: forecast price, contracts, curtailment permission, renewable forecast

  let d=st.day,hh=st.hour,nat=0;

    if(aU>0){const melting=cl.T>=CONFIG.snow.tSnow,rainMS=melting?cl.rain/1000/3600:0,ev=s.ice>0.5?0:RS.evapK*Math.max(0,cl.T)*(1+0.5*cl.heat)*(1-0.6*cl.cloud)/1000/86400;nat+=rainMS*aU+rainMS*RS.runoffK*catchU-ev*aU;} // exact rain, runoff and evaporation of the forecast climate

function godRevFn(ctx,R){ // hourly settlement value of a total net export T0 (MW) plus curtailable renewables R[k]: price impact, curtailment optimum, contracts
  const imp=CONFIG.market.impact;
  return function(k,T0){const p=ctx.price[k];const r=R[k];let n=T0+r;
    if(r>0&&ctx.curt[k]){const ns=p/(2*imp);n=ns<T0?T0:(ns>n?n:ns);} // argmax of n(p-imp·n) clipped to what curtailment can reach

function godSolveLam(fun,target,lamMax,hint,tol,maxIt){ // monotone root find (Illinois regula falsi) for the shadow price whose plan ends at the target state; warm-started by the previous hour's price

    if(fh<target){a=hint;fa=fh;b=Math.min(lamMax,hint*1.5);fb=fun(b);while(fb<target&&b<lamMax){a=b;fa=fb;b=Math.min(lamMax,b*1.5);fb=fun(b);}if(fb<target)return lamMax;}
    else{b=hint;fb=fh;a=hint/1.5;fa=fun(a);while(fa>=target&&a>lamMax*1e-6){b=a;fb=fa;a=a/1.5;fa=fun(a);}if(fa>=target){fa=fun(0);if(fa>=target)return 0;a=0;}}}

function quote(st,si,tile,kind,tier){ // §6.5 20-year NPV from seasonal+24h climate forecast; does not mutate state
  const s=st.sites[si];if(!s)return {ok:false,reason:'No such site'};const t=s.tiles[tile];if(!t)return {ok:false,reason:'No such tile'};
  const rc=tileRC(tile);if(!s.parcels[rc.p])return {ok:false,reason:'Parcel not owned'};

  const bc=buildCost(st,si,tile,kind,tier);const S=CONFIG.solar,W=CONFIG.wind;let rev=0,loss=0,energy=0;

      const pw=v=>(v>=W.cutIn&&v<W.cutOut)?(v>=W.rated?1:(v*v*v-W.cutIn*W.cutIn*W.cutIn)/(W.rated*W.rated*W.rated-W.cutIn*W.cutIn*W.cutIn)):0;
      const mul=0.9+0.25*hu(s.seed,5,1);const v=cl.wind*mul*Math.pow(tr.hub/10,W.shear)*Math.pow(W.wake,up);p=tr.kW*1000*pw(v);
      for(let c=rc.c+1;c<4;c++){const o=s.tiles[rc.p*16+rc.r*4+c].wind;if(o){const to=W.tiers[o.tier];let u2=0;for(let cc=0;cc<c;cc++)if(s.tiles[rc.p*16+rc.r*4+cc].wind)u2++;

function tileHTML(snap,s,tile,x){const C=Sim.CONFIG;const rc=Sim.tileRC(tile);const t=s.tiles[tile];

    h+=`<div class="section"><div class="row" style="justify-content:space-between"><b>${{solar:'☀ Solar',wind:'✣ Wind',battery:'▮ Battery'}[k]}</b><span class="seg">${[0,1,2].map(i=>`<button data-fid="t${k}${i}" data-tier="${k}:${i}" aria-pressed="${tier===i}" style="min-width:44px">${i+1}</button>`).join('')}</span></div>`;
    if(occ){h+=`<p class="muted" style="margin:4px 0">${t[k]?'Already built here.':'Not compatible with what is on this tile.'}</p></div>`;continue;}
    const q=Sim.quote(snap,snap.active,tile,k,tier);const bc=Sim.buildCost(snap,snap.active,tile,k,tier);

      <button data-fid="bld${k}" ${J({type:'BUILD',tile,kind:k,tier})}>Build tier ${tier+1}</button></div>`;}

function updPenCost(){const d=$('penD'),m=$('penM'),o=$('penCost'),b=document.querySelector('[data-pen]');if(!d||!o)return;const s=site(Game.getSnapshot());const C=Sim.CONFIG;const same=Math.abs(+d.value-s.penstock.D)<1e-6;if(b)b.disabled=same||s.penstock.busy;

const NB_TABS=[
  ['operate','1 · Operate','#1d6e68'],
  ['build','2 · Build','#4f6b3a'],
  ['automation','3 · Automation','#2f6f86'],
  ['services','4 · Services','#a3472c'],

const PANELS={

  build:{title:'Site Plans — Build',tabs:['Tiles','Plant','Dam & basin','Land & sites']},
  automation:{title:'Dispatch Rules — Automation',tabs:['Rules','God mode'],cls:'notebook'},
  services:{title:'Grid & Upkeep — Services',tabs:['Reserve','Contracts','Maintenance']},
  finance:{title:'Ledger & Milestones — Finance & Quests',tabs:null,cls:'split'},
  world:{title:'Station & View — World & Settings',tabs:['World','Settings'],cls:'compact'},
  save:{title:'Archive — Save / Load',tabs:null,cls:'compact'}

function openPanel(name){
  if(name==='quests')name='finance';
  if(name==='settings'){name='world';UI.tab.world=1;}
  if(name==='lens')name='world';
  if(UI.panel===name){closePanel();return;}
  UI.panel=name;document.body.classList.add('panel-open');
  {const al=document.getElementById('alerts');if(al)al.hidden=true;}
  const p=PANELS[name];const pan=$('panel');pan.hidden=false;
  pan.classList.toggle('split',p.cls==='split');
  pan.classList.toggle('compact',p.cls==='compact');
  pan.classList.toggle('notebook',p.cls==='notebook');
  const nb=$('nbNav');if(nb)nb.innerHTML=NB_TABS.map(x=>`<button type="button" data-nbjump="${x[0]}" style="--nb-c:${x[2]}" aria-pressed="${name===x[0]}">${x[1]}</button>`).join('');
  $('pTitle').textContent=p.title;UI.tab[name]=UI.tab[name]||0;
  $('pTabs').innerHTML=p.tabs?p.tabs.map((t,i)=>`<button data-tab="${i}" aria-pressed="${UI.tab[name]===i}">${t}</button>`).join(''):'';
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===name));
  renderPanel(true);
}

  w.appendChild(mk('−',-1,'Decrease'));w.appendChild(inp);w.appendChild(mk('+',1,'Increase'));});}
(function(){const b=document.getElementById('pBody'),ct=document.getElementById('ctip');if(!b||!ct)return;

function runAudit(Sim){
  const C=Sim.CONFIG;const out=[];let ticks=0,nan=0;const T0=Date.now();
  const add=(name,pass,detail)=>out.push({name,pass:!!pass,detail:String(detail)});
  const fresh=o=>{const st=Sim.newGame(Object.assign({seed:4242},o||{}));Sim.applyAction(st,{type:'START'});return st;};
  const run=(st,n)=>{for(let i=0;i<n;i++){Sim.step(st);ticks++;}};
  const runUntil=(st,cond,max)=>{let i=0;while(!cond(st)&&i<max){Sim.step(st);ticks++;i++;}return i;};
  const countNaN=o=>{let n=0;const walk=v=>{if(typeof v==='number'){if(v!==v)n++;}else if(v&&typeof v==='object'){for(const k in v)walk(v[k]);}};walk(o);return n;};
  // 1–3 mass conservation at dt 1, 5, 30 s
  for(const sp of [0,1,2]){const st=fresh();st.isolate=true;Sim.applyAction(st,{type:'SET_SPEED',speed:sp});const s=st.sites[0];s.reqMode='gen';s.flowSet=1;s.q=1;
    const u0=s.upper.V,l0=s.lower.V,t0=st.t;runUntil(st,x=>x.t-t0>=3600,100000);const du=s.upper.V-u0,dl=s.lower.V-l0;
    add('Mass conservation, dt = '+C.time.dtBySpeed[sp]+' s',Math.abs(du+3600)<1e-3&&Math.abs(dl-3600)<1e-3,'1 m³/s for 1 h: ΔV upper '+du.toFixed(6)+' m³, lower +'+dl.toFixed(6)+' m³');}
  // 4 per-step energy netting
  {const st=fresh({demo:true});const s=st.sites[0];Sim.applyAction(st,{type:'BUILD',tile:1,kind:'battery',tier:0});Sim.applyAction(st,{type:'SET_SPEED',speed:3});Sim.applyAction(st,{type:'SET_MODE',mode:'pump',q:2.5});
    let worst=0;for(let i=0;i<300;i++){Sim.step(st);ticks++;const t=s.tel;worst=Math.max(worst,Math.abs(t.pNet-(t.pGen+t.pRen+t.pBout-t.pPump-t.pBin)));if(i===150)Sim.applyAction(st,{type:'SET_MODE',mode:'gen',q:3});}
    add('Per-step energy netting',worst<1e-6,'max |P_net − (P_gen + P_ren + P_dis − P_pump − P_chg)| = '+worst.toExponential(2)+' W');}
  // 5–8 robustness sweep (batteries, reserve offers, emergencies) + ledger closure
  {const st=fresh({demo:true,seed:777});const s=st.sites[0];Sim.applyAction(st,{type:'BUILD',tile:1,kind:'battery',tier:1});Sim.applyAction(st,{type:'BUILD',tile:2,kind:'wind',tier:1});
    const cap=Sim.reserveCap(s)/1e6;Sim.applyAction(st,{type:'SET_RESERVE_OFFER',mw:cap*0.8});Sim.applyAction(st,{type:'SET_RULES',enabled:true});Sim.applyAction(st,{type:'SET_SPEED',speed:3});
    const u0=s.upper.V,l0=s.lower.V;const L0=JSON.parse(JSON.stringify(s.ledger));let bad=0,hb=0,lastDay=-1;const end=st.day+3;
    while(st.day<end){if(st.day!==lastDay){lastDay=st.day;st.market.emergency={day:st.day,start:12,dur:3};}Sim.step(st);ticks++;
      for(const x of st.sites){if(x.upper.V<-1e-6||x.upper.V>Sim.capU(x)+1e-6||x.lower.V<-1e-6||x.lower.V>Sim.capL(x)+1e-6)bad++;for(const k of ['turbine','pump','penstock'])if(!(x[k].health>=0&&x[k].health<=100))hb++;}}
    const nn=countNaN(st);nan+=nn;add('3-day sweep: no NaN',nn===0,nn+' NaN values; reserve calls '+st.reserve.calls+', battery SOC '+(s.tiles[1].battery.soc*100).toFixed(1)+'%');
    add('3-day sweep: volumes within bounds',bad===0,bad+' violations');add('3-day sweep: health within 0–100',hb===0,hb+' violations');
    const L=s.ledger;const d=k=>L[k]-L0[k];const resU=(s.upper.V-u0)-(-d('transfer')+d('riverIn')+d('rainU')+d('runoffU')-d('evapU')-d('spillU'));
    const resL=(s.lower.V-l0)-(d('transfer')+d('spillU')+d('rainL')+d('runoffL')-d('evapL')-d('env')-d('spillL')-(d('valve')||0));
    add('3-day sweep: reservoir ledger closes',Math.abs(resU)<1e-3&&Math.abs(resL)<1e-3,'residual upper '+resU.toExponential(2)+' m³, lower '+resL.toExponential(2)+' m³');}
  // 9–15 reserve market
  {const st=fresh();st.isolate=true;const s=st.sites[0];Sim.applyAction(st,{type:'SET_SPEED',speed:0});
    const r8=Sim.applyAction(st,{type:'SET_RESERVE_OFFER',mw:0.8});const r7=Sim.applyAction(st,{type:'SET_RESERVE_OFFER',mw:0.7});
    add('Reserve offer 0.8 MW fails',!r8.ok,r8.reason||'accepted (unexpected)');add('Reserve offer 0.7 MW accepted',r7.ok,'deliverable '+(Sim.reserveCap(s)/1e6).toFixed(3)+' MW within '+C.reserve.window+' s');
    Sim.forceCall(st,0,0.7);run(st,45);const P=s.tel.pGen;
    add('Reserve call ramp: Q ≈ 1.65 m³/s after 45 s',Math.abs(s.q-1.65)<0.01,'Q = '+s.q.toFixed(4)+' m³/s');
    add('Reserve call ramp: P ≈ 659 kW after 45 s',Math.abs(P/1000-659)<12,'P = '+(P/1000).toFixed(1)+' kW');
    runUntil(st,x=>!x.sites[0].call,5000);add('Reserve call delivered: score and count',st.reserve.ok===1&&st.reserve.score>0.999,'answered '+st.reserve.ok+'/'+st.reserve.calls+', S = '+st.reserve.score.toFixed(3));
    const rev0=st.reserve.revenue;runUntil(st,x=>x.secInHour===0,5000);add('Reserve availability payment',st.reserve.revenue-rev0>=0.7*C.reserve.availPay-1e-9,'+$'+(st.reserve.revenue-rev0).toFixed(2)+' for the hour');}
  {const st=fresh();st.isolate=true;const s=st.sites[0];Sim.applyAction(st,{type:'SET_SPEED',speed:1});Sim.applyAction(st,{type:'SET_RESERVE_OFFER',mw:0.5});s.turbine.busy=true;Sim.forceCall(st,0,0.5);runUntil(st,x=>!x.sites[0].call,5000);
    add('Reserve fine and score drop when undelivered',st.reserve.fines>0&&st.reserve.score<1,'fine $'+st.reserve.fines.toFixed(0)+', S = '+st.reserve.score.toFixed(3));}
  // 16–18 battery
  {const st=fresh({demo:true});st.isolate=true;const s=st.sites[0];Sim.applyAction(st,{type:'BUILD',tile:5,kind:'battery',tier:1});const b=s.tiles[5].battery;Sim.applyAction(st,{type:'SET_SPEED',speed:3});
    Sim.applyAction(st,{type:'SET_BATTERY',tile:5,mode:'discharge'});runUntil(st,()=>b.soc<=0.1000001,5000);
    Sim.applyAction(st,{type:'SET_BATTERY',tile:5,mode:'charge'});const in0=b.eIn;let mx=0;runUntil(st,()=>{mx=Math.max(mx,b.soc);return b.soc>=0.9499999;},5000);run(st,60);mx=Math.max(mx,b.soc);const eIn=b.eIn-in0;
    Sim.applyAction(st,{type:'SET_BATTERY',tile:5,mode:'discharge'});const o0=b.eOut;let mn=1;runUntil(st,()=>{mn=Math.min(mn,b.soc);return b.soc<=0.1000001;},5000);run(st,60);mn=Math.min(mn,b.soc);const eOut=b.eOut-o0;
    add('Battery SOC window 10–95 %',mx<=0.95+1e-6&&mn>=0.1-1e-6,'min '+(mn*100).toFixed(3)+'%, max '+(mx*100).toFixed(3)+'%');
    add('Battery round-trip efficiency ≈ 90 %',Math.abs(eOut/eIn-0.9)<0.01,'RTE '+(100*eOut/eIn).toFixed(2)+'%');add('Battery cycle fade accumulates',b.fade>0,'fade '+(b.fade*100).toFixed(4)+'%');}
  // 19 environmental flow charge
  {const st=fresh();const s=st.sites[0];Sim.applyAction(st,{type:'SET_SPEED',speed:2});s.lower.V=0;s.valleySnow=0;st.climate=Object.assign({},st.climate,{rain:0});runUntil(st,x=>x.secInHour===0&&x.t>0,1000);

  // 20–24 determinism, save/load, replay
  const scen=(seed,days)=>{const st=fresh({seed});Sim.applyAction(st,{type:'SET_SPEED',speed:5});Sim.applyAction(st,{type:'SET_RULES',enabled:true});let d=0;while(st.day<days){Sim.step(st);ticks++;if(st.day===1&&!d){d=1;Sim.applyAction(st,{type:'SET_RESERVE_OFFER',mw:0.3});}}return st;};

  {const st=scen(2024,10);const sv=JSON.parse(JSON.stringify(Sim.makeSave(st,[])));const err=Sim.validateSave(sv);while(st.day<30){Sim.step(st);ticks++;}const h1=Sim.hashState(st);
    const st2=sv.state;while(st2.day<30){Sim.step(st2);ticks++;}const h2=Sim.hashState(st2);add('Save at day 10, continue to day 30 matches',!err&&h1===h2,h1+' vs '+h2+(err?' ('+err+')':''));
    const bad=Sim.validateSave({schema:'nope',version:1});add('Save schema validation rejects bad files',!!bad,'rejected: '+bad);}
  {const init={seed:3131,kind:'classic',bias:'balanced',river:'medium',station:0,demo:false};const st=Sim.newGame(init);const log=[];const D=a=>{const r=Sim.applyAction(st,a);if(r.ok)log.push({tick:st.tick,a});};
    D({type:'START'});D({type:'SET_SPEED',speed:4});let i=0;while(st.day<4){Sim.step(st);ticks++;i++;if(i===50)D({type:'SET_MODE',mode:'pump',q:2.5});if(i===200)D({type:'SET_MODE',mode:'gen',q:3});if(i===300)D({type:'SET_RULES',enabled:true});if(i===320)D({type:'SET_SPEED',speed:5});}

  $('bBell').onclick=()=>{const a=$('alerts');a.hidden=!a.hidden;renderAlerts();};
  document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{if(!Engine.state)return;const k=b.dataset.tool;if(k==='lens'){UI.lensIdx=(UI.lensIdx+1)%LENSES.length;applyLens();return;}openPanel(k);World.buildMode=UI.panel==='build';});
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{World.preset(b.dataset.preset);document.querySelectorAll('[data-preset]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('siteSel').onchange=e=>act({type:'SET_ACTIVE',site:+e.target.value});$('scadaSite').onchange=e=>{UI.scadaSite=e.target.value;renderDrawer(true);};
  $('pClose').addEventListener('click',()=>{World.buildMode=false;});
  document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'');const inForm=tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA';
    if(e.key==='Escape'){if(inForm)e.target.blur();if(!$('modal').hidden&&Engine.state){$('modal').hidden=true;}else if(UI.survey){$('svCancel')&&$('svCancel').click();}else if(!$('card').hidden)closeCard();else if(UI.panel){closePanel();World.buildMode=false;}else if(!$('drawer').hidden)openDrawer(false);else if(!$('alerts').hidden)$('alerts').hidden=true;else if(!$('debug').hidden)$('debug').hidden=true;e.preventDefault();return;}
    if(e.key==='F1'){e.preventDefault();if(Engine.state)openDrawer();return;}if(e.key==='F2'){e.preventDefault();$('debug').hidden=!$('debug').hidden;renderDebug();return;}
    if(inForm||!$('modal').hidden||!Engine.state)return;const k=e.key.toLowerCase();
    if(k===' '){if(tag==='BUTTON'){if(e.target.id==='bPause'||!e.target.closest('.timectl'))return;e.target.blur();}e.preventDefault();act(Engine.state.started?{type:'PAUSE'}:{type:'START'});return;}
    const MENUS=['operate','build','automation','services','finance','world'];
    if(k>='1'&&k<='6'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const p=MENUS[+k-1];openPanel(p);World.buildMode=UI.panel==='build';return;}
    if(k==='-'||k==='_'){act({type:'SET_SPEED',speed:Engine.state.turnMode?2:Math.max(0,Engine.state.speed-1)});return;}
    if(k==='='||k==='+'){act({type:'SET_SPEED',speed:Engine.state.turnMode?2:Math.min(6,Engine.state.speed+1)});return;}
    if(k==='0'){act(Engine.state.started?{type:'PAUSE'}:{type:'START'});return;}
    if(k==='t'){act({type:'SET_TURN',on:!Engine.state.turnMode});return;}
    if(k==='c'){UI.lensIdx=(UI.lensIdx+1)%LENSES.length;applyLens();return;}
    if(k==='f'){const s=UI.card;if(s&&World.ready){const a=s.anchor||(s.box?[(s.box[0]+s.box[3])/2,(s.box[1]+s.box[4])/2,(s.box[2]+s.box[5])/2]:null);if(a)World.flyTo({tx:a[0],ty:a[1],tz:a[2],dist:150,pitch:0.5},1);}return;}
    if(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0){if(k.startsWith('arrow')&&tag==='BUTTON')return;Engine.keys.add(k);if(k.startsWith('arrow'))e.preventDefault();}});
  document.addEventListener('keyup',e=>Engine.keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>Engine.keys.clear());
  window.addEventListener('beforeunload',()=>{if(Engine.state)autosave();});}
function boot(){try{const s=JSON.parse(Store.get('settings')||'null');if(s)Object.assign(UI.settings,s);}catch(e){}
  if(UI.settings.theme!=='field'&&UI.settings.theme!=='brass')UI.settings.theme='field'; // retired themes (e.g. a stored 'dusk') fall back to the default
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)UI.settings.reduced=true;}catch(e){}
  let ok=false;try{ok=World.init($('gl'));}catch(e){console.error(e);ok=false;}
  if(!ok){const n=$('nogl');n.hidden=false;$('instr').hidden=true;$('presets').hidden=true;
    n.innerHTML=`<h2>3D view unavailable</h2><p>This browser could not start WebGL2, so the diorama cannot be drawn. The station still runs: use the toolbar panels (Operate, Build, Automation…) to dispatch and build with plain forms.</p><div class="seg"><button ${J({type:'SET_MODE',mode:'gen'})}>Generate</button><button ${J({type:'SET_MODE',mode:'pump'})}>Pump</button><button ${J({type:'SET_MODE',mode:'idle'})}>Idle</button></div>`;}
  else{World.onQuality=()=>{UI.settings.quality=World.quality;UI.settings.style=World.style;toast(World.qualityNote,'warn');renderPanel(true);};Engine.preview=Sim.newGame({seed:20240});World.build(Engine.preview.sites[0]);World.cam.dist=1900;}
  applySettings();wire();setupInput();startAudit();
  showStart();raf(loop);}
if(typeof document!=='undefined')boot();

})();
</script>
</body>
