<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hydropower Tycoon</title>
<style>
:root{--r:8px;--fh:Georgia,"Times New Roman",serif;--fn:ui-monospace,Menlo,Consolas,monospace;--fu:system-ui,-apple-system,"Segoe UI",sans-serif;}
body[data-theme=field]{--bg:#f1ead9;--surface:#f1ead9;--raised:#f8f3e6;--text:#2b2a26;--text2:#575244;--border:#b9ab88;--gen:#2f6f86;--pump:#a3472c;--ren:#36588c;--warn:#8a5f10;--alarm:#a3231b;--accent:#4f6b3a;--onaccent:#fff;--pbg:#f1ead9;--blur:none;--fh:Georgia,"Times New Roman",serif;--fu:Georgia,"Times New Roman",serif;--grain:repeating-linear-gradient(45deg,rgba(90,70,30,.035) 0 2px,transparent 2px 5px);}
body[data-theme=brass]{--bg:#1f2428;--surface:#262c31;--raised:#2f373d;--text:#ece6d8;--text2:#b9b2a1;--border:#6b5a3a;--gen:#5aa89b;--pump:#e07a6b;--ren:#7aa7d9;--warn:#e0a63f;--alarm:#ff8272;--accent:#b08d57;--onaccent:#1b1a17;--pbg:#262c31;--blur:none;--fh:"Trebuchet MS",system-ui,sans-serif;--fu:system-ui,sans-serif;--grain:none;}
body[data-theme=dusk]{--bg:#0f1730;--surface:rgba(18,28,58,.72);--raised:rgba(40,56,100,.6);--text:#e8eefc;--text2:#aab7d8;--border:rgba(150,180,255,.28);--gen:#4fd1c5;--pump:#ff8a7a;--ren:#6cb8ff;--warn:#ffc247;--alarm:#ff7070;--accent:#4fd1c5;--onaccent:#06202a;--pbg:rgba(18,28,58,.72);--blur:blur(14px);--fh:system-ui,sans-serif;--fu:system-ui,sans-serif;--grain:none;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#222;color:var(--text);font:14px/1.35 var(--fu);}
body{--fu:var(--fu)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:44px;min-width:44px;padding:6px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--raised);cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
button.on{outline:2px solid var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
select,input[type=text],input[type=number],textarea{min-height:36px;border-radius:6px;border:1px solid var(--border);background:var(--raised);padding:4px 8px}
input[type=range]{width:100%;min-height:32px;accent-color:var(--accent)}
.panel{background:var(--pbg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.28);}
body[data-theme=field] .panel{background-image:var(--grain);}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fh);margin:0 0 6px}
h3{font-size:15px;letter-spacing:.02em}
.sub{color:var(--text2);font-size:12px}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.strip{display:flex;gap:2px;align-items:center;padding:4px 8px}
.kv{display:flex;flex-direction:column;padding:2px 8px;min-width:64px}
.kv b{font-family:var(--fn);font-size:16px;font-weight:600}
.kv span{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
#cashbox{order:0}
#clockbox{margin-left:auto}
#speeds{display:flex;gap:2px;align-items:center}
#speeds button{padding:2px 6px;min-width:36px;min-height:44px;font-family:var(--fn)}
.emblem{width:34px;height:34px;flex:none}
#bar{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px;max-width:calc(100vw - 16px);z-index:5}
#bar button{padding:4px 10px;font-size:13px}
#gauges{position:fixed;left:8px;top:84px;display:none;padding:4px;z-index:4}
body[data-theme=brass] #gauges{display:block}
#card{position:fixed;display:none;width:300px;max-width:92vw;padding:10px;z-index:7}
#card h3{display:flex;justify-content:space-between;align-items:center;gap:6px}
#card .row{display:flex;justify-content:space-between;gap:6px;margin:3px 0}
#card .btns{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
#card .btns button{flex:1;min-width:70px}
#tip{position:fixed;display:none;padding:3px 8px;font-size:12px;pointer-events:none;z-index:8;white-space:nowrap}
#modal{position:fixed;top:64px;right:8px;bottom:64px;width:min(500px,calc(100vw - 16px));overflow:auto;padding:12px;display:none;z-index:9}
#modal .x{position:sticky;top:0;float:right;min-height:36px;min-width:36px;padding:2px}
#drawer{position:fixed;left:8px;right:8px;bottom:64px;max-height:56vh;overflow:auto;padding:10px;display:none;z-index:8}
#drawer .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
canvas.ch{width:100%;height:130px;display:block;background:transparent;border-radius:6px;border:1px solid var(--border)}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{padding:2px 4px;border-bottom:1px solid var(--border);text-align:left}
td.n{font-family:var(--fn);text-align:right}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border-radius:var(--r) var(--r) 0 0;min-height:36px;padding:2px 10px}
.tabs button.on{background:var(--accent);color:var(--onaccent);outline:none}
.chip{display:inline-block;padding:1px 7px;border-radius:5px;border:1px solid currentColor;font-size:11px;font-weight:700;letter-spacing:.05em}
.stamp{display:inline-block;border:2px solid var(--pump);color:var(--pump);border-radius:5px;padding:1px 8px;font-weight:800;transform:rotate(-6deg);letter-spacing:.1em;font-size:11px}
.q{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border)}
.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
#start,#err,#nogl,#debug,#toast{position:fixed;z-index:20}
#start{left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:92vh;overflow:auto;padding:16px;display:none;z-index:12}
#err{left:50%;top:20%;transform:translateX(-50%);width:min(560px,94vw);padding:14px;display:none}
#nogl{inset:0;background:#222;color:#eee;display:none;overflow:auto;padding:20px}
#debug{left:8px;top:90px;width:340px;max-height:70vh;overflow:auto;padding:8px;display:none;font:11px/1.35 var(--fn);z-index:15}
#toast{left:50%;top:70px;transform:translateX(-50%);padding:6px 12px;display:none;z-index:25}
#survey{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:min(560px,94vw);padding:10px;display:none;z-index:11}
.lbl{position:fixed;display:none;padding:1px 6px;font-size:11px;pointer-events:none;z-index:3;white-space:nowrap;transform:translate(-50%,-100%)}
.amber{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.lbl.red{color:var(--alarm)}.lbl.amb{color:var(--warn)}
.warnbox{border:1px solid var(--alarm);color:var(--alarm);padding:4px 8px;border-radius:6px;margin:4px 0;font-weight:600}
label.f{display:flex;gap:8px;align-items:center;margin:4px 0;min-height:32px}
label.f>span:first-child{min-width:130px}
.reduce *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){#clockbox{margin-left:0}.kv{min-width:52px}#modal{top:auto;height:60vh;bottom:64px}}
.hide{display:none!important}
body[data-theme=brass] button{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #0008}
body[data-theme=brass] .panel{border-width:2px}
body[data-theme=brass] h3{text-transform:uppercase;letter-spacing:.12em;font-size:12px}
body[data-theme=field] .tabs button{border-style:solid solid none}
</style>
</head>
<body data-theme="field">
<canvas id="gl" tabindex="0" aria-label="3D hydropower diorama"></canvas>
<div id="top" role="region" aria-label="Status">
 <div id="cashbox" class="panel strip">
  <svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 8h32v5l-3 20H7L4 13z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 20q4-3 8 0t8 0t8 0M9 26q4-3 8 0t8 0t7 0" fill="none" stroke="var(--gen)" stroke-width="2"/></svg>
  <div class="kv"><span>Cash</span><b id="vCash" class="num">$0</b></div>
  <div class="kv"><span>Today</span><b id="vToday" class="num">$0</b></div>
  <div class="kv"><span>Net MW</span><b id="vMW" class="num">0.0</b></div>
  <div class="kv"><span>Spot</span><b id="vPrice" class="num">$0</b></div>
 </div>
 <div id="clockbox" class="panel strip">
  <div class="kv"><span id="vSeason">Spring</span><b id="vClock" class="num">D1 00:00</b></div>
  <div id="speeds" role="group" aria-label="Speed"><button id="bPause" aria-label="Pause (Space)">❚❚</button><button data-sp="0" title="Turn mode">T</button><button data-sp="1">1</button><button data-sp="2">2</button><button data-sp="3">3</button><button data-sp="4">4</button><button data-sp="5">5</button><button data-sp="6">6</button><button id="bTurn" title="Advance one hour (T)">+1h</button></div>
  <span id="vBehind" class="chip hide" style="color:var(--warn)">behind</span>
  <button id="bBell" aria-label="Alerts">🔔<span id="vBell" class="num"></span></button>
  <button id="bOperate" class="pri">Operate</button>
 </div>
</div>
<div id="gauges" class="panel"><canvas id="gaugeCv" width="440" height="110" style="width:440px;max-width:90vw;height:110px"></canvas></div>
<div id="bar" class="panel" role="toolbar" aria-label="Tools">
 <button data-p="build">Build</button><button data-p="auto">Automation</button><button data-p="serv">Services</button><button data-p="fin">Finance</button><button data-p="quest">Quests</button><button data-p="lens">Lens</button><button data-p="view">Views</button><button data-p="set">Settings</button><button data-p="save">Save/Load</button><button data-p="about">About</button>
 <select id="siteSel" aria-label="Site"></select>
</div>
<div id="card" class="panel" role="dialog"></div>
<div id="tip" class="panel"></div>
<div id="modal" class="panel" role="dialog"></div>
<div id="drawer" class="panel" role="region" aria-label="SCADA"></div>
<div id="start" class="panel"></div>
<div id="survey" class="panel"></div>
<div id="err" class="panel"></div>
<div id="debug" class="panel"></div>
<div id="toast" class="panel"></div>
<div id="nogl"><h2>WebGL2 is not available</h2><p>The 3D diorama needs WebGL2. The simulation still runs, and you can build and operate with the form below.</p><div id="fallback"></div></div>
<div id="labels"></div>

<script id="sim">
/* Hydropower Tycoon — pure simulation + Game facade. No DOM, no THREE, no Math.random. */
const Game=(function(){
'use strict';
const sin=Math.sin,cos=Math.cos,sqrt=Math.sqrt,exp=Math.exp,log=Math.log,pow=Math.pow,min=Math.min,max=Math.max,floor=Math.floor,abs=Math.abs;
const PI=3.141592653589793,TAU=2*PI,LN10=2.302585092994046;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const mix=(a,b,t)=>a+(b-a)*t;

/* ===================== CONFIG (every constant, with unit) ===================== */
const CONFIG={
 schema:1,
 phys:{g:9.81/*m/s2*/,rho:1000/*kg/m3*/,nu:1.0e-6/*m2/s*/,hAtm:10.33/*m water, sea level*/,hVap:0.24/*m water*/,siteElev:600/*m a.s.l.*/,altLapse:900/*m elevation per m pressure head*/,etaGen:0.98/*-*/,etaMotor:0.97/*-*/,Kminor:2.4/*- sum of minor loss coeffs*/,rhoAir:1.2/*kg/m3*/,suctionD:1.4/*m*/,Kinlet:0.5/*-*/},
 time:{dt:30/*s*/,startDoy:100/*day of year*/,latDeg:46/*deg*/,speeds:[120,600,1800,3600,7200,21600]/*sim s per real s*/,budgetMs:40/*ms per frame*/,ringLen:1440/*points*/,maxCarry:4/*real s*/},
 map:{x0:-520,x1:520,z0:-700,z1:520/*m*/,nx:104,nz:122/*cells*/,exag:3/*vertical display factor*/,chunkX:26,chunkZ:61/*cells*/},
 survey:{x0:-480,x1:480,z0:-900,z1:900/*m*/,nx:96,nz:180,reach:[-250,150]/*m station range*/,maxOff:75/*m from centreline*/},
 bias:{gentle:{slope:0.05,relief:62,Lw:175,high:90},balanced:{slope:0.075,relief:105,Lw:130,high:140},alpine:{slope:0.10,relief:150,Lw:100,high:190}}/*slope m/m, relief m, Lw m, high m*/,
 river:{Q0:[0.8,1.6,3.0]/*m3/s base*/,wd:[0.9,1.2,1.6]/*m water depth*/,catch:20e6/*m2 river catchment*/,runoffC:0.22/*-*/,names:['Small','Medium','Large']},
 classic:{seed:1717,slope:0.10/*m/m*/,station:0/*m*/,dam:22/*m*/,lakeZ:380/*m*/},
 low:{a:120,b:85/*m semi-axes*/,depth0:26,depthStep:8/*m*/,maxStage:3,full:1.5/*m below ref*/,minOp:16/*m below ref*/,drop:38/*m ref below dam base*/,exCost:[90000,140000,200000]/*$*/,exHours:72/*h*/,zTurb:14,zPump:18/*m below ref*/},
 dam:{freeboard:2/*m*/,classes:['S','M','L','XL'],maxH:[22,38,55,80]/*m*/,crest:[5,6,7,8]/*m*/,batter:[0.6,0.7,0.8,0.9]/*H:V*/,permit:[0,120000,300000,700000]/*$*/,concrete:18/*$/m3*/,taper:0.55/*-*/,hoursPerM:18/*h*/,crackChance:0.02/*per day*/,crackOver:0.9/*of class height*/,wearDay:0.2,wearStorm:0.5/*pts*/,repairFrac:0.05/*of dam value*/,repairHours:24/*h*/,initFill:10/*m above base*/,leak:0.004/*m3/s per wear pt*/},
 vol:{deadUp:2.5/*m above base*/,catchUp:0.8e6,catchLow:{classic:6e6,proc:1.5e6}/*m2*/,runoffC:0.35,evapBase:0.9,evapT:0.17/*mm/day, mm/day/degC*/},
 env:{classic:0.04/*m3/s*/,procFrac:0.1/*of Q0*/,fine:0.5/*$/m3*/},
 plant:{
  turb:[{Q:6,pk:0.855,cost:0},{Q:12,pk:0.915,cost:140000},{Q:24,pk:0.94,cost:380000}]/*m3/s,-,$*/,
  pump:[{Q:5.5,pk:0.87,cost:0},{Q:11,pk:0.90,cost:130000},{Q:22,pk:0.92,cost:360000}],
  pipeD:[2.2,2.8,3.6,4.4]/*m*/,pipeMat:{steel:{eps:4.5e-5,cost:1},concrete:{eps:3e-4,cost:0.7},grp:{eps:1e-5,cost:1.3}}/*m, rel*/,pipeCost:160/*$ per m of length per m diameter*/,pipeHours:48,
  rampN:0.25/*m3/s per s*/,rampRes:1.65/45/*m3/s per s*/,fastClose:8/*x*/,minHead:5/*m*/,
  resFrac:0.3/*of turbine rated flow*/,
  wearT:0.008,wearP:0.01,wearPipe:0.0006,wearStart:0.02/*% per h full load, per start*/,failH:5/*% health*/,repairPt:{t:900,p:800,pipe:600,wind:0,}/*$ per health pt*/,
  Hsig:{a:0.07,b:0.09}/*sigma_c = a+b x2*/,npshr:{a:1.5,b:4}/*m*/,warnMargin:1.15},
 ren:{tile:28/*m*/,parcelCost:[0,120000,200000,300000]/*$*/,
  solar:[{kw:0.06,cost:43000},{kw:0.10,cost:70000},{kw:0.16,cost:105000}]/*MWp,$*/,tcoef:-0.004/*1/degC*/,dTc:0.03/*degC per W/m2*/,inv:0.96,soilDay:0.0016/*per day*/,soilRain:0.5/*recovery on rain*/,clean:0.25/*$ per kWp*/,
  wind:[{R:16,hub:38,MW:0.2,cost:150000},{R:22,hub:48,MW:0.5,cost:340000},{R:30,hub:58,MW:1.1,cost:700000}]/*m,m,MW,$*/,cp:0.42,lambda:7,cutIn:3,cutOut:25/*m/s*/,shear:0.14,ct:0.8,wakeK:0.075,
  stormDmg:0.06/*per hour per turbine when v>22*/,repairFrac:0.15,repairHours:12,coloDisc:0.15,om:0.015/*per yr of capex*/,disc:0.07/*per yr*/,life:20/*yr*/,degr:0.005/*per yr*/},
 batt:[{E:0.5,P:0.25,cost:180000},{E:1.2,P:0.6,cost:380000},{E:2.5,P:1.2,cost:700000}]/*MWh,MW,$*/,
 battX:{rte:0.90,lo:0.10,hi:0.95,fade:0.00012/*per full cycle*/,maxFade:0.3,refurb:0.35/*of cost*/},
 mkt:{base:62/*$/MWh*/,shape:[0.82,0.78,0.76,0.76,0.8,0.9,1.05,1.2,1.15,0.95,0.75,0.6,0.5,0.45,0.48,0.62,0.9,1.3,1.6,1.55,1.35,1.15,1.0,0.9],season:[1.0,0.95,1.05,1.15],glut:36/*$/MWh*/,impact:2.0/*$/MWh per MW*/,min:-40,max:300,heat:1.25},
 fin:{start:{classic:350000,proc:1400000,demo:1e9}/*$*/,loanMax:600000,rate:0.08/*per yr*/,omHydro:120/*$/day*/,omSite:0/*$*/,emergencyCredit:250000,bankrupt:-60000,sitePrice:600000,sub:1/*$ per operating h*/,capPay:9/*$/MW/h*/,callPay:130,emPay:220,callFine:180,emFine:400,gridFee:0,carbon:0},
 reserveX:{emChance:0.12,callsPerDay:1.2},
 pacing:{days:30},
 god:{flow:5,cheap:6,peak:6,reserve:50000}
};
const DAYS=[0,31,59,90,120,151,181,212,243,273,304,334];
const SEASONS=['Spring','Summer','Autumn','Winter'];

/* ===================== deterministic helpers ===================== */
function strHash(s){s=String(s);let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function seedInt(s){if(typeof s==='number')return s|0;const n=Number(s);return (String(s).trim()!==''&&isFinite(n))?(n|0):(strHash(s)|0);}
function rnd(S,n){let a=(S.rng[n]=(S.rng[n]+0x6D2B79F5)>>>0);let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function gauss(S,n){return (rnd(S,n)+rnd(S,n)+rnd(S,n)-1.5)*2;}
function h2(i,j,s){let h=(Math.imul(i,374761393)+Math.imul(j,668265263)+Math.imul(s,1013904223))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,z,s){const i=floor(x),j=floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);const a=h2(i,j,s),b=h2(i+1,j,s),c=h2(i,j+1,s),d=h2(i+1,j+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

/* ===================== terrain field (absolute river frame) ===================== */
function makeField(p){
 const sd=seedInt(p.seed),B=CONFIG.bias[p.bias]||CONFIG.bias.balanced;
 const ri=p.river==null?1:p.river,rv=[0.8,1,1.35][ri]||1;
 const P=k=>h2(k,91,sd)*TAU;
 const slope=p.classic?CONFIG.classic.slope:B.slope,sBed=p.classic?0:6;
 const depthC=2+rv;
 const f={sd,rv,depthC,slope};
 f.M=Z=>80*sin(Z*0.0035+P(1))+28*sin(Z*0.0085+P(2))+9*sin(Z*0.019+P(3));
 f.bed=Z=>100-slope*Z+sBed*sin(Z*0.011+P(4));
 f.fw=Z=>max(14,(34+12*(rv-0.8))*(1+0.55*sin(Z*0.0072+P(5))));
 f.rw=Z=>(3.2+3.2*rv)*(1+0.3*sin(Z*0.021+P(6)));
 f.wd=p.classic?0:CONFIG.river.wd[ri];
 f.waterElev=Z=>f.bed(Z)-depthC+f.wd;
 f.elev=(X,Z)=>{
  const c=f.M(Z);let d=abs(X-c);d=abs(d+5*(vnoise(X/45,Z/45,sd+3)-0.5));
  const fw=f.fw(Z),r=f.rw(Z),u=max(0,d-fw);
  const wall=B.relief*(1-exp(-pow(u/B.Lw,1.35)));
  let h=f.bed(Z)+0.015*min(d,fw)+wall;
  h-=depthC*(1-sstep(r*0.5,r*1.7,d));
  const nf=clamp((d-r*1.7)/70,0,1);
  const n=44*(vnoise(X/520,Z/520,sd+5)-0.5)+22*(vnoise(X/230,Z/230,sd+6)-0.5)+10*(vnoise(X/95,Z/95,sd+7)-0.5)+3.2*(vnoise(X/38,Z/38,sd+8)-0.5);
  h+=nf*n*(0.35+0.65*min(1,u/120));
  const hl=clamp((d-220)/330,0,1);h+=hl*hl*B.high*(0.6+0.8*vnoise(X/400,Z/400,sd+9));
  return h;};

 function weatherStep(){
  const w=S.wx,hf=(S.t%86400)/3600,doy=doyOf();
  w.ha=(hf-12)*PI/12;w.sinEl=sunSin(doy,hf);
  w.irr=1000*pow(max(0,w.sinEl),1.15)*(1-0.72*w.cloud);
  w.temp=w.tDay+(S.test.freeze?0:5*sin(TAU*(hf-9)/24));
  const s=-0.6+0.25*sin(w.ha),z=0.8,n=sqrt(s*s+z*z);w.sdx=s/n;w.sdz=z/n;}

 /* ---------- market (§10) ---------- */
 function priceModel(hAbs){
  const hod=((hAbs%24)+24)%24,day=floor(hAbs/24),doy=(T.startDoy+day)%365,si=seasonIdx(doy),M=CONFIG.mkt,w=S.wx;
  let p=M.base*M.season[si]*M.shape[hod];
  const sun=max(0,sunSin(doy,hod+0.5));
  p-=M.glut*sun*(1-0.7*w.cloudBase)*(si===0?1.25:si===1?1.0:si===2?0.6:0.3);
  p-=1.6*(w.windBase-6);if(w.heat)p*=M.heat;
  return p;}
 function marketHour(){
  const M=CONFIG.mkt,h=floor(S.t/3600),m=S.mkt;
  m.noise=0.75*m.noise+5*gauss(S,'price');
  const base=priceModel(h);
  m.price=clamp(base+m.noise-0.8*(S.wx.wind-S.wx.windBase),M.min,M.max);
  m.forecast=[];let below=0;for(let i=0;i<24;i++){const f=priceModel(h+i);m.forecast.push(f);if(f<m.price)below++;}
  m.rank=below/24*100;m.hist.push(m.price);if(m.hist.length>24)m.hist.shift();}

 /* ---------- hydraulics (§3) ---------- */
 const HYD={v:0,Re:0,f:0,hf:0,hm:0};
 function penLoss(site,Q,L){const P=site.plant,g=geoOf(site),D=P.D,A=PI*D*D/4,v=Q/A,eps=CP.pipeMat[P.mat].eps*(1+(100-P.hPipe)/100*3),Re=max(1,v*D/PH.nu);
  const f=friction(Re,eps/D),k=v*v/(2*PH.g);HYD.v=v;HYD.Re=Re;HYD.f=f;HYD.hf=f*g.pen.L/D*k;HYD.hm=PH.Kminor*k;return HYD;}
 function turbCalc(site,q,Hg){const P=site.plant,tT=CP.turb[P.tT-1];penLoss(site,q);const Hn=Hg-HYD.hf-HYD.hm,x=q/tT.Q;
  const eta=effCurve(x,tT.pk,0.25)*(0.88+0.12*P.hT/100);return {Hn,eta,x,MW:PH.rho*PH.g*q*max(0,Hn)*eta*PH.etaGen*1e-6};}
 function pumpCalc(site,q,Hg){const P=site.plant,tP=CP.pump[P.tP-1];penLoss(site,q);const Hp=Hg+HYD.hf+HYD.hm,x=q/tP.Q;
  const eta=effCurve(x,tP.pk,0.3)*(0.88+0.12*P.hP/100);return {Hn:Hp,eta,x,MW:q>0?PH.rho*PH.g*q*Hp/(eta*PH.etaMotor)*1e-6:0};}
 const hAtm=()=>PH.hAtm-PH.siteElev/PH.altLapse;
 function cavMargin(site,q,gen,Hn,ll,g){const P=site.plant;
  if(gen){const x=q/CP.turb[P.tT-1].Q,zs=(g.ref-CP.zT)-ll,sig=(hAtm()-PH.hVap-zs)/max(Hn,1),sc=CP.Hsig.a+CP.Hsig.b*x*x;return {m:sig/sc,sig,sc,npsh:0};}
  const x=q/CP.pump[P.tP-1].Q,As=PI*PH.suctionD*PH.suctionD/4,vs=q/As,na=hAtm()-PH.hVap+(ll-(g.ref-CP.zP))-PH.Kinlet*vs*vs/(2*PH.g),nr=CP.npshr.a+CP.npshr.b*x*x;return {m:na/nr,sig:0,sc:0,npsh:na,nr};}
 CP.zT=CONFIG.low.zTurb;CP.zP=CONFIG.low.zPump;
 function flowForPower(site,MW,Hg){const tT=CP.turb[site.plant.tT-1];let q=MW/(PH.rho*PH.g*max(1,Hg-0.5)*0.75*1e-6);
  for(let i=0;i<4;i++){const c=turbCalc(site,max(q,0.01),Hg);q=q*MW/max(c.MW,1e-6);}return min(q,tT.Q*1.05);}
 function reserveLimit(site){const g=geoOf(site),Hg=lvUp(site,g)-lvLow(site,g),tT=CP.turb[site.plant.tT-1];return turbCalc(site,CP.resFrac*tT.Q,Hg).MW;}

 /* ---------- rule engine (§12) ---------- */
 function ruleVar(site,v){const L=site.live,g=geoOf(site);
  switch(v){case'price':return S.mkt.price;case'rank':return S.mkt.rank;case'upPct':return 100*site.vUp/max(1,capUp(site,g));case'lowPct':return 100*site.vLow/max(1,capLow(site,g));
   case'hour':return floor(S.t/3600)%24;case'ren':return L.sol+L.windD;case'head':return L.Hg||0;case'season':return seasonIdx(doyOf());default:return 0;}}
 function evalRules(site){let best=null,bp=-1e9;
  for(const r of site.rules){if(!r.on)continue;const v=ruleVar(site,r.v);const ok=r.op==='<'?v<r.x:v>r.x;if(ok&&r.pri>bp){bp=r.pri;best=r;}}
  return best?{mode:best.mode,flow:best.flow}:null;}

 /* ---------- renewables (§8) ---------- */
 const scratchW=[];
 function recomputeWake(site){const g=geoOf(site),list=[],refs=[];
  for(let p=0;p<site.parcels;p++)for(let t=0;t<16;t++){const c=site.tiles[p][t];if(c&&c.wind){const xz=tileXZ(g,p,t),W=CONFIG.ren.wind[c.wind.tier-1];list.push({x:xz.x,z:xz.z,R:W.R,hub:W.hub});refs.push(c);}}
  const out=wakeFactors(list,S.wx.windDir,scratchW);
  for(let i=0;i<refs.length;i++)refs[i].wind.wake=out[i];
  for(let p=0;p<site.parcels;p++)for(let t=0;t<16;t++){const c=site.tiles[p][t];if(c&&c.sol){const xz=tileXZ(g,p,t);c.sol.shade=shadeFactor(xz.x,xz.z,list,S.wx.sinEl,S.wx.sdx,S.wx.sdz);}}}
 function renewStage(site,dt){
  const w=S.wx,L=site.live,R=CONFIG.ren;let sol=0,wd=0,wa=0;
  const Tc=w.temp+R.dTc*w.irr;
  for(let p=0;p<site.parcels;p++)for(let t=0;t<16;t++){const c=site.tiles[p][t];if(!c)continue;
   if(c.sol){const s=c.sol,P=R.solar[s.tier-1].kw*(w.irr/1000)*(1+R.tcoef*(Tc-25))*s.soil*(s.shade==null?1:s.shade)*R.inv*(s.hp/100);s.mw=max(0,P);sol+=s.mw;}
   if(c.wind){const q=c.wind,W=R.wind[q.tier-1],vh=w.wind*pow(W.hub/10,R.shear);q.vh=vh;q.rpm=0;q.cut=vh>=R.cutOut||vh<R.cutIn;
    const av=windPower(q.tier,vh,1)*(q.hp/100);const del=q.dmg?0:min(windPower(q.tier,vh,q.wake==null?1:q.wake)*(q.hp/100),W.MW*q.cur);
    q.avail=q.dmg?0:av;q.mw=del;if(!q.dmg&&!q.cut)q.rpm=rpmOf(q.tier,vh*(q.wake==null?1:q.wake));wd+=del;wa+=q.avail;}}
  const negCurt=S.god.on&&S.god.curtail&&S.mkt.price<0&&!S.contracts.some(c=>c.site===site.id&&c.left>0);
  if(negCurt){wd=0;for(let p=0;p<site.parcels;p++)for(let t=0;t<16;t++){const c=site.tiles[p][t];if(c&&c.wind)c.wind.mw=0;}}
  L.sol=sol;L.windD=wd;L.windA=wa;
  /* batteries (§11) */
  let chg=0,dis=0;const BX=CONFIG.battX,eta=sqrt(BX.rte),h=dt/3600;
  const surplus=max(0,sol+wd);
  for(let i=0;i<3;i++){const b=site.batt[i];if(!b)continue;const B=CONFIG.batt[b.tier-1],E=B.E*(1-b.fade),lo=BX.lo*E,hi=BX.hi*E;let mode=b.mode;
   if(mode==='auto'){const cheap=S.mkt.rank<30||S.mkt.price<0,dear=S.mkt.rank>72;mode=cheap?'charge':dear?'discharge':'idle';if(surplus>0.05&&!dear)mode='charge';}
   let P=0;
   if(mode==='charge'&&b.soc<hi){P=min(B.P,(hi-b.soc)/(h*eta));b.soc+=P*h*eta;chg+=P;b.cyc+=P*h*eta/(2*E);}
   else if(mode==='discharge'&&b.soc>lo){P=min(B.P,(b.soc-lo)*eta/h);b.soc-=P*h/eta;dis+=P;b.cyc+=P*h/eta/(2*E);}
   b.fade=min(BX.maxFade,b.cyc*BX.fade*2);b.mw=mode==='charge'?-P:P;b.state=mode;}
  L.battChg=chg;L.battDis=dis;}

 /* ---------- plant (§3-§5) ---------- */
 function plantStage(site,dt){
  const P=site.plant,L=site.live,g=geoOf(site),tT=CP.turb[P.tT-1],tP=CP.pump[P.tP-1],free=S.test.freeze;
  L.lu=lvUp(site,g);L.ll=lvLow(site,g);const Hg=L.lu-L.ll;L.Hg=Hg;
  const out=P.fail||site.jobs.some(j=>j.type==='penstock');L.out=out;
  let mode=P.req,qs=P.flow,src='manual';const rc=site.reserve,call=rc.call;
  if(call&&call.left>0&&rc.offer>0&&!out){mode='gen';qs=flowForPower(site,call.mw,Hg);src='reserve';}
  else if(site.rulesOn){const r=evalRules(site);if(r){mode=r.mode;qs=r.flow;src='rule';}else{mode='idle';qs=0;src='rule';}}
  else if(S.god.on&&S.t>=(S.god.hold[site.id]||0)){const c=S.god.cmd[site.id];if(c){mode=c.mode;qs=c.flow;src='god';}}
  L.cmd=mode;L.src=src;
  let tq=0;
  if(!out){if(mode==='gen')tq=min(qs,tT.Q*1.05);else if(mode==='pump')tq=-min(qs,tP.Q*1.05);}
  let fast=false;
  if(tq<0&&P.local){const per=max(0.05,pumpCalc(site,max(0.1,-tq),Hg).MW/max(0.1,-tq)),surplus=max(0,L.sol+L.windD-L.battChg),ql=surplus/per;if(ql<-tq){tq=-ql;fast=true;}}
  const mg=max(0,(site.vUp-deadUp(site,g))/dt),mp=max(0,min((site.vLow-deadLow(site,g))/dt,(capUp(site,g)-site.vUp)/dt));
  if(tq>0)tq=min(tq,mg);else tq=-min(-tq,mp);
  if(Hg<CP.minHead&&tq>0)tq=0;
  let Q=P.Q;
  if(free){Q=tq;}else{
   let tgt=tq;if(Q*tq<0)tgt=0;
   let r=(src==='reserve'?CP.rampRes:CP.rampN)*dt;if(abs(tgt)<abs(Q)&&fast)r*=CP.fastClose;
   Q=Q<tgt?min(tgt,Q+r):max(tgt,Q-r);}
  if(Q>mg)Q=mg;if(Q<-mp)Q=-mp;if(abs(Q)<1e-9)Q=0;
  P.Q=Q;const q=abs(Q);
  L.Q=Q;L.mode=P.mode=Q>0?'gen':Q<0?'pump':'idle';
  L.Pgen=0;L.Ppump=0;L.v=0;L.Re=0;L.f=0;L.Hf=0;L.Hn=Hg;L.eta=0;L.margin=9;L.sigma=0;L.npsh=0;
  if(q>0){
   if(Q>0){const c=turbCalc(site,q,Hg),cv=cavMargin(site,q,true,c.Hn,L.ll,g);L.Hn=c.Hn;L.eta=c.eta*(cv.m<1?max(0.6,1-0.3*(1-cv.m)):1);L.margin=cv.m;L.sigma=cv.sig;L.Pgen=PH.rho*PH.g*q*max(0,c.Hn)*L.eta*PH.etaGen*1e-6;}
   else{const c=pumpCalc(site,q,Hg),cv=cavMargin(site,q,false,0,L.ll,g);L.Hn=c.Hn;L.eta=c.eta*(cv.m<1?max(0.6,1-0.3*(1-cv.m)):1);L.margin=cv.m;L.npsh=cv.npsh;L.Ppump=PH.rho*PH.g*q*c.Hn/(L.eta*PH.etaMotor)*1e-6;}
   L.v=HYD.v;L.Re=HYD.Re;L.f=HYD.f;L.Hf=HYD.hf+HYD.hm;}
  else{const c=cavMargin(site,0.01,true,Hg,L.ll,g);L.margin=min(9,c.m);}
  L.cav=L.margin<CP.warnMargin&&q>0;
  L.revRate=(L.Pgen-L.Ppump)*S.mkt.price;}

 /* ---------- reservoirs (§4) ---------- */
 function reservoirStage(site,dt){
  const w=S.wx,L=site.live,g=geoOf(site),free=S.test.freeze,Cv=CONFIG.vol,led=site.led||(site.led={rain:0,evap:0,inflow:0,spill:0,env:0,leak:0,unmet:0});
  const lu=L.lu,ll=L.ll,Au=tabA(g.tabUp,lu),Al=tabA(g.tabLow,ll),doy=doyOf();
  let inUp=0,inLow=0,evU=0,evL=0,rU=0,rL=0;
  if(!free){
   const T0=w.temp,rv=CONFIG.river,hasR=!site.classic;
   let qMelt=0,vMelt=0;
   if(w.snow){site.snowR+=w.precip*dt/3600;site.snowV+=w.precip*dt/3600;}
   if(T0>0){const mr=min(site.snowR,3*T0*dt/86400),mv=min(site.snowV,3*T0*dt/86400);site.snowR-=mr;site.snowV-=mv;qMelt=mr/1000*rv.catch/dt;vMelt=mv/1000*Cv.catchLow[site.classic?'classic':'proc']/dt;}
   const q0=rv.Q0[site.river]*(1+0.35*sin(TAU*(doy-120)/365));
   const qr=hasR?q0+w.rain/1000*rv.catch*rv.runoffC/3600+qMelt:0;
   const catchL=Cv.catchLow[site.classic?'classic':'proc'];
   inUp=qr+w.rain/1000*Cv.catchUp*Cv.runoffC/3600;
   inLow=w.rain/1000*catchL*Cv.runoffC/3600+vMelt;
   const ice=w.ice?0.2:1,E=max(0,Cv.evapBase+Cv.evapT*T0)*(1+0.03*w.wind)*ice/1000/86400;
   evU=E*Au*dt;evL=E*Al*dt;rU=w.rain/1000/3600*Au*dt;rL=w.rain/1000/3600*Al*dt;}
  const moved=L.Q*dt;
  const inU=inUp*dt,inL=inLow*dt;
  led.inflow+=inU+inL;led.rain+=rU+rL;
  site.vUp+=inU+rU-moved;site.vLow+=inL+rL+moved;
  const eU=min(evU,site.vUp);site.vUp-=eU;const eL=min(evL,site.vLow);site.vLow-=eL;led.evap+=eU+eL;
  /* crack leakage */
  const cr=site.dam.crack;if(cr&&lu>cr.lvl&&!free){const lk=min(site.vUp,CONFIG.dam.leak*cr.wear*dt);site.vUp-=lk;led.leak+=lk;}
  const cu=capUp(site,g);let sp=0;if(site.vUp>cu){sp=site.vUp-cu;site.vUp=cu;led.spill+=sp;}
  L.spillQ=sp/dt;site.dam.spill+=sp;if(sp>0&&w.storm&&w.rain>0)site.dam.stormSpill=1;
  const cl=capLow(site,g);if(site.vLow>cl){const s2=site.vLow-cl;site.vLow=cl;led.spill+=s2;}
  /* §7 environmental flow from the lower reservoir */
  if(!free){const qe=site.classic?CONFIG.env.classic:CONFIG.env.procFrac*CONFIG.river.Q0[site.river],need=qe*dt,avail=max(0,site.vLow-deadLow(site,g)*0.5),rel=min(need,avail);
   site.vLow-=rel;led.env+=rel;const un=need-rel;led.unmet+=un;site.acc.env+=un*CONFIG.env.fine;S.fin.envFines+=un*CONFIG.env.fine;L.envQ=rel/dt;L.envReq=qe;}
  if(site.vUp<0)site.vUp=0;if(site.vLow<0)site.vLow=0;
  L.qIn=inUp;L.qInLow=inLow;L.evapUp=evU/dt;L.upPct=100*site.vUp/max(1,cu);L.lowPct=100*site.vLow/max(1,cl);
  L.lu=lvUp(site,g);L.ll=lvLow(site,g);}

 /* ---------- wear & maintenance ---------- */
 function wearStage(site,dt){
  const P=site.plant,L=site.live,h=dt/3600,q=abs(P.Q);
  if(q>0){const cw=L.margin<CP.warnMargin?1+6*(CP.warnMargin-L.margin):1;
   if(P.Q>0){const x=q/CP.turb[P.tT-1].Q;P.hT-=CP.wearT*x*x*h*cw;}else{const x=q/CP.pump[P.tP-1].Q;P.hP-=CP.wearP*x*x*h*cw;}
   P.hPipe-=CP.wearPipe*(1+L.v*L.v*0.05)*h;}else P.hPipe-=CP.wearPipe*0.4*h;
  if(L.pm==null)L.pm='idle';if(L.pm==='idle'&&L.mode!=='idle'){if(L.mode==='gen')P.hT-=CP.wearStart;else P.hP-=CP.wearStart;}L.pm=L.mode;
  P.hT=clamp(P.hT,0,100);P.hP=clamp(P.hP,0,100);P.hPipe=clamp(P.hPipe,0,100);
  if(!P.fail&&min(P.hT,P.hP,P.hPipe)<=CP.failH){P.fail=true;alert('crit','Plant tripped: component health critical',site.id);}}

 /* ---------- economy accumulation ---------- */
 function econStage(site,dt){
  const L=site.live,a=site.acc,h=dt/3600;
  const net=L.Pgen+L.sol+L.windD+L.battDis-L.Ppump-L.battChg;L.net=net;
  a.gen+=L.Pgen*h;a.pump+=L.Ppump*h;a.sol+=L.sol*h;a.wind+=L.windD*h;a.bd+=L.battDis*h;a.bc+=L.battChg*h;a.net+=net*h;if(L.Pgen>0||L.Ppump>0)a.op+=h;
  if(L.Pgen>0)S.stats.genH+=h;if(L.Ppump>0)S.stats.pumpH+=h;
  const c=site.reserve.call;if(c&&c.left>0){c.req+=c.mw*h;c.del+=min(L.Pgen,c.mw)*h;}}

 /* ---------- boundaries ---------- */
 function settle(site){
  const a=site.acc,M=CONFIG.mkt,F=CONFIG.fin,price=S.mkt.price;
  const eff=clamp(price-M.impact*a.net,M.min,M.max);S.mkt.eff=eff;
  let rev=a.net*eff;
  for(const c of S.contracts){if(c.site!==site.id||c.left<=0)continue;const sold=min(max(0,a.net),c.mw),short=c.mw-sold;rev+=sold*(c.price-eff)-short*c.price*1.5;c.left--;}
  const rc=site.reserve,L=site.live;
  if(rc.offer>0&&!L.out&&site.plant.hT>20){const cp=rc.offer*F.capPay;rev+=cp;rc.money+=cp;rc.cap+=cp;}
  rev-=a.env;
  if(S.god.on&&S.settings.profitProtect&&a.op>0&&rev<F.sub){S.fin.subsidy+=F.sub-rev;rev=F.sub;}
  S.cash+=rev;S.fin.dayInc+=rev;S.fin.rev+=rev;
  site.hist.push({h:floor(S.t/3600)-1,price,eff,rev,gen:a.gen,pump:a.pump,ren:a.sol+a.wind,vUp:site.vUp,vLow:site.vLow});if(site.hist.length>24)site.hist.shift();
  site.acc={gen:0,pump:0,sol:0,wind:0,bd:0,bc:0,net:0,env:0,op:0};}
 function endCall(site){const rc=site.reserve,c=rc.call;if(!c)return;
  const ratio=c.req>0?c.del/c.req:1,F=CONFIG.fin,em=c.kind==='emerg';
  const pay=c.del*(em?F.emPay:F.callPay),fine=ratio<0.9?(c.req-c.del)*(em?F.emFine:F.callFine):0;
  S.cash+=pay-fine;S.fin.dayInc+=pay-fine;rc.money+=pay;rc.fines+=fine;rc.calls++;
  if(ratio>=0.9){rc.ok++;rc.score=min(100,rc.score+3);}else{rc.fail++;rc.score=max(0,rc.score-12*(1-ratio)-4);alert('warn',(em?'Emergency':'Reserve call')+' under-delivered ('+Math.round(ratio*100)+'%)',site.id);}
  rc.call=null;}
 function hourly(){
  for(const site of S.sites){if(!site.dam.placed)continue;settle(site);
   const c=site.reserve.call;if(c){c.left--;if(c.left<=0)endCall(site);}}
  /* clock at hour boundary already advanced */
  const hAbs=floor(S.t/3600),hod=hAbs%24;
  if(hod===0&&S.t>0){dayBoundary();}
  climateHour();marketHour();
  /* events */
  const ev=S.ev;
  if(ev.em&&ev.em.start===hAbs){for(const site of S.sites){if(site.dam.placed&&site.reserve.offer>0&&!site.reserve.call)site.reserve.call={left:ev.em.dur,mw:site.reserve.offer,kind:'emerg',req:0,del:0};}alert('warn','Grid emergency: '+ev.em.dur+' h reserve call');}
  for(let i=ev.calls.length-1;i>=0;i--)if(ev.calls[i]===hAbs){ev.calls.splice(i,1);for(const site of S.sites){if(site.dam.placed&&site.reserve.offer>0&&!site.reserve.call)site.reserve.call={left:1,mw:site.reserve.offer,kind:'call',req:0,del:0};}}
  for(const site of S.sites){if(!site.dam.placed)continue;
   weatherStep();recomputeWake(site);
   /* storm damage to turbines */
   const w=S.wx;
   for(let p=0;p<site.parcels;p++)for(let t=0;t<16;t++){const c=site.tiles[p][t];if(c&&c.wind&&!c.wind.dmg&&c.wind.vh>22&&rnd(S,'dmg')<CONFIG.ren.stormDmg){c.wind.dmg=true;alert('warn','Storm damaged a wind turbine',site.id);}}
   autoRepair(site);}
  if(S.god.on)godHour();
  checkQuests();
  for(const site of S.sites)if(site.dam.placed)site.spillT=0;}
 function autoRepair(site){if(!S.settings.autoRepair)return;
  for(let p=0;p<site.parcels;p++)for(let t=0;t<16;t++){const c=site.tiles[p][t];if(!(c&&c.wind&&c.wind.dmg&&!c.wind.rep))continue;
   const cost=CONFIG.ren.wind[c.wind.tier-1].cost*CONFIG.ren.repairFrac;

  if(x>=g.x0&&x<=g.x0+g.nx*g.dx&&z>=g.z0&&z<=g.z0+g.nz*g.dz){if(y<hY(x,z)){let a=prevT,b=t;for(let k=0;k<12;k++){const m=(a+b)/2;if(r[1]+r[4]*m<hY(r[0]+r[3]*m,r[2]+r[5]*m))b=m;else a=m;}return b;}}
  prevT=t;t+=max(2,t*0.01);}

 const tt=rayTerrain(r);

 if(WS.buildMode){let bt=null;for(const p of WS.picks){if(!p.tile)continue;const t=rayBox(r,p.box);if(t>=0&&(!bt||t<bt.t))bt={id:p.id,t,label:p.label,p:p.p,tile:p.t};}if(bt&&(tt<0||bt.t<tt+40)){bt.tileHit=true;return bt;}}
 for(const p of WS.picks){if(p.tile)continue;const t=rayBox(r,p.box);if(t>=0)consider(p.id,t-(p.prio?0.5:0),p.label,{});}

 if(d.placed){const hitW=(mask,lvl,id,label)=>{const yl=Y(lvl);if(r[4]>=-1e-6)return;const t=(yl-r[1])/r[4];if(t<=0)return;const x=r[0]+r[3]*t,z=r[2]+r[5]*t,g=WS.geo.g;const i=clamp(Math.round((x-g.x0)/g.dx),0,g.nx),j=clamp(Math.round((z-g.z0)/g.dz),0,g.nz);
   if((mask[j*g.W+i]||mask[min(g.nz,j+1)*g.W+i]||mask[j*g.W+min(g.nx,i+1)])&&sampleG(g,x,z)<lvl)consider(id,t,label,{x,z});};hitW(WS.upMask,d.lu,'upper','Upper reservoir');hitW(WS.lowMask,d.ll,'lower','Lower reservoir');}

let lastUI=0,lastPanelT=0,hasGLok=false;
function frameCb(s,dt){snap=s;
 if(hasGLok){try{World.sync(s);World.camKeys(dt);World.hoverTick();World.render(s,dt);frameCb.err=0;}
  catch(e){frameCb.err=(frameCb.err||0)+1;console.error(e);
   if(frameCb.err===1){const p=$('err');p.style.display='block';const txt=(e&&e.stack)||String(e);p.innerHTML='<h3>The 3D view hit a problem</h3><div class="sub">The simulation keeps running. If it repeats, the form fallback takes over. Details:</div><pre style="max-height:140px;overflow:auto;font-size:11px;white-space:pre-wrap">'+esc(txt)+'</pre><div style="display:flex;gap:6px"><button id="errCopy2" class="pri">Copy error</button><button id="errClose2">Dismiss</button></div>';
    $('errCopy2').onclick=()=>{try{navigator.clipboard.writeText(txt);toast('Copied');}catch(x){toast('Copy failed');}};$('errClose2').onclick=()=>{p.style.display='none';};}
   if(frameCb.err>=3){hasGLok=false;$('gl').style.display='none';const ng=$('nogl');ng.style.display='block';ng.querySelector('h2').textContent='3D view unavailable';ng.querySelector('p').textContent='The 3D renderer failed repeatedly. The simulation is still running; you can build and operate with this form.';}}}
 const now=performance.now();
 if(now-lastUI>100){lastUI=now;updateTop();updateCard();updateLabels();updateDrawer();if(UI.debug)updateDebug();humTick();
  if(UI.panel&&now-lastPanelT>1000){lastPanelT=now;const ae=document.activeElement;if(!(ae&&modal.contains(ae)&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))renderPanel();}
  const day=floor(s.t/86400);if(day!==UI.lastDay){if(UI.lastDay>=0&&s.started){try{store.set('hydro-auto',Game.save());}catch(e){}}UI.lastDay=day;}
  if(!hasGLok&&now-(frameCb.fb||0)>1000){frameCb.fb=now;buildFallback();}}
 drawGauges(dt);positionCard();}
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(UI.sv){endSurvey();}else if($('start').style.display==='block'&&snap&&snap.started){$('start').style.display='none';}else if(UI.drawer)openDrawer(false);else if(UI.debug){UI.debug=false;$('debug').style.display='none';}else if(UI.panel)closePanel();else closeCard();e.preventDefault();return;}
 if(e.key==='F1'){e.preventDefault();openDrawer();return;}if(e.key==='F2'){e.preventDefault();UI.debug=!UI.debug;$('debug').style.display=UI.debug?'block':'none';updateDebug();return;}
 const tg=e.target;if(tg&&/INPUT|TEXTAREA|SELECT/.test(tg.tagName))return;if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase();
 if(k===' '&&(tg===document.body||tg===$('gl'))){e.preventDefault();act({type:'PAUSE'});return;}
 if(k>='1'&&k<='6'&&k.length===1){act({type:'SET_SPEED',speed:+k});return;}
 if(k==='t'){act({type:'TURN_STEP',hours:1});return;}
 if(k==='c'){settings.lens=(settings.lens+1)%5;World.setLens(settings.lens);saveSettings();toast('Lens: '+['World','Survey','Hydraulic','Electrical','Ecology'][settings.lens]);if(UI.panel==='lens')renderPanel();return;}
 if(k==='f'){World.focusOn(UI.sel&&!UI.sel.startsWith('tile')?UI.sel:'powerhouse');return;}
 if(('wasdqe'.includes(k)&&k.length===1)||k.startsWith('arrow')){World.keys[k]=true;}});
document.addEventListener('keyup',e=>{World.keys[e.key.toLowerCase()]=false;});
window.addEventListener('blur',()=>{for(const k in World.keys)World.keys[k]=false;});

/* ---------- wiring & boot ---------- */
$('bar').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(b)openPanel(b.dataset.p);});
$('bBell').onclick=()=>openPanel('alerts');$('bOperate').onclick=()=>openDrawer();
$('bPause').onclick=()=>act({type:'PAUSE'});$('bTurn').onclick=()=>act({type:'TURN_STEP',hours:1});
$('speeds').addEventListener('click',e=>{const b=e.target.closest('button[data-sp]');if(b)act({type:'SET_SPEED',speed:+b.dataset.sp});});
Game.onError(err=>{const p=$('err');p.style.display='block';const txt=(err&&err.stack)||String(err);p.innerHTML='<h3>Something went wrong — the game is paused</h3><div class="sub">The last good state is kept. Copy the details and report it.</div><pre style="max-height:140px;overflow:auto;font-size:11px;white-space:pre-wrap">'+esc(txt)+'</pre><div style="display:flex;gap:6px"><button id="errCopy" class="pri">Copy error</button><button id="errClose">Dismiss</button></div>';
 $('errCopy').onclick=()=>{try{navigator.clipboard.writeText(txt);toast('Copied');}catch(e){toast('Copy failed');}};$('errClose').onclick=()=>{p.style.display='none';};});
(function boot(){
 applyTheme();
 try{hasGLok=World.init();}catch(e){hasGLok=false;console.warn(e);const ng=$('nogl');ng.querySelector('p').textContent='The 3D renderer could not start ('+(e&&e.message?e.message.slice(0,300):'unknown')+'). The simulation still runs, and you can build and operate with the form below.';}
 if(!hasGLok){$('nogl').style.display='block';$('gl').style.display='none';}
 Game.newGame({seed:'hydro',start:'classic'});snap=Game.getSnapshot();
 World.setLens(settings.lens);
 showStart();
 Game.start(frameCb);
 setTimeout(startAudit,1800);
})();
})();

</script>
</body>
</html>
