*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--text);font-family:var(--fb);font-size:14px}

<script>
'use strict';
/* ============================================================================
   Hydropower Tycoon — single file. Simulation is pure (no DOM, no THREE, no
   Math.random). Data flows one way: UI/world read Game.getSnapshot() and send
   Game.dispatch({type,...}).
   Section references (§) point to the internal design notes of this build.
   ============================================================================ */

/* ---------- CONFIG: every constant, with unit and section ---------- */
const CONFIG = Object.freeze({
  g: 9.81,              // m/s²   §2.1 gravity in head equation
  rho: 1000,            // kg/m³  §2.1 water density
  nu: 1.0e-6,           // m²/s   §2.2 kinematic viscosity (Reynolds number)
  pipeEps: 0.00015,     // m      §2.2 steel roughness (Swamee–Jain)
  latDeg: 47,           // deg    §5 site latitude (solar geometry)
  stepS: 60,            // s      §0 fixed simulation step
  hourS: 3600,          // s      §0 hour boundary
  daySec: 86400,        // s      §0 day boundary
  upperArea: 1.6e6,     // m²     §3 upper reservoir surface area
  lowerArea: 1.1e6,     // m²     §3 lower reservoir surface area
  upperBase: 170,       // m a.s.l. §3 upper datum
  lowerBase: 70,        // m a.s.l. §3 lower datum
  zDiff: 100,           // m      §2.3 static head at equal reservoir levels
  damH0: 30,            // m      §6 starting dam height
  damMax: 60,           // m      §6 dam class limit
  damCostPerM: 60000,   // $/m    §6 raise cost per metre
  lowerMaxH: 25,        // m      §3 lower reservoir max level
  excavCost: 2.0e5,     // $      §6 excavation stage cost
  excavStepM: 5,        // m      §6 excavation depth per stage
  penD: 3.2,            // m      §2.2 penstock diameter
  penL: 900,            // m      §2.2 penstock length
  penK: 1.6,            // -      §2.2 sum of minor loss coefficients
  qRated: 12,           // m³/s   §2.4 rated flow
  qMaxT: 13.2,          // m³/s   §2.4 machine flow limit (110 % rated)
  etaT: 0.91,           // -      §2.4 turbine peak efficiency
  etaP: 0.88,           // -      §2.4 pump peak efficiency
  etaG: 0.97,           // -      §2.4 generator efficiency
  rampRate: 0.02,       // m³/s²  §2.6 flow ramp (shared penstock)
  submerg: 4,           // m      §2.5 turbine submergence below datum
  atmH: 10.3,           // m      §2.5 atmospheric pressure head
  vapH: 0.24,           // m      §2.5 vapour pressure head
  sigCrit: 0.09,        // -      §2.5 critical Thoma σ at rated flow
  cavWarn: 1.15,        // -      §2.5 HGL amber threshold
  evapMmDay: 4,         // mm/d   §3 open-water evaporation
  rainCapMm: 14,        // mm/h   §3 maximum rainfall rate
  envFlow: 0.8,         // m³/s   §7 environmental release
  envCharge: 0.5,       // $/m³   §7 charge on unmet environmental volume
  omHour: 25,           // $/h    §8 plant fixed O&M
  loanRate: 0.06,       // 1/yr   §8 loan interest
  loanMax: 2.0e6,       // $      §8 loan limit
  subsidyMin: 1,        // $/h    §8 profit protection floor
  coloc: 0.15,          // -      §9 co-location discount on equipment
  windR: 25,            // m      §9 rotor radius
  windLambda: 7,        // -      §9 tip-speed ratio
  windCut: 3,           // m/s    §9 cut-in
  windRated: 12,        // m/s    §9 rated wind speed
  windOut: 25,          // m/s    §9 cut-out
  solarMW: [0.25, 0.4, 0.6],     // MW peak per tier   §9
  solarCost: [3e5, 4.5e5, 6e5],  // $ per tier         §9
  windMW: [0.8, 1.2, 1.8],       // MW rated per tier  §9
  windCost: [9e5, 1.3e6, 1.9e6], // $ per tier         §9
  solarOM: 3,           // $/MW·h §9 solar O&M
  windOM: 15,           // $/MW·h §9 wind O&M
  batCostPerMWh: 2.5e5, // $/MWh  §9 battery capacity cost
  batPowerMW: 1.0,      // MW     §9 battery charge/discharge power
  batEta: 0.9,          // -      §9 one-way efficiency
  reserveRate: 6,       // $/MW·h §10 reserve capacity payment
  reserveFine: 60,      // $/MW·h §10 shortfall fine
  tier2Cost: 1.6e6,     // $      §10 Tier-2 pump+turbine pair (pacing report)
  permitCost: 2.0e5,    // $      §10 parcel permit
  siteCost: 2.0e6,      // $      §10 additional site
  startCash: 3.0e5,     // $      §10 starting cash
  demoCash: 1.0e9,      // $      §10 demo replenished funds
  dayStart: 110,        // day of year at game start (late April)
  VE: 3,                // -      display vertical exaggeration (presentation only)
  gridN: 96,            // cells  display terrain grid
  mapS: 1800,           // m      display map width
  bowlU: {x: -40, z: -560, r: 330, d: 110}, // m  upper basin shape (terrain)
  bowlL: {x: 110, z: 430, r: 260, d: 120},  // m  lower basin shape (terrain)
  speeds: [60, 300, 900, 1800, 3600, 7200], // sim s per real s (speeds 1–6)
  frameBudgetMs: 40,    // ms     §10 per-frame simulation budget
  slowFrameMs: 22,      // ms     §10 quality step-down threshold
  ringN: 1440           // points §SCADA ring buffer length
});

/* ---------- Seeded streams (only sin-hash; no Math.random) ---------- */
const R = {
  u(seed, i){ const x = Math.sin(seed * 127.1 + i * 311.7) * 43758.5453123; return x - Math.floor(x); },
  h2(seed, i, j){ return R.u(seed + j * 0.6180339887, i); },
  n2(seed, x, y){
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = R.h2(seed, xi, yi), b = R.h2(seed, xi + 1, yi), c = R.h2(seed, xi, yi + 1), d = R.h2(seed, xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  },
  fbm(seed, x, y, oct){
    let s = 0, a = 0.5, f = 1, n = 0;
    for (let k = 0; k < oct; k++){ s += a * R.n2(seed + k * 13.7, x * f, y * f); n += a; f *= 2.03; a *= 0.5; }
    return s / n;
  }
};
const hod = (t) => { const h = t / 3600; return h - 24 * Math.floor(h / 24); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- Terrain (display geometry and simulation share heights) ---------- */
function canyonX(s, z){ const p = s.seed * 0.013; return 70 * Math.sin(z / 260 + p) + 35 * Math.sin(z / 101 + p * 2.1); }
function canyonW(s){ return 80 + 40 * s.river; }
function terrainH(s, x, z){
  const p = s.seed * 0.01, amp = 0.7 + 0.3 * s.bias;
  let h = 150 + amp * 110 * R.fbm(p + 1, x / 1100, z / 1100, 4) + amp * 45 * R.fbm(p + 2, x / 260, z / 260, 3);
  const dx = x - canyonX(s, z), w = canyonW(s);
  h -= 60 * Math.exp(-dx * dx / (2 * w * w));
  const ub = CONFIG.bowlU, lb = CONFIG.bowlL;
  h -= ub.d * Math.exp(-((x - ub.x) ** 2 + (z - ub.z) ** 2) / (2 * ub.r * ub.r));
  h -= lb.d * Math.exp(-((x - lb.x) ** 2 + (z - lb.z) ** 2) / (2 * lb.r * lb.r));
  return Math.max(4, h);
}
const DAM_Z = -250;
const PH_LOCAL = {x: 0, z: 0};
function phPos(s){ return {x: canyonX(s, 120) + 110, z: 120}; }

/* ---------- Simulation: hydraulics ---------- */
function penstockFlow(Q, health){
  const C = CONFIG, D = C.penD, A = Math.PI * D * D / 4;
  const v = Math.abs(Q) / A;
  const Re = Math.max(v * D / C.nu, 1);
  const x = C.pipeEps / (3.7 * D) + 5.74 / Math.pow(Re, 0.9);
  const f = 0.25 / Math.pow(Math.log(x) / Math.LN10, 2);            // Swamee–Jain, §2.2
  const hf = (f * C.penL / D + C.penK) * v * v / (2 * C.g) * (1 / (0.85 + 0.15 * health / 100)); // §2.2 Darcy–Weisbach + minor
  return {v, Re, f, hf};
}
function etaTurb(Q, health){ const x = Q / CONFIG.qRated; return clamp(CONFIG.etaT * (1 - 0.35 * (x - 0.85) ** 2) * (0.85 + 0.15 * health / 100), 0.5, 1); } // §2.4
function etaPump(Q){ const x = Q / CONFIG.qRated; return clamp(CONFIG.etaP * (1 - 0.4 * (x - 1) ** 2), 0.5, 1); }                               // §2.4

/* ---------- Simulation: climate, sun, price (pure functions of time) ---------- */
function dayOfYear(s, day){ const d = day + s.startDay; return d - 365 * Math.floor(d / 365); }
function sunSin(s, t){                                                                      // §5 solar elevation
  const doy = dayOfYear(s, Math.floor(t / CONFIG.daySec));
  const dec = 23.44 * Math.sin(2 * Math.PI * (doy + 284) / 365) * Math.PI / 180;
  const lat = CONFIG.latDeg * Math.PI / 180, H = (hod(t) - 12) * 15 * Math.PI / 180;
  return Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(H);
}
function priceBase(s, hIdx){                                                                // §8 duck-curve spot price
  const hd = hIdx - 24 * Math.floor(hIdx / 24);
  const day = Math.floor(hIdx / 24), doy = dayOfYear(s, day);
  const season = Math.cos(2 * Math.PI * (doy - 20) / 365);
  const base = 58 + 14 * season + 24 * Math.cos(2 * Math.PI * (hd - 19) / 24);
  const sun = Math.max(0, Math.sin(Math.PI * (hd - 6) / 12));
  const dip = 85 * sun * sun * Math.exp(-((hd - 13) ** 2) / (2 * 2.6 * 2.6)) * (0.85 - 0.15 * season);
  const noise = 5 * (2 * R.u(s.seed * 3.3 + 7, hIdx) - 1);
  return base - dip + noise;
}
function priceAt(s, hIdx){ return priceBase(s, hIdx) - 0.25 * s.lastNetMW; }   // market impact from own dispatch
function forecast24(s, hIdx){ const a = []; for (let k = 0; k < 24; k++) a.push(priceBase(s, hIdx + k) - 0.25 * s.lastNetMW); return a; }

/* ---------- Simulation: site construction ---------- */
function mkSite(id, name, kind, seed, o){
  const C = CONFIG;
  const s = {
    id, name, kind, seed, bias: o.bias | 0, river: o.river | 0, startDay: C.dayStart, noEvap: !!o.noEvap,
    Au: C.upperArea, Al: C.lowerArea, damH: o.damH || C.damH0, lowerH: C.lowerMaxH,
    Vu: 0, Vl: 0, VuMax: 0, VlMax: 0, qAct: 0,
    mode: 'idle', setQ: 4, auto: false,
    rules: Array.from({length: 8}, () => ({on: false, cond: 'price_below', val: 30, act: 'gen', q: 6})),
    resOffer: 0, reliab: 1, resCallHour: -1, resDone: 0,
    qT: 0, qP: 0, Hg: 0, Hn: 0, hf: 0, v: 0, Re: 0, f: 0, etaT: 0, etaP: 0, PMW: 0, PMWp: 0, sigma: 0, margin: 9,
    price: 0, lastNetMW: 0, sinE: 0, status: 'idle',
    wx: {rain: 0, storm: false, temp: 12, cloud: 0.3, wind: 6, heat: false, G: 0, lastHour: -1},
    renMW: 0, health: 100, soil: 0,
    installs: [],
    batt: [{id: 'B1', cap: 4, soc: 0.5, built: true, mode: 'idle'}, {id: 'B2', cap: 0, soc: 0.5, built: false, mode: 'idle'}, {id: 'B3', cap: 0, soc: 0.5, built: false, mode: 'idle'}],
    parcels: 1, owned: {0: true},
    dam: {crack: false, wear: 0, repairJob: 0}, jobs: [],
    acc: {genMWh: 0, pumpMWh: 0, renMWh: 0, batImp: 0, batExp: 0, envCharge: 0, envUnmet: 0, spillM3: 0},
    hist: {price: [], vu: [], vl: [], gen: [], pump: [], ren: []},
    dayProfit: 0, dayHist: [], subsidy: 0, totalGen: 0, totalPump: 0, env: 0, lastNet: 0, lastRev: 0, lastCost: 0
  };
  s.VuMax = s.Au * s.damH; s.VlMax = s.Al * s.lowerH;
  s.Vu = 0.6 * s.VuMax; s.Vl = 0.5 * s.VlMax;
  s.installs.push({id: 1, kind: 'solar', parcel: 0, tile: 0, tier: 1, capMW: C.solarMW[1], soil: 0, dmg: 0, curtail: 0, starter: true});
  return s;
}

/* ---------- Simulation: climate (hourly) ---------- */
function climateHour(s, hIdx){                                                              // §3 weather streams
  const C = CONFIG, wx = s.wx, doy = dayOfYear(s, Math.floor(hIdx / 24));
  const seasonT = Math.sin(2 * Math.PI * (doy - 100) / 365);
  wx.temp = 10 + 12 * seasonT + 4 * Math.sin(2 * Math.PI * (hod(hIdx * 3600) - 9) / 24) + 2 * (R.u(s.seed + 31, hIdx) - 0.5);
  wx.heat = wx.temp > 28;
  const pRain = 0.12 + 0.06 * Math.cos(2 * Math.PI * (doy - 300) / 365);
  const rainRoll = R.u(s.seed + 1, hIdx);
  wx.rain = rainRoll < pRain ? C.rainCapMm * 0.6 * R.u(s.seed + 2, hIdx) : 0;
  if (s.dry) wx.rain = 0;
  wx.storm = wx.rain > 9 && R.u(s.seed + 3, hIdx) > 0.45;
  wx.cloud = clamp(0.3 + 0.4 * (R.u(s.seed + 4, hIdx) - 0.5) + (wx.rain > 0 ? 0.3 : 0), 0, 1);
  wx.wind = clamp(6 + 3 * Math.sin(2 * Math.PI * (doy - 60) / 365) + 4 * R.u(s.seed + 5, hIdx), 0, 30);
  wx.lastHour = hIdx;
}
function dayBoundary(s, day){                                                               // §5 solar soiling, §6 dam
  for (const it of s.installs) if (it.kind === 'solar') it.soil = clamp(it.soil + 0.006, 0, 1);
  const stormSpill = s.dayStormSpill || 0;
  if (stormSpill && s.damH > 0.9 * CONFIG.damMax && R.u(s.seed + 9, day) < 0.02) s.dam.crack = true; // §6 2 % daily crack roll (after qualifying spill)
  s.dayStormSpill = 0;
  if (s.dam.crack) s.dam.wear += 0.2;                                                       // §6 wear while water above crack
  s.dayHist.push(s.dayProfit); if (s.dayHist.length > 60) s.dayHist.shift();
  s.dayProfit = 0;
}
function riverIn(s, t){                                                                     // §3 river inflow (m³/s), seasonal + storms
  if (s.kind === 'classic') return 0;
  const doy = dayOfYear(s, Math.floor(t / 86400));
  const snowMelt = 1.2 * Math.max(0, Math.sin(2 * Math.PI * (doy - 60) / 365));
  return 1.5 + snowMelt + (s.wx.rain > 0 ? 0.25 * s.wx.rain : 0) + 0.5 * s.river;
}

/* ---------- Simulation: renewables (instantaneous) ---------- */
function renewablesStep(s){                                                                 // §9 solar and wind output
  const C = CONFIG; let tot = 0;
  const G = 1000 * Math.max(0, s.sinE) * (1 - 0.65 * s.wx.cloud); s.wx.G = G;
  for (const it of s.installs){
    if (it.kind === 'solar') tot += it.capMW * (G / 1000) * (1 - it.soil) * 0.85;
    else {
      const v = s.wx.wind;
      let f = clamp((v ** 3 - C.windCut ** 3) / (C.windRated ** 3 - C.windCut ** 3), 0, 1);
      if (v >= C.windOut || it.dmg) f = 0;
      tot += it.capMW * f * (1 - it.curtail);
    }
  }
  return tot;
}
function windRpm(v){ return 60 * CONFIG.windLambda * v / (2 * Math.PI * CONFIG.windR); } // §9 rpm = 60·λ·v/(2πR)

/* ---------- Simulation: plant solve and reservoirs (one step) ---------- */
function evalRules(s){
  for (const r of s.rules){
    if (!r.on) continue;
    const L = s.Vu / s.Au;
    const ok = r.cond === 'price_below' ? s.price < r.val : r.cond === 'price_above' ? s.price > r.val : r.cond === 'level_above' ? L > r.val : L < r.val;
    if (ok){ s.mode = r.act; s.setQ = r.q; return; }
  }
  s.mode = 'idle';
}
function plantStep(s, g, dt){
  const C = CONFIG;
  if (g.god && !s.auto){                                                                    // God mode fallback: price thresholds
    s.mode = s.price < g.godCheap ? 'pump' : s.price > g.godPeak ? 'gen' : 'idle'; s.setQ = g.godQ;
  }
  if (s.auto) evalRules(s);
  const Lu = s.Vu / s.Au, Ll = s.Vl / s.Al;
  const Hg = C.zDiff + Lu - Ll;                                                            // §2.3 gross head
  s.Hg = Hg;
  let target = 0;
  if (s.mode === 'gen') target = Math.min(s.setQ, C.qMaxT);
  else if (s.mode === 'pump') target = -Math.min(s.setQ, C.qMaxT);
  // §2.6 ramp of shared penstock flow toward target
  const dq = clamp(target - s.qAct, -C.rampRate * dt, C.rampRate * dt);
  s.qAct += dq;
  let QT = Math.max(0, s.qAct), QP = Math.max(0, -s.qAct);
  QT = Math.min(QT, s.Vu / dt, C.qMaxT);
  QP = Math.min(QP, s.Vl / dt, (s.VuMax - s.Vu) / dt, C.qMaxT);
  const q = Math.max(QT, QP);
  const hyd = penstockFlow(q, s.health);
  s.v = hyd.v; s.Re = hyd.Re; s.f = hyd.f; s.hf = hyd.hf;
  const Hn = Hg - hyd.hf; s.Hn = Hn;
  const Hp = Hg + hyd.hf;
  s.etaT = etaTurb(QT, s.health); s.etaP = etaPump(QP);
  s.qT = QT; s.qP = QP;
  s.PMW = Hn > 0 ? C.rho * C.g * QT * Hn * s.etaT * C.etaG / 1e6 : 0;                      // §2.1 P = ρgQHη
  s.PMWp = QP > 0 ? C.rho * C.g * QP * Hp / s.etaP / 1e6 : 0;                              // §2.1 pump power
  // §2.5 Thoma cavitation margin
  s.sigma = Hn > 0 ? (C.atmH - C.vapH + C.submerg) / Hn : 1;
  const sc = C.sigCrit * Math.pow(Math.max(QT, QP) / C.qRated, 1.5) + 0.01;
  s.margin = s.sigma / sc;
  // §3 reservoirs — exact mass balance
  const rainR = s.wx.rain / 3.6e6;                                                          // m/s
  const evapR = s.noEvap ? 0 : C.evapMmDay / 1000 / 86400;
  const qIn = riverIn(s, g.t);
  const qInU = s.kind === 'classic' ? 0 : qIn;
  const qInL = s.kind === 'classic' ? 0 : 0.3 * qIn;
  const envReq = s.kind === 'classic' ? 0 : C.envFlow;
  const envAvail = Math.max(0, s.Vl + (qInL + (rainR - evapR) * s.Al + QT * 0 + QT * dt / dt * 0) * dt + QT * dt - QP * dt);
  const envRel = Math.min(envReq * dt, envAvail);
  const envUnmet = envReq * dt - envRel;
  let Vu2 = s.Vu + (qInU + (rainR - evapR) * s.Au) * dt + (QP - QT) * dt;
  let spillU = 0; if (Vu2 > s.VuMax){ spillU = Vu2 - s.VuMax; Vu2 = s.VuMax; }
  if (Vu2 < 0) Vu2 = 0;
  let Vl2 = s.Vl + (qInL + (rainR - evapR) * s.Al) * dt + (QT - QP) * dt - envRel;
  let spillL = 0; if (Vl2 > s.VlMax){ spillL = Vl2 - s.VlMax; Vl2 = s.VlMax; }
  if (Vl2 < 0) Vl2 = 0;
  s.Vu = Vu2; s.Vl = Vl2;
  s.env = envRel / dt;
  s.acc.envUnmet += envUnmet;
  s.acc.envCharge += envUnmet * C.envCharge;                                               // §7 charge on unmet volume
  s.acc.spillM3 += spillU + spillL;
  if (spillU > 0 && s.wx.storm) s.dayStormSpill = 1;
  s.acc.genMWh += s.PMW * dt / 3600;
  s.acc.pumpMWh += s.PMWp * dt / 3600;
  s.totalGen += s.PMW * dt / 3600; s.totalPump += s.PMWp * dt / 3600;
  s.status = QT > 0 ? 'generating' : QP > 0 ? 'pumping' : (Math.abs(s.qAct) > 1e-9 ? 'ramping' : 'idle');
  // §8 health wear (penstock and machines)
  s.health = clamp(s.health - (q * dt) * 1e-7, 0, 100);
}
function batteryStep(s, dt){                                                                // §9 batteries (price-window rule)
  const C = CONFIG;
  for (const b of s.batt){
    if (!b.built || b.cap <= 0) continue;
    if (s.price < 25 && b.soc < 0.9){
      const dE = Math.min(C.batPowerMW * dt / 3600, (0.9 - b.soc) * b.cap / C.batEta);
      b.soc += dE * C.batEta / b.cap; s.acc.batImp += dE; b.mode = 'charge';
    } else if (s.price > 70 && b.soc > 0.15){
      const dE = Math.min(C.batPowerMW * dt / 3600, (b.soc - 0.15) * b.cap);
      b.soc -= dE / b.cap; s.acc.batExp += dE * C.batEta; b.mode = 'discharge';
    } else b.mode = 'idle';
    b.soc = clamp(b.soc, 0.10, 0.95);
  }
}

/* ---------- Economy: hourly settlement ---------- */
function settleHour(s, g, hIdx){
  const C = CONFIG, p = s.price;
  const gen = s.acc.genMWh, pump = s.acc.pumpMWh;
  const ren = s.acc.renMWh;
  let om = C.omHour;
  for (const it of s.installs) om += it.capMW * (it.kind === 'solar' ? C.solarOM : C.windOM);
  const rev = (gen + ren) * p - pump * p + s.acc.batExp * p - s.acc.batImp * p;             // §8 hourly settlement
  const interest = g.loan * C.loanRate / 8760;
  const reserve = reserveSettle(s, hIdx, gen);
  const net = rev - s.acc.envCharge - om - interest + reserve;
  let sub = 0;
  const operated = gen + pump + ren > 0;
  if (g.profitProtect && operated && net < C.subsidyMin) sub = C.subsidyMin - net;         // §8 profit protection
  g.cash += net + sub;
  s.subsidy += sub; g.subsidyTotal = (g.subsidyTotal || 0) + sub;
  s.dayProfit += net + sub;
  s.lastNet = net + sub; s.lastRev = rev; s.lastCost = om + s.acc.envCharge + interest;
  s.lastNetMW = (gen - pump + ren + s.acc.batExp - s.acc.batImp) / 1;
  pushHist(s.hist.price, p); pushHist(s.hist.vu, s.Vu / 1e6); pushHist(s.hist.vl, s.Vl / 1e6);
  pushHist(s.hist.gen, gen); pushHist(s.hist.pump, pump); pushHist(s.hist.ren, ren);
  s.acc = {genMWh: 0, pumpMWh: 0, renMWh: 0, batImp: 0, batExp: 0, envCharge: 0, envUnmet: 0, spillM3: s.acc.spillM3 * 0};
  if (g.cash < 0 && !g.bankrupt){ g.bankrupt = true; alert(g, 'Bankrupt: cash is below zero. Take an emergency loan or continue in sandbox.', 'alarm'); }
  return net;
}
function pushHist(a, v){ a.push(v); if (a.length > CONFIG.ringN) a.shift(); }
let renAcc = {};
function renewableMWh(s){ return renAcc[s.id] || 0; }
function reserveSettle(s, hIdx, gen){                                                       // §10 reserve market with call and fines
  if (s.resOffer <= 0) return 0;
  const day = Math.floor(hIdx / 24);
  const start = Math.floor(R.u(s.seed + 13, day) * 20) + 2, len = 3;
  const hd = hIdx - 24 * day;
  if (hd < start || hd >= start + len) return s.resOffer * CONFIG.reserveRate;
  const delivered = s.PMW;
  if (delivered + 1e-9 >= s.resOffer * 0.9){ s.reliab = 0.95 * s.reliab + 0.05; return s.resOffer * CONFIG.reserveRate; }
  s.reliab = 0.95 * s.reliab;
  return -CONFIG.reserveFine * (s.resOffer - delivered);
}
function alert(g, text, level){ g.alerts.unshift({t: g.t, text, level: level || 'info'}); if (g.alerts.length > 60) g.alerts.pop(); }

/* ---------- Construction jobs (advance every step) ---------- */
function jobsStep(s, g, dt){
  for (const j of s.jobs){
    j.left -= dt;
    if (j.left <= 0){
      j.done = true;
      if (j.type === 'raise'){ s.damH = j.target; s.VuMax = s.Au * s.damH; alert(g, 'Dam raise to ' + s.damH + ' m complete at ' + s.name + '.'); }
      if (j.type === 'excav'){ s.lowerH += CONFIG.excavStepM; s.VlMax = s.Al * s.lowerH; alert(g, 'Excavation stage finished at ' + s.name + '.'); }
      if (j.type === 'repair'){ s.dam.crack = false; s.dam.wear = 0; alert(g, 'Dam crack repaired at ' + s.name + '.'); }
    }
  }
  s.jobs = s.jobs.filter(j => !j.done);
}

/* ---------- One site, one step: weather → renewables → plant → reservoirs → wear → economy → clock ---------- */
function stepSite(s, g, dt){
  renAcc[s.id] = 0;
  s.sinE = sunSin(s, g.t);
  s.renMW = renewablesStep(s);                                                              // renewables
  renAcc[s.id] = s.renMW * dt / 3600;                                                       // energy netting input
  s.acc.renMWh += renAcc[s.id];
  batteryStep(s, dt);
  plantStep(s, g, dt);                                                                      // plant solve + reservoirs
  jobsStep(s, g, dt);                                                                       // construction
}

/* ---------- Game state ---------- */
function mkGame(o){
  const C = CONFIG;
  const g = {
    schema: 1, seed: o.seed | 0, kind: o.kind || 'classic', bias: o.bias | 0, river: o.river | 0,
    demo: !!o.demo, t: 0, lastHour: 0, day: 0,
    cash: o.demo ? C.demoCash : C.startCash, loan: 0, emergencyUsed: false, bankrupt: false,
    quests: {q1: 0, q2: 0, q3: 0, q4: 0, q5: 0, q6: 0}, claimed: {}, won: false,
    alerts: [], sites: [], active: 0, speed: 2, paused: true, turnTo: -1,
    profitProtect: true, god: false, godCheap: 30, godPeak: 80, godQ: 6, cashReserve: 20000,
    sitesBought: 1, permits: 1, subsidyTotal: 0, nextSiteSeed: o.seed | 0, dayStartCash: 0
  };
  g.sites.push(mkSite(1, o.kind === 'classic' ? 'Classic Two-Lake Site' : 'Canyon Site A', o.kind, o.seed | 0, o));
  if (o.kind === 'classic'){ g.sites[0].kind = 'classic'; }
  // starter Tier-2 solar on parcel 1 tile 0 is included in mkSite
  if (o.kind === 'classic') g.sites[0].river = 0;
  alert(g, 'Welcome to your field station. Press Space or the Pause button to start the clock.');
  g.dayStartCash = g.cash;
  return g;
}

/* ---------- Actions: validate, charge, reject with reason ---------- */
function applyAction(g, a){
  const C = CONFIG;
  const site = g.sites[a.site != null ? a.site : g.active];
  const fail = (reason) => ({ok: false, reason});
  const ok = (extra) => Object.assign({ok: true}, extra || {});
  if (!a || typeof a.type !== 'string') return fail('Malformed action');
  switch (a.type){
    case 'SET_SPEED': { const sp = a.speed | 0; if (sp < 1 || sp > 6) return fail('Speed must be 1–6'); g.speed = sp; g.paused = false; return ok(); }
    case 'PAUSE': { g.paused = a.on === undefined ? !g.paused : !!a.on; return ok(); }
    case 'TURN_STEP': { g.turnTo = (Math.floor(g.t / 3600) + 1) * 3600; g.paused = true; return ok(); }
    case 'SET_FLOW': {
      if (!site) return fail('No site');
      const q = +a.q; if (!isFinite(q) || q < 0) return fail('Flow must be ≥ 0');
      if (q > C.qMaxT) return fail('Flow above machine limit ' + C.qMaxT + ' m³/s');
      site.setQ = q; return ok();
    }
    case 'SET_MODE': {
      if (!site) return fail('No site');
      if (['gen', 'pump', 'idle'].indexOf(a.mode) < 0) return fail('Unknown mode');
      if (a.mode === 'gen' && site.Vu <= 0) return fail('Upper reservoir is empty');
      if (a.mode === 'pump' && site.Vl <= 0) return fail('Lower reservoir is empty');
      site.auto = false; site.mode = a.mode; site.reqMode = a.mode; return ok({status: 'manual'});
    }
    case 'SET_AUTO': { if (!site) return fail('No site'); site.auto = !!a.on; return ok(); }
    case 'SET_RULE': {
      if (!site) return fail('No site');
      const r = site.rules[a.slot | 0]; if (!r) return fail('No such rule slot');
      Object.assign(r, {on: !!a.on, cond: a.cond || r.cond, val: +(a.val != null ? a.val : r.val), act: a.act || r.act, q: +(a.q != null ? a.q : r.q)});
      if (!isFinite(r.val) || !isFinite(r.q)) return fail('Rule values must be numbers');
      return ok();
    }
    case 'SET_CURTAIL': {
      if (!site) return fail('No site');
      const it = site.installs.find(x => x.id === a.id); if (!it || it.kind !== 'wind') return fail('Not a wind turbine');
      it.curtail = clamp(+a.frac || 0, 0, 1); return ok();
    }
    case 'SET_RESERVE_OFFER': {
      if (!site) return fail('No site');
      const lim = C.qRated * 1.0 * 0.6 * 0.5 + 0.7 + 0.1; // plant reserve headroom (MW), see notes
      const mw = +a.mw; if (!isFinite(mw) || mw < 0) return fail('Offer must be ≥ 0 MW');
      if (mw > lim) return fail('Offer exceeds plant headroom of ' + lim.toFixed(2) + ' MW');
      site.resOffer = mw; return ok();
    }
    case 'RAISE_DAM': case 'PLACE_DAM': {
      if (!site) return fail('No site');
      const h = Math.round(+a.h); if (!isFinite(h)) return fail('Height must be a number');
      const max = g.demo ? 200 : C.damMax;
      if (h > max) return fail('Above class limit ' + max + ' m');
      if (h <= site.damH) return fail('Target must be above current ' + site.damH + ' m');
      if (site.jobs.some(j => j.type === 'raise')) return fail('A dam raise is already in progress');
      const cost = (h - site.damH) * C.damCostPerM;
      if (!g.demo && g.cash - cost < 0) return fail('Insufficient cash: need ' + money(cost));
      g.cash -= g.demo ? 0 : cost;
      if (g.demo){ site.damH = h; site.VuMax = site.Au * h; return ok({instant: true}); }
      site.jobs.push({type: 'raise', target: h, left: 12 * 3600 * (h - site.damH), total: 12 * 3600 * (h - site.damH)});
      return ok();
    }
    case 'EXCAVATE': {
      if (!site) return fail('No site');
      if (site.jobs.some(j => j.type === 'excav')) return fail('Excavation already in progress');
      if (!g.demo && g.cash < C.excavCost) return fail('Insufficient cash');
      if (!g.demo) g.cash -= C.excavCost;
      if (g.demo){ site.lowerH += C.excavStepM; site.VlMax = site.Al * site.lowerH; return ok({instant: true}); }
      site.jobs.push({type: 'excav', left: 24 * 3600, total: 24 * 3600}); return ok();
    }
    case 'BUILD': {
      if (!site) return fail('No site');
      const tier = ((a.tier | 0) || 2) - 1; if (tier < 0 || tier > 2) return fail('Tier must be 1–3');
      if (!site.owned || !site.owned[a.parcel]) return fail('Parcel not owned');
      const tile = a.tile | 0; if (tile < 0 || tile > 15) return fail('No such tile');
      const occupied = site.installs.find(x => x.parcel === a.parcel && x.tile === tile);
      if (a.kind === 'battery'){
        const b = site.batt.find(x => !x.built); if (!b) return fail('All battery slots built');
        const cost = C.batCostPerMWh * 4; if (!g.demo && g.cash < cost) return fail('Insufficient cash');
        if (!g.demo) g.cash -= cost; b.built = true; b.cap = 4; b.soc = 0.5; return ok();
      }
      if (occupied) return fail('Tile already occupied by ' + occupied.kind);
      if (a.kind !== 'solar' && a.kind !== 'wind') return fail('Unknown build kind');
      let cost = a.kind === 'solar' ? C.solarCost[tier] : C.windCost[tier];
      const other = site.installs.some(x => x.parcel === a.parcel && x.tile === tile && x.kind !== a.kind);
      if (other) cost *= 1 - C.coloc;                                                        // §9 co-location discount on equipment only
      if (!g.demo && g.cash < cost) return fail('Insufficient cash: need ' + money(cost));
      if (!g.demo) g.cash -= cost;
      site.installs.push({id: site.installs.length + 1 + (site.nextIdBump || 0), kind: a.kind, parcel: a.parcel, tile, tier: tier + 1,
        capMW: a.kind === 'solar' ? C.solarMW[tier] : C.windMW[tier], soil: 0, dmg: 0, curtail: 0, starter: false});
      return ok({cost, discount: other});
    }
    case 'BUY_PERMIT': {
      if (!site) return fail('No site');
      const p = site.parcels; if (p >= 2) return fail('No further parcels');
      if (!g.demo && g.cash < C.permitCost) return fail('Insufficient cash');
      if (!g.demo) g.cash -= C.permitCost; site.parcels = p + 1; site.owned[p] = true; return ok();
    }
    case 'BUY_SITE': {
      if (g.sites.length >= 3) return fail('Site limit reached');
      if (!g.demo && g.cash < C.siteCost) return fail('Insufficient cash');
      if (!g.demo) g.cash -= C.siteCost;
      const seed = g.nextSiteSeed + 101 * g.sites.length;
      g.sites.push(mkSite(g.sites.length + 1, 'Canyon Site ' + String.fromCharCode(65 + g.sites.length), 'procedural', seed, {bias: g.bias, river: g.river, demo: g.demo}));
      return ok({index: g.sites.length - 1});
    }
    case 'REPLACE_PENSTOCK': {
      if (!site) return fail('No site');
      const cost = 4e5; if (!g.demo && g.cash < cost) return fail('Insufficient cash');
      if (!g.demo) g.cash -= cost; site.health = 100; return ok();
    }
    case 'CLEAN_ARRAY': {
      if (!site) return fail('No site');
      const it = site.installs.find(x => x.id === a.id && x.kind === 'solar'); if (!it) return fail('Not a solar array');
      const cost = 2000; if (!g.demo && g.cash < cost) return fail('Insufficient cash');
      if (!g.demo) g.cash -= cost; it.soil = 0; return ok({cost});
    }
    case 'REPAIR': {
      if (!site) return fail('No site');
      if (a.target === 'wind'){
        const it = site.installs.find(x => x.id === a.id && x.kind === 'wind' && x.dmg); if (!it) return fail('Turbine not damaged');
        const cost = 5e4; if (!g.demo && g.cash - cost < g.cashReserve) return fail('Would breach cash reserve');
        if (!g.demo) g.cash -= cost; it.dmg = 0; return ok();
      }
      if (!site.dam.crack) return fail('No dam crack to repair');
      if (site.jobs.some(j => j.type === 'repair')) return fail('Repair already under way');
      const value = site.damH * C.damCostPerM * 4;
      const cost = 0.05 * value;
      if (!g.demo && g.cash < cost) return fail('Insufficient cash');
      if (!g.demo) g.cash -= cost;
      site.jobs.push({type: 'repair', left: 24 * 3600, total: 24 * 3600}); return ok({cost});
    }
    case 'TAKE_LOAN': {
      const amt = +a.amt; if (!(amt > 0)) return fail('Amount must be positive');
      if (g.loan + amt > C.loanMax) return fail('Loan limit ' + money(C.loanMax));
      if (g.cash < 0){ if (g.emergencyUsed) return fail('Emergency credit already used'); if (amt > 50000) return fail('Emergency credit is $50,000'); g.emergencyUsed = true; }
      g.loan += amt; g.cash += amt; return ok();
    }
    case 'REPAY_LOAN': {
      const amt = Math.min(+a.amt || 0, g.loan, Math.max(0, g.cash)); if (!(amt > 0)) return fail('Nothing to repay');
      g.loan -= amt; g.cash -= amt; return ok({repaid: amt});
    }
    case 'BUY_BATTERY': return applyAction(g, {type: 'BUILD', kind: 'battery', site: a.site});
    case 'SET_GOD': { g.god = !!a.on; return ok(); }
    case 'SET_GOD_PARAMS': {
      g.godQ = clamp(+a.q || 0, 0, C.qMaxT); g.cashReserve = Math.max(0, +a.reserve || 0);
      g.godCheap = +a.cheap || g.godCheap; g.godPeak = +a.peak || g.godPeak; return ok();
    }
    case 'SET_PROFIT_PROTECT': { g.profitProtect = !!a.on; return ok(); }
    case 'SET_ACTIVE': { const i = a.index | 0; if (!g.sites[i]) return fail('No such site'); g.active = i; return ok(); }
    case 'CLAIM_QUEST': {
      const q = QUESTS.find(x => x.id === a.id); if (!q) return fail('Unknown quest');

function money(v){ return (v < 0 ? '−$' : '$') + Math.abs(Math.round(v)).toLocaleString('en-US'); }

/* ---------- Quests (6) ---------- */
const QUESTS = [
  {id: 'q1', title: 'First power', text: 'Generate 1 MWh in total.', reward: 10000, stamp: 'GENERATED'},
  {id: 'q2', title: 'Pump cycle', text: 'Pump 5 MWh back uphill.', reward: 10000, stamp: 'PUMPED'},

  {id: 'q4', title: 'Raise the wall', text: 'Raise the dam to 35 m.', reward: 15000, stamp: 'DAM UP'},
  {id: 'q5', title: 'Reserve ready', text: 'Hold a reserve offer with reliability ≥ 0.9.', reward: 12000, stamp: 'RESERVE'},
  {id: 'q6', title: 'A week in the black', text: 'Seven days of positive profit.', reward: 20000, stamp: 'ON BOOKS'}

function evalQuests(g){
  const s = g.sites[0];
  g.quests.q1 = s.totalGen >= 1 ? 1 : 0;
  g.quests.q2 = s.totalPump >= 5 ? 1 : 0;
  g.quests.q3 = s.installs.some(x => x.kind === 'solar') ? 1 : 0;
  g.quests.q4 = s.damH >= 35 ? 1 : 0;
  g.quests.q5 = s.resOffer > 0 && s.reliab >= 0.9 ? 1 : 0;
  const d = s.dayHist; g.quests.q6 = d.length >= 7 && d.slice(-7).every(v => v > 0) ? 1 : 0;
}

/* ---------- Engine: fixed-step, hour and day boundaries ---------- */
function stepGame(g, dt){
  if (g.t > 0 && g.t % 3600 === 0 && Math.floor(g.t / 3600) !== g.lastHour){
    const h = Math.floor(g.t / 3600);
    for (const s of g.sites){ settleHourSafe(s, g, h - 1); s.price = priceAt(s, h); }
    g.lastHour = h;
    for (const s of g.sites) climateHour(s, h);
    if (h % 24 === 0){ g.day = h / 24; for (const s of g.sites) dayBoundary(s, g.day); evalQuests(g); }
  }
  if (g.lastHour === 0 && g.t === 0){
    for (const s of g.sites){ climateHour(s, 0); s.price = priceAt(s, 0); }
    g.lastHour = 0;
  }
  for (const s of g.sites) stepSite(s, g, dt);
  g.t += dt;
  if (g.turnTo > 0 && g.t >= g.turnTo){ g.turnTo = -1; g.paused = true; }
}
function settleHourSafe(s, g, hIdx){ if (hIdx >= 0) settleHour(s, g, hIdx); }

/* ---------- Hash, save schema, replay ---------- */
function stateHash(g){
  let h = 2166136261;
  const feed = (str) => { for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } };
  feed(String(g.t)); feed(String(g.cash.toFixed(6)));
  for (const s of g.sites) feed([s.Vu, s.Vl, s.qAct, s.damH, s.health, s.totalGen, s.totalPump].map(v => v.toFixed(6)).join(','));
  return ('00000000' + (h >>> 0).toString(16)).slice(-8);
}
function serialize(g){ return JSON.stringify({format: 'hydropower-tycoon', schema: 1, game: g}); }
function validateSave(obj){
  if (!obj || obj.format !== 'hydropower-tycoon' || obj.schema !== 1) return 'Not a Hydropower Tycoon save (schema 1)';
  const g = obj.game; if (!g || !Array.isArray(g.sites) || g.sites.length < 1) return 'Save has no sites';
  if (typeof g.seed !== 'number' || typeof g.t !== 'number' || typeof g.cash !== 'number') return 'Save fields are missing';
  for (const s of g.sites){
    if (![s.Vu, s.Vl, s.damH, s.Au, s.Al, s.health].every(v => typeof v === 'number' && isFinite(v))) return 'Site ' + s.name + ' has invalid numbers';
    if (s.Vu < 0 || s.Vl < 0) return 'Negative reservoir volume';
  }
  return null;
}
function deserialize(txt){
  let obj; try { obj = JSON.parse(txt); } catch (e){ return {error: 'Save is not valid JSON'}; }
  const err = validateSave(obj); if (err) return {error: err};
  return {game: obj.game};
}

/* ---------- Game facade ---------- */
const Game = (() => {
  let g = null;
  let lastGood = null;
  return {
    newGame(o){ g = mkGame(o); lastGood = null; return g; },
    has(){ return !!g; },
    dispatch(a){
      if (!g) return {ok: false, reason: 'No game in progress'};
      try { const r = applyAction(g, a); return r; }
      catch (e){ return {ok: false, reason: 'Internal: ' + e.message}; }
    },
    step(dt){ if (!g) return; stepGame(g, dt); },
    getSnapshot(){ return g ? JSON.parse(JSON.stringify(g)) : null; },
    raw(){ return g; },
    load(game){ g = game; return g; },
    hash(){ return g ? stateHash(g) : ''; },
    save(){ return g ? serialize(g) : ''; }
  };
})();

/* ============================================================================
   Self-test (audit). Runs in short chunks so the UI stays responsive.
   ============================================================================ */
function makeTestSite(seed, opts){
  const g = mkGame({seed, kind: 'procedural', bias: 1, river: 1, demo: false});
  g.sites[0].noEvap = true; g.sites[0].dry = true; g.sites[0].kind = 'classic';
  Object.assign(g.sites[0], opts || {});
  return g;
}
function runStepsSec(g, sec, dt){ const n = Math.round(sec / dt); for (let i = 0; i < n; i++) stepGame(g, dt); }
function runAudit(){
  const A = window.__HYDRO_AUDIT__;
  A.status = 'pending'; A.testResults = []; A.allPassed = false; A.ticksRun = 0; A.nanCount = 0;
  const checks = [];
  const add = (name, fn) => checks.push({name, fn});
  // 1–3 mass conservation at dt 1, 5, 30
  for (const dt of [1, 5, 30]){
    add('Mass conservation dt=' + dt + ' s (1 m³/s·h = 3600 m³)', () => {
      const g = makeTestSite(7, {}); const s = g.sites[0];
      s.setQ = 1; s.mode = 'gen';
      runStepsSec(g, 3600, dt); // ramp to steady flow
      const v0 = s.Vu, l0 = s.Vl;
      runStepsSec(g, 3600, dt);
      const dU = s.Vu - v0, dL = s.Vl - l0;
      const ok = Math.abs(dU + 3600) < 1e-3 && Math.abs(dL - 3600) < 1e-3;
      return {ok, detail: 'ΔVu ' + dU.toFixed(4) + ' m³, ΔVl ' + dL.toFixed(4) + ' m³ (expected ∓3600)'};
    });
  }
  add('Energy netting: 1 h at steady flow equals P × 1 h', () => {
    const g = makeTestSite(8, {}); const s = g.sites[0];
    s.setQ = 5; s.mode = 'gen'; runStepsSec(g, 3600, 60);
    const e0 = s.totalGen; const P0 = s.PMW; runStepsSec(g, 3600, 60);
    const e = s.totalGen - e0; const P = s.PMW;
    return {ok: Math.abs(e - P) < 0.02 * Math.max(1, Math.abs(P)) && P0 > 0, detail: 'E ' + e.toFixed(4) + ' MWh, P ' + P.toFixed(4) + ' MW'};
  });
  add('Environmental charge equals unmet volume × $0.50', () => {
    const g = makeTestSite(9, {}); const s = g.sites[0]; s.kind = 'procedural'; s.noEvap = true;
    s.Vl = 0; s.Vu = s.VuMax * 0.5; s.mode = 'idle';
    runStepsSec(g, 3600, 60);
    const expect = s.acc.envUnmet * CONFIG.envCharge;
    return {ok: Math.abs(expect - s.acc.envCharge) < 1e-6 && s.acc.envUnmet > 0, detail: 'unmet ' + s.acc.envUnmet.toFixed(0) + ' m³, charge $' + s.acc.envCharge.toFixed(2)};
  });
  add('Reserve offer validation accepts within limit, rejects above', () => {
    const g = makeTestSite(10, {});
    const lim = CONFIG.qRated * 1.0 * 0.6 * 0.5 + 0.7 + 0.1;
    const a = applyAction(g, {type: 'SET_RESERVE_OFFER', mw: 0.7, site: 0});
    const b = applyAction(g, {type: 'SET_RESERVE_OFFER', mw: lim + 0.5, site: 0});
    return {ok: a.ok && !b.ok, detail: '0.7 MW ' + (a.ok ? 'accepted' : 'rejected') + '; ' + (lim + 0.5).toFixed(2) + ' MW ' + (b.ok ? 'accepted' : 'rejected: ' + b.reason)};
  });
  add('Battery state of charge stays in 10–95 % window (3 days)', () => {
    const g = makeTestSite(11, {}); runStepsSec(g, 3 * 86400, 60);
    const b = g.sites[0].batt[0];
    return {ok: b.soc >= 0.1 - 1e-9 && b.soc <= 0.95 + 1e-9, detail: 'SOC ' + (b.soc * 100).toFixed(1) + ' %'};
  });
  add('Dam raise rejects above class limit and charges cost', () => {
    const g = makeTestSite(12, {}); const before = g.cash;
    const bad = applyAction(g, {type: 'RAISE_DAM', h: CONFIG.damMax + 5, site: 0});
    const good = applyAction(g, {type: 'RAISE_DAM', h: g.sites[0].damH + 2, site: 0});
    return {ok: !bad.ok && good.ok && Math.abs((before - g.cash) - 2 * CONFIG.damCostPerM) < 1e-6, detail: 'bad: ' + (bad.reason || 'accepted') + '; cost ' + money(before - g.cash)};
  });
  add('Actions reject with a reason instead of throwing', () => {
    const g = makeTestSite(13, {});
    let threw = false, r;
    try { r = applyAction(g, {type: 'SET_FLOW', q: 999, site: 0}); r = applyAction(g, {type: 'NOPE'}); } catch (e){ threw = true; }
    return {ok: !threw && r && !r.ok && typeof r.reason === 'string', detail: r ? r.reason : 'none'};
  });
  add('Determinism: same seed, same actions, same hash', () => {
    const a = makeTestSite(21, {}), b = makeTestSite(21, {});
    runStepsSec(a, 86400, 60); runStepsSec(b, 86400, 60);
    return {ok: stateHash(a) === stateHash(b), detail: stateHash(a) + ' vs ' + stateHash(b)};
  });
  add('Different seed gives a different hash', () => {
    const a = makeTestSite(21, {}), b = makeTestSite(22, {});
    runStepsSec(a, 86400, 60); runStepsSec(b, 86400, 60);
    return {ok: stateHash(a) !== stateHash(b), detail: stateHash(a) + ' vs ' + stateHash(b)};
  });
  add('Save at day 10, load, continue to day 30 matches a straight run', () => {
    const a = mkGame({seed: 31, kind: 'procedural', bias: 1, river: 1});
    runStepsSec(a, 10 * 86400, 60);
    const txt = serialize(a);
    runStepsSec(a, 20 * 86400, 60);
    const r = deserialize(txt); if (r.error) return {ok: false, detail: r.error};
    const b = r.game; runStepsSec(b, 20 * 86400, 60);
    return {ok: stateHash(a) === stateHash(b), detail: stateHash(a) + ' vs ' + stateHash(b)};
  });
  add('Three-day robustness: no NaN, volumes in bounds, health 0–100', () => {
    const g = mkGame({seed: 41, kind: 'procedural', bias: 2, river: 2});
    g.sites[0].batt[0].soc = 0.5; g.sites[0].resOffer = 0.5; g.sites[0].auto = true;
    g.sites[0].rules[0] = {on: true, cond: 'price_below', val: 30, act: 'pump', q: 8};
    g.sites[0].rules[1] = {on: true, cond: 'price_above', val: 60, act: 'gen', q: 9};
    let nan = 0;
    const n = 3 * 1440;
    for (let i = 0; i < n; i++){
      stepGame(g, 60);
      const s = g.sites[0];
      if (![s.Vu, s.Vl, s.health, s.PMW, s.Hn, g.cash].every(isFinite)) nan++;
    }
    const s = g.sites[0];
    const ok = nan === 0 && s.Vu >= 0 && s.Vu <= s.VuMax + 1e-6 && s.Vl >= 0 && s.Vl <= s.VlMax + 1e-6 && s.health >= 0 && s.health <= 100;
    A.ticksRun += n; A.nanCount += nan;
    return {ok, detail: 'NaN steps ' + nan + ', Vu ' + (s.Vu / 1e6).toFixed(2) + ' hm³, health ' + s.health.toFixed(2)};
  });
  add('Wind rotor rpm follows 60·λ·v/(2πR) (v = 8 m/s)', () => {
    const rpm = windRpm(8); const expect = 60 * 7 * 8 / (2 * Math.PI * 25);
    return {ok: Math.abs(rpm - expect) < 1e-9, detail: rpm.toFixed(3) + ' rpm'};
  });
  add('Negative spot prices occur in summer middays', () => {
    const s = mkSite(1, 'x', 'classic', 51, {}); let mn = 1e9;
    for (let d = 150; d < 160; d++) for (let h = 0; h < 24; h++) mn = Math.min(mn, priceBase(s, d * 24 + h));
    return {ok: mn < 0, detail: 'min price ' + mn.toFixed(1) + ' $/MWh'};
  });
  add('Pacing report: mean daily profit and Tier-2 payback (30 days)', () => {
    const g = mkGame({seed: 61, kind: 'procedural', bias: 1, river: 1});
    g.sites[0].auto = true;
    g.sites[0].rules[0] = {on: true, cond: 'price_below', val: 35, act: 'pump', q: 8};
    g.sites[0].rules[1] = {on: true, cond: 'price_above', val: 65, act: 'gen', q: 8};
    const c0 = g.cash;
    runStepsSec(g, 30 * 86400, 60);
    const perDay = (g.cash - c0) / 30;
    const payback = perDay > 0 ? CONFIG.tier2Cost / perDay : Infinity;
    const s = g.sites[0];
    A.pacing = {meanNetPerDay: perDay, tier2Cost: CONFIG.tier2Cost, paybackDays: payback, subsidy: g.subsidyTotal};
    return {ok: isFinite(perDay), detail: 'mean net/day ' + money(perDay) + ' · Tier-2 payback ' + (isFinite(payback) ? payback.toFixed(0) + ' days' : 'never at current pacing') + ' · subsidy ' + money(g.subsidyTotal || 0)};
  });
  let idx = 0;
  const t0 = performance.now();
  function next(){
    if (idx >= checks.length){
      A.allPassed = A.testResults.every(r => r.ok);
      A.status = A.allPassed ? 'complete' : 'failed';
      A.perf.auditMs = Math.round(performance.now() - t0);
      renderAudit();
      return;
    }
    const c = checks[idx++];
    let res;
    try { res = c.fn(); } catch (e){ res = {ok: false, detail: 'threw: ' + e.message}; }
    A.testResults.push({name: c.name, ok: !!res.ok, detail: res.detail});
    A.ticksRun = A.ticksRun;
    renderAudit();
    setTimeout(next, 0);
  }
  setTimeout(next, 0);
  function renderAudit(){
    const panel = window.__auditPanel;
    if (!panel) return;
    panel.innerHTML = `<h2>Self-test: ${A.status}</h2><p class="sub">${A.testResults.filter(r => r.ok).length}/${checks.length} passed</p>` +
      A.testResults.map(r => `<div class="row" style="justify-content:space-between"><span class="${r.ok ? '' : 'alarm'}">${r.ok ? 'PASS' : 'FAIL'} · ${r.name}</span><span class="sub mono">${r.detail}</span></div>`).join('');
    if (A.pacing) panel.innerHTML += `<h3>Pacing report</h3><p class="mono">Mean net per day ${money(A.pacing.meanNetPerDay)} · Tier-2 pair ${money(A.pacing.tier2Cost)} · payback ${isFinite(A.pacing.paybackDays) ? A.pacing.paybackDays.toFixed(0) + ' days' : 'n/a'}</p>`;
  }
  U_showAudit();
  return A;
}
function U_showAudit(){
  if (!window.__auditPanel){ const d = document.createElement('div'); d.className = 'card'; d.style.cssText = 'left:8px;right:8px;top:104px;max-width:560px;max-height:60vh'; document.body.appendChild(d); window.__auditPanel = d; }
  window.__auditPanel.classList.remove('hidden');
  window.__auditPanel.innerHTML = '<h2>Self-test running…</h2>';
  window.__auditPanel.onclick = null;
}

/* ============================================================================
   Boot, input and frame loop
   ============================================================================ */
window.__HYDRO_AUDIT__ = {status: 'unavailable', testResults: [], allPassed: false, ticksRun: 0, nanCount: 0, stateHash: '', perf: {frameMs: 0, auditMs: 0, slowFrames: 0, quality: 2}, pacing: null,
  getSnapshot(){ return Game.getSnapshot(); }};
Object.defineProperty(window.__HYDRO_AUDIT__, 'stateHash', {get(){ return Game.hash(); }, enumerable: true});

const Boot = {last: 0, acc: 0, slow: 0, slowSince: 0, budget: 0};
function frameLoop(now){
  try {
    const dtWall = Math.min(0.1, (now - (Boot.last || now)) / 1000); Boot.last = now;
    const g = Game.raw();
    if (g){
      if (g.paused){ Boot.acc = 0; }
      const rate = CONFIG.speeds[g.speed - 1] || 60;
      if (!g.paused){ Boot.acc += dtWall * rate; }
      if (g.turnTo > 0 && g.t < g.turnTo){ Boot.acc = Math.max(Boot.acc, CONFIG.stepS); }
      const t0 = performance.now();
      let steps = 0;
      while (Boot.acc >= CONFIG.stepS || (g.turnTo > 0 && g.t < g.turnTo && steps < 100000)){
        if (performance.now() - t0 > CONFIG.frameBudgetMs){ UI.lagging = true; break; }
        Game.step(CONFIG.stepS); steps++; if (!g.paused || g.turnTo > 0) Boot.acc -= CONFIG.stepS; else Boot.acc = 0;
        if (g.turnTo <= 0 && g.paused) break;
        if (steps > 2000) break;
      }
      if (Boot.acc > CONFIG.stepS * 6) UI.lagging = true; else if (steps && !Boot.acc) UI.lagging = false;
      if (Boot.acc < CONFIG.stepS * 2) UI.lagging = false;
      const frameMs = performance.now() - t0 + 0;
      Boot.budget = frameMs;
      if (Game.raw() && g.t % 3600 === 0 && g.lastHour !== Boot.lastAutosaveHour){
        Boot.lastAutosaveHour = g.lastHour;
        if (g.t % 86400 === 0) UI.writeSlot(0, Game.save());
      }
      if (!g.paused && World.quality >= 0) { /* frame timing below */ }
    }
    if (World.ok){
      const snap = Game.getSnapshot();
      if (snap) World.frame(snap, now / 1000, Math.min(0.1, dtWall));
    }
    if (performance.now() - (Boot.uiT || 0) > 120){ Boot.uiT = performance.now(); UI.render(false); }
    // quality step-down on sustained slow frames
    const ft = dtWall * 1000;
    window.__HYDRO_AUDIT__.perf.frameMs = ft;
    if (ft > CONFIG.slowFrameMs){ if (!Boot.slowSince) Boot.slowSince = now; if (now - Boot.slowSince > 2000 && World.quality > 0){ World.setQuality(World.quality - 1); Boot.slowSince = 0; UI.autoQualityNote = 'Quality stepped down to ' + ['Low', 'Medium', 'High'][World.quality] + ' after sustained slow frames.'; window.__HYDRO_AUDIT__.perf.quality = World.quality; UI.toast('Quality stepped down for speed (Settings).', 'warn'); } }
    else Boot.slowSince = 0;
  } catch (e){
    UI.showError(e);
    try { Game.dispatch({type: 'PAUSE', on: true}); } catch (x){}
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frameLoop);
}

function boot(){
  UI.loadSettings();
  document.body.dataset.theme = UI.settings.theme || 'field';
  window.__reduceMotion = !!UI.settings.reduce || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const cv = document.getElementById('gl');
  let ok = false;
  try { ok = World.init(cv); } catch (e){ ok = false; }
  if (ok){ World.attach(); World.setStyle(UI.settings.style); World.setQuality(UI.settings.quality ?? 2); World.setCamera(UI.settings.reverse); }
  else {
    const f = document.createElement('div');
    f.className = 'fallback card';
    f.style.cssText = 'left:50%;top:50%;transform:translate(-50%,-50%);max-width:460px;z-index:20';
    f.innerHTML = '<h2>3D view unavailable</h2><p class="sub">This browser has no WebGL2 or Three.js did not load. The simulation still runs; use Build and Operate panels to manage the plant.</p>';
    document.body.appendChild(f);
  }
  // start a game immediately with the classic site so the view is alive
  Game.newGame({seed: 4242, kind: 'classic', bias: 1, river: 0, demo: false});
  Game.dispatch({type: 'SET_SPEED', speed: 2});
  Game.dispatch({type: 'PAUSE', on: true});
  // speeds and buttons ready
  UI.render(true);
  // keyboard
  window.addEventListener('keydown', (ev) => {
    const k = ev.key;
    if (k === 'Escape'){ if (UI.panel) UI.closePanel(); UI.closeCard(); if (UI.drawer) UI.toggleDrawer(false); document.getElementById('modalHost').innerHTML = ''; return; }
    if (ev.target && /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
    if (k === ' '){ ev.preventDefault(); UI.act('PAUSE', {}); }
    else if (/^[1-6]$/.test(k)) UI.act('SET_SPEED', {speed: +k});
    else if (k === 't' || k === 'T') UI.act('TURN_STEP', {});
    else if (k === 'c' || k === 'C') UI.cycleLens();
    else if (k === 'f' || k === 'F'){ const s = Game.getSnapshot().sites[Game.getSnapshot().active]; if (s) World.flyTo('overview', s); }
    else if (k === 'F1'){ ev.preventDefault(); UI.toggleDrawer(); }
    else if (k === 'F2'){ ev.preventDefault(); UI.toggleDebug(); }
    else if (k.startsWith('Arrow') || 'wasdWASDqeQE'.indexOf(k) >= 0){ World.key(k); }
  });
  window.addEventListener('keydown', (ev) => { if (ev.key === 'F1' || ev.key === 'F2') ev.preventDefault(); });
  // slider drag guard: do not rebuild panels under the pointer
  document.addEventListener('pointerdown', (e) => { window.__sliding = !!(e.target && e.target.type === 'range'); });
  document.addEventListener('pointerup', () => { window.__sliding = false; });
  // fix audit visibility
  window.__HYDRO_AUDIT__.status = 'pending';
  setTimeout(() => { window.__HYDRO_AUDIT__.status = 'unavailable'; }, 0);
  // expose audit runner via settings button and quick key
  window.addEventListener('keydown', (ev) => { if (ev.key === 'F9') runAudit(); });
  requestAnimationFrame ? requestAnimationFrame(frameLoop) : frameLoop(0);
  if (typeof requestAnimationFrame !== 'function') { /* headless: game remains steppable via Game.step */ }
}
window.addEventListener('error', (e) => { try { UI.showError(e.error || e.message); } catch (x){} });
window.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
</script>
