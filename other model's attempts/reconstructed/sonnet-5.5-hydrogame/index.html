<style>
:root{--blur:none;--radius:14px}
:root[data-theme=notes]{--bg:#e9e0c9;--panel:#fbf6e9;--panel2:#f1e9d2;--ink:#2b2a26;--ink2:#5a5547;--line:#cfc4a8;--accent:#2b6455;--accent2:#8a4b00;--btn:#f4ecd6;--btnh:#e9dfc2;--good:#25613a;--bad:#9b2525;--warn:#8a4b00;--focus:#1b4fd6;--font:Georgia,'Iowan Old Style','Palatino Linotype',serif;--mono:ui-monospace,Menlo,Consolas,monospace;--shadow:0 2px 0 rgba(70,55,30,.14),0 10px 26px rgba(70,55,30,.16)}
:root[data-theme=brass]{--bg:#1b2024;--panel:#2b343a;--panel2:#222a2f;--ink:#f3e8c9;--ink2:#cbbf99;--line:#5c5a4a;--accent:#e6b85c;--accent2:#f0a24a;--btn:#38434a;--btnh:#46535b;--good:#8fd19a;--bad:#ff9a8a;--warn:#ffc76b;--focus:#7fd0ff;--font:'Trebuchet MS',Verdana,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;--shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.45);--radius:10px}
:root[data-theme=dusk]{--bg:#141735;--panel:rgba(28,31,64,.72);--panel2:rgba(255,255,255,.07);--ink:#f2f4ff;--ink2:#c7cbe8;--line:rgba(255,255,255,.2);--accent:#9fd0ff;--accent2:#ffc58a;--btn:rgba(255,255,255,.1);--btnh:rgba(255,255,255,.18);--good:#9be8b0;--bad:#ffa3a3;--warn:#ffd08a;--focus:#ffe08a;--font:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;--shadow:0 8px 30px rgba(0,0,10,.4);--blur:blur(14px) saturate(1.2);--radius:18px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.35 var(--font)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
button,select,input{font:inherit;color:var(--ink)}
button{min-height:44px;min-width:44px;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--btnh)}button[disabled]{opacity:.55;cursor:not-allowed}
button.on,button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);font-weight:700}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
select,input[type=number],input[type=text]{min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
input[type=range]{width:100%;min-height:44px;accent-color:var(--accent)}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.stat{padding:6px 12px;min-width:92px;display:flex;flex-direction:column;justify-content:center}
.stat small{color:var(--ink2);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat b{font-size:18px;font-variant-numeric:tabular-nums;font-family:var(--font)}
.pos{color:var(--good)}.neg{color:var(--bad)}
#speeds{display:flex;gap:4px;padding:4px;align-items:center}
#speeds button{padding:2px 8px;min-width:44px}
.gauge{display:none;width:54px;height:40px}
[data-theme=brass] .gauge{display:block}
[data-theme=brass] button{border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.5)}
[data-theme=notes] .pill{background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}
#toolbar{position:fixed;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px;z-index:5;width:fit-content;max-width:calc(100vw - 16px);margin:auto}
#toolbar button{display:flex;gap:6px;align-items:center}
#panel,#drawer,#alerts{position:fixed;top:72px;bottom:84px;overflow:auto;z-index:6;padding:12px 14px}
#panel{left:8px;width:min(440px,calc(100vw - 16px));display:none}
#drawer{right:8px;width:min(600px,calc(100vw - 16px));transform:translateX(calc(100% + 16px));transition:transform .25s;visibility:hidden}
#drawer.open{transform:none;visibility:visible}
#alerts{right:8px;width:min(380px,calc(100vw - 16px));bottom:auto;max-height:60vh;display:none}
@media (max-width:760px){#panel,#drawer{left:8px;right:8px;width:auto}#top .stat{min-width:78px}}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}*{animation:none!important;scroll-behavior:auto!important}}
h2{margin:0 0 8px;font-size:19px}h3{margin:14px 0 6px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}.row>label{flex:1 1 120px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.muted{color:var(--ink2)}.mono{font-family:var(--mono);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.grid2 div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted var(--line);padding:2px 0}
.grid2 span:first-child{color:var(--ink2)}.grid2 b{font-variant-numeric:tabular-nums;font-weight:600}
canvas.ch{width:100%;height:110px;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;background:var(--panel2)}
.chip.amber{border-color:var(--warn);color:var(--warn);animation:pulse 1.2s ease-in-out infinite}
.chip.bad{border-color:var(--bad);color:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(200,120,0,.25)}}
.stamp{display:inline-block;transform:rotate(-7deg);border:2px double var(--accent2);color:var(--accent2);padding:1px 8px;border-radius:6px;font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase;opacity:.9}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.sw{position:relative;display:inline-block;width:52px;height:44px}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;left:0;right:0;top:9px;height:26px;border-radius:13px;background:var(--line);border:1px solid var(--ink2)}
.sw span:after{content:"";position:absolute;top:2px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:left .15s}
.sw input:checked+span{background:var(--accent)}.sw input:checked+span:after{left:27px}.sw input:focus-visible+span{outline:3px solid var(--focus)}
[data-theme=brass] .sw span{border-radius:5px}[data-theme=brass] .sw span:after{border-radius:3px;width:20px}
#pop{position:fixed;z-index:7;display:none;width:min(300px,calc(100vw - 16px));padding:10px 12px}
#tip{position:fixed;z-index:8;pointer-events:none;display:none;padding:4px 8px;font-size:12px;border-radius:8px}
#toasts{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(420px,calc(100vw - 16px))}
.toast{padding:8px 14px;pointer-events:auto;width:100%}
.toast.bad{border-left:5px solid var(--bad)}.toast.warn{border-left:5px solid var(--warn)}.toast.good{border-left:5px solid var(--good)}.toast.info{border-left:5px solid var(--accent)}

#dbg{position:fixed;left:8px;bottom:84px;z-index:30;display:none;padding:6px 10px;font:11px/1.3 var(--mono);white-space:pre;pointer-events:none}
.sr{position:absolute;left:-9999px}
table{border-collapse:collapse;width:100%}td,th{padding:3px 4px;text-align:left;border-bottom:1px dotted var(--line);font-size:13px}
.rule{display:grid;grid-template-columns:auto 52px 1fr;gap:4px;align-items:center;border-bottom:1px dotted var(--line);padding:4px 0}
.rule .f{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}.rule select,.rule input{min-height:44px}
.rule input[type=number]{width:84px}
</style>

<body>
<canvas id="gl" tabindex="0" aria-label="Hydropower diorama. Drag to orbit, right-drag or Shift-drag to pan, wheel to zoom, double-click to fly to an object."></canvas>
<div id="top">
 <div class="pill stat"><small>Cash</small><b id="cash">$0</b></div>
 <div class="pill stat"><small>Today</small><b id="profit">$0</b></div>
 <div class="pill stat"><small>Net</small><b id="net">0 MW</b></div>
 <div class="pill stat"><small>Spot $/MWh</small><b><span id="price">0</span> <span id="trend" aria-label="trend">→</span></b></div>
 <div class="pill stat"><small>Clock</small><b><span id="season" aria-hidden="true">☀</span> <span id="clock">D1 00:00</span></b></div>
 <div class="pill" style="display:flex;align-items:center;padding:0 6px"><svg class="gauge" viewBox="0 0 54 40" aria-hidden="true"><path d="M5 34A22 22 0 0 1 49 34" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/><line id="needle" x1="27" y1="34" x2="27" y2="14" stroke="#e6b85c" stroke-width="2.5" stroke-linecap="round"/><circle cx="27" cy="34" r="3" fill="#e6b85c"/></svg></div>
 <div class="pill" id="speeds" role="group" aria-label="Simulation speed"><button id="btnPause" aria-label="Pause or resume (Space)">⏸</button><button data-speed="1">1</button><button data-speed="2">2</button><button data-speed="3">3</button><button data-speed="4">4</button><button data-speed="5">5</button><button data-speed="6">6</button><button id="btnStep" title="Turn step (T)" aria-label="Single step (T)">⏭</button></div>
 <div style="flex:1"></div>
 <button class="pill" id="bell" aria-label="Alerts feed">🔔 <span id="bellN">0</span></button>
 <button class="pill" id="btnScada" aria-label="Toggle SCADA drawer (Tab)">📈 SCADA</button>
</div>
<div id="toolbar" class="pill" role="toolbar" aria-label="Main tools">
 <button data-panel="build">🏗 Build</button><button data-panel="auto">⚙ Automation</button><button data-panel="services">🛎 Services</button><button data-panel="finance">💰 Finance</button><button data-panel="quests">📜 Quests</button><button data-panel="lens">🔍 Lens</button><button data-panel="settings">🎛 Settings</button><button data-panel="saves">💾 Save/Load</button>
 <select id="siteSel" aria-label="Site switcher"></select>
</div>
<aside id="panel" class="pill" role="dialog" aria-labelledby="panelTitle"><div class="row"><h2 id="panelTitle" style="flex:1">Panel</h2><button id="panelClose" aria-label="Close panel (Esc)">✕</button></div><div id="panelBody"></div></aside>
<aside id="drawer" class="pill" aria-label="SCADA drawer">
 <div class="row"><h2 style="flex:1">SCADA</h2><button id="drawerClose" aria-label="Close drawer">✕</button></div>
 <h3>Price &amp; 24 h forecast</h3><canvas class="ch" id="chPrice" role="img" aria-label="Price chart"></canvas>
 <h3>Reservoir volumes</h3><canvas class="ch" id="chRes" role="img" aria-label="Reservoir chart"></canvas>
 <h3>Power flow (MW)</h3><canvas class="ch" id="chPow" role="img" aria-label="Power chart"></canvas>
 <h3>Hydraulic grade line</h3><canvas class="ch" id="chHgl" role="img" aria-label="Hydraulic grade line"></canvas>
 <h3>Telemetry</h3><div id="telem" class="grid2"></div>
 <h3 id="rulesH">Rule engine (8 slots)</h3><div id="rules"></div>
</aside>
<aside id="alerts" class="pill" aria-label="Alerts feed"><div class="row"><h2 style="flex:1">Alerts</h2><button id="alertsClose" aria-label="Close">✕</button></div><div id="alertsBody"></div></aside>
<div id="pop" class="pill" role="dialog" aria-live="off"></div>
<div id="tip" class="pill" role="tooltip"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box pill" id="modalBox"></div></div>
<div id="dbg" class="pill"></div>
<script id="main">
(function(){'use strict';
/* ============================ PURE SIMULATION ============================
 Chosen values (not given in the brief) live in CONFIG with units; see the note after the file.
 Equation index (cited as "EQ §x" at each formula):
  T1 terrain heightfield  T2 hypsometric volume table  T3 gravity-dam section
  H1 Darcy-Weisbach  H2 Swamee-Jain friction  H3 minor loss  H4 net head  H5 turbine power  H6 pump power
  H7 Thoma sigma  H8 NPSH  H9 efficiency curves  H10 first-order flow ramp
  R1 reservoir mass balance  R2 evaporation  R3 runoff  W1 wear  C1 climate  C2 sun  C3 wind power  C4 solar power
  C5 soiling  P1 duck-curve price  P2 market impact  F1 interest  F2 NPV/payback  B1 battery  G1 reserve ramp */
//#SIM-BEGIN
const sqrt=Math.sqrt,exp=Math.exp,log=Math.log,sin=Math.sin,cos=Math.cos,pow=Math.pow,min=Math.min,max=Math.max,PI=3.141592653589793;
const CONFIG={
 schema:1,
 dt:15,                                             // s, fixed step
 speeds:[1,15,60,300,1200,3600],                    // sim-s per real-s (keys 1..6)
 frameBudgetMs:40,                                  // ms of sim work per frame
 start:{doy:90,hour:6,cash:450000,lat:46},          // day-of-year, h, $, deg
 phys:{g:9.81,rho:1000,patm0:101325,scaleH:8434,etaGen:0.97,etaMot:0.96}, // m/s2, kg/m3, Pa, m, -, -
 domain:{half:240,cell:6},                          // m half-size of terrain, m table cell
 pen:{D:[0.9,1.3,1.8],eps0:4.5e-5,epsAge:6,K:2.1,costPerM3:85,hours:48,bend:1.06,nu:1.79e-6}, // m, m, -, -, $/(m*m2), h, -, m2/s
 turb:[{Q:2.8,eta:0.86,cost:0,hours:0},{Q:7,eta:0.90,cost:60000,hours:36},{Q:15,eta:0.93,cost:150000,hours:72}], // m3/s, -, $, h
 pump:[{Q:2.5,eta:0.80,cost:0,hours:0},{Q:6,eta:0.855,cost:50000,hours:36},{Q:13,eta:0.90,cost:130000,hours:72}],
 design:{H:90,eta:0.88},                            // m, - (nameplate basis)
 flow:{tau:15.9,qOptT:0.8,kT:1.4,qOptP:0.9,kP:1.6,snap:0.001,hKappa:0.6}, // s ramp constant, -, -, -, -, m3/s, -
 cav:{sigmaC:0.12,npshA:4,npshB:9,hSuc:0.3,onset:1.15,full:0.65,warn:1.3,effPen:0.12}, // -, m, m, m, ratios
 wear:{op:0.05,cav:1.8,start:0.05,penBase:0.004,penFat:0.02,silt:0.5,tripBelow:25,tripP:0.03,tripH:8,burstBelow:8,burstH:48,repairH:3,repairPerPct:0.006,failQ:0.6}, // %/h, %/h, %, ...
 res:{freeU:0.5,freeL:1.0,deadU:0.6,deadL:1.5,N:40}, // m freeboard, m dead depth, intervals
 basin:{ur:70,d0:22,blend:30,exMax:60,exFree:20,exPerM3:0.6,exRate:3000,exPermit:30000}, // m, m, m, m, m, $/m3, m3/h, $
 dam:{crestW:6,slope:0.7,perM3:4,mob:12000,rate:800,baseH:24,max:30,maxPermit:50,permit:40000,raiseMul:1.3,zMin:-120,zMax:150,hMin:8}, // m, -, $/m3, $, m3/h, m, m, m, $
 env:{q:0.45,fee:0.5,seasonMul:[1.3,1,1,0.8]},      // m3/s, $/m3 unmet, spring..winter
 hydro:{baseQ:0.8,catchArea:8e6,runoff:0.35,evap0:1.1,evapT:0.16,evapW:0.05,iceEvap:0.85}, // m3/s, m2, -, mm/d, mm/d/C, 1/(m/s), -
 clim:{T0:10,Tamp:12,lapse:0.0065,diurnal:4.5,phiT:0.92,sdT:3.2,W0:5.4,Wamp:1.5,phiW:0.9,sdW:2.0,C0:0.45,Camp:0.12,phiC:0.93,sdC:0.28,rainTh:0.72,rainK:14,stormMul:2.2,hwDT:8,hwP:0.04,stormP:0.05,melt:0.35,iceK:0.004,iceMelt:0.01,smoothS:1800}, // C ... 
 wind:{mw:2.0,cost:90000,hours:24,ci:3,rated:12,co:25,restart:22,hubZ:80,z0:10,alpha:0.143,rhoAir:1.225,permit:25000},
 solar:{mwp:1.2,cost:60000,hours:12,eta:0.86,tc:-0.004,soilRate:0.0045,soilMax:0.35,rainClean:0.55,rainThresh:3,cleanCost:400,cleanTo:0.02,land:8000}, // MWp, $, h, -, 1/C, 1/d, -, -, mm/d, $
 bat:[{cap:2,p:1,rt:0.88,cost:40000},{cap:6,p:3,rt:0.90,cost:110000},{cap:16,p:8,rt:0.92,cost:280000}], // MWh, MW, -, $
 batc:{lo:0.10,hi:0.95,fade:0.00025,fadeMax:0.4,refurb:0.35,hours:12,chg:0.85,dis:1.12}, // soc window, per-cycle, -, share of cost, h, price ratios
 price:{base:70,floor:5,cap:500,noiseSd:0.12,noisePhi:0.7,impact:0.8,fcSd:0.04,windSens:0.02,spikeP:0.15}, // $/MWh ... $/MWh per MW
 reserve:{maxShare:0.34,payMW:14,callRate:0.012,emergRate:0.0012,callMult:2.5,fine:2000,deadline:60,okFrac:0.9,relOk:2,relFail:-8,relEmerg:-20,relEmergOk:4,revoke:10,durMin:[30,120]}, // share of nameplate, $/MW/h, 1/h, 1/h, -, $/MW, s, -, pts
 fin:{loanMax:600000,rate:0.09,fee:0.015,discount:0.08,horizonY:10,opexDay:60,opexUnit:15,insolv:50000,insolvDays:3}, // $, APR, -, 1/yr, yr, $/day, $/day/tier, $, d
 site:{cost:[0,160000,380000],alt:[650,1180,1750],parcels:12,parcelSize:30}, // $, m, count, m
 contract:{n:3,days:[7,21],mw:[1,4],pm:[0.9,1.3],pen:1.5}, // d, MW, x base, x spot
 quest:{winCash:2000000},
 hist:{n:1440,every:60},                            // points, s
 perf:{windMsPerStep:0}
};
const abs=x=>x<0?-x:x,clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const fl=x=>{const i=x|0;return i>x?i-1:i;};
const mod=(x,m)=>x-m*fl(x/m);
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function imul(a,b){return ((a&65535)*b+((((a>>>16)*b)&65535)<<16))|0;}
function hstr(s){let h=2166136261|0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=imul(h,16777619);}return h>>>0;}
function rnd(S,name){ // named seeded stream (mulberry32)
 let a=S.rng[name];if(a===undefined)a=(hstr(name)^imul(S.seed|0,2654435761))|0;
 a=(a+0x6D2B79F5)|0;S.rng[name]=a;let t=imul(a^(a>>>15),a|1);t^=t+imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function gauss(S,name){const u=rnd(S,name),v=rnd(S,name);return sqrt(-2*log(max(u,1e-12)))*cos(2*PI*v);}
/* ---- EQ §T1 terrain heightfield (shared by simulation and renderer) ---- */
function lat(seed,i,j){let h=(imul(i,374761393)+imul(j,668265263)+imul(seed,1274126177))|0;h=imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(seed,x,z){const xi=fl(x),zi=fl(z),fx=x-xi,fz=z-zi,sx=fx*fx*(3-2*fx),sz=fz*fz*(3-2*fz);
 return lerp(lerp(lat(seed,xi,zi),lat(seed,xi+1,zi),sx),lerp(lat(seed,xi,zi+1),lat(seed,xi+1,zi+1),sx),sz);}
function mC(T,z){return 22*sin(z/58+T.ph)+9*sin(z/23+2*T.ph);}      // m valley centreline
function fl0(T,z){return T.alt+20-0.045*z;}                          // m valley floor profile (slope 0.045)
function natH(T,x,z){const d=abs(x-mC(T,z)),wall=118*(1-exp(-max(0,d-T.w0)/T.w)),k=min(1,wall/30)*(1-0.8*sstep(80,110,x));
 return fl0(T,z)+wall-3*exp(-d*d/60)+((vnoise(T.seed,x/38,z/38)-0.5)*14+(vnoise(T.seed+7,x/11,z/11)-0.5)*3)*k;}
function terrH(T,x,z,exc){const dx=x-T.ux,dz=z-T.uz,r=sqrt(dx*dx+dz*dz);
