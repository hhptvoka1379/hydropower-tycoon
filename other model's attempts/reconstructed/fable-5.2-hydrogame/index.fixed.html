<!DOCTYPE html>
<html lang="en" data-theme="field">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hydropower Tycoon</title>
<!--
HYDROPOWER TYCOON — single offline file. No external requests, no eval.
CHOSEN VALUES (unspecified in the brief; all live in CONFIG with units):
 - In-game year = 120 days (4 seasons x 30 d). Speed ladder 1/10/60/300/1800/3600 sim-s per real-s, steps 1/1/5/5/30/30 s.
 - Ramp rate 1.65 m3/s per 45 s; reserve ramp window 60 s; call length 900 s; delivery tolerance 95 %.
 - Tier-1 turbine Qd 1.8 / Qmax 1.9 m3/s (gives ~0.76 MW capability at ~46 m head: 0.7 MW ok, 0.8 MW rejected).
 - Thoma sigma_crit = sigc*(50/H)^0.8*(1+2(q-1)^2); efficiency parabola eta = eta_max*(1-0.5(1-q)^2).
 - Penstock minor-loss K = 1.5; Swamee-Jain friction; roughness grows up to 4x with wear.
 - Price base 55 $/MWh, duck-curve gaussians, market impact 1.2 $/MWh per MW; reserve fee 9 $/MW/h, fine 400 $/MW.
 - Env flow 0.25 m3/s, river inflow 0.6 m3/s (seasonal), evaporation 0.2 mm/day per degC, loan APR 8 %, limit $3M.
 - Battery fade 0.015 % per full cycle; soiling 0.4 %/day; wind 3/12/25 m/s cut-in/rated/cut-out.
 - RNG and grid indexing additionally use floor/imul (integer hashing); physics uses only the listed operators.
-->
<style>
:root{--bg:#f3ecdc;--panel:#f6f0e2;--ink:#2a251e;--mute:#5c5345;--line:#b9ab8d;--acc:#7a4317;--acc-ink:#fff8ea;--good:#2d6a3a;--bad:#9b2c1f;--warn:#8a5a00;--shadow:0 3px 10px rgba(40,30,10,.22);--rad:10px;--font:Georgia,'Iowan Old Style','Times New Roman',serif;--blur:none}
[data-theme=brass]{--bg:#23292d;--panel:#2c3338;--ink:#f1e7d0;--mute:#c4b99f;--line:#6c6250;--acc:#e0b85f;--acc-ink:#1d1a12;--good:#8fd19a;--bad:#ff9d8a;--warn:#ffd27a;--shadow:0 3px 0 #15191c,0 6px 14px rgba(0,0,0,.45);--rad:5px;--font:'Trebuchet MS',Verdana,sans-serif}
[data-theme=dusk]{--bg:#1c2040;--panel:rgba(36,40,78,.62);--ink:#f5f3ff;--mute:#cfcbe8;--line:rgba(255,255,255,.28);--acc:#ffcba6;--acc-ink:#2a1c2e;--good:#a6f0c0;--bad:#ffb0b0;--warn:#ffe19a;--shadow:0 8px 28px rgba(5,5,30,.4);--rad:16px;--font:'Segoe UI',system-ui,sans-serif;--blur:blur(14px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fc3d8;color:var(--ink);font:15px/1.4 var(--font)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,select,input{font:inherit;color:inherit}
button{min-height:44px;min-width:44px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);cursor:pointer;box-shadow:var(--shadow)}
button:hover{border-color:var(--acc)}
button[aria-pressed=true],button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
select,input[type=number],input[type=text]{min-height:44px;padding:4px 8px;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg);max-width:100%}
input[type=range]{min-height:44px;width:100%;accent-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.stat{padding:4px 12px;display:flex;flex-direction:column;justify-content:center;min-width:92px}
.stat small{color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.grow{flex:1}
#speeds{display:flex;gap:4px;flex-wrap:wrap}
#speeds button{padding:4px 8px}
#chip{display:none;align-items:center;padding:4px 12px;color:var(--warn);font-weight:bold;border-style:dashed}
#chip.show{display:flex;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
#bar{position:fixed;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;z-index:5;pointer-events:none}
#bar>*{pointer-events:auto}
#toasts{position:fixed;right:10px;top:120px;display:flex;flex-direction:column;gap:6px;z-index:8;max-width:min(340px,90vw);pointer-events:none}
.toast{padding:8px 12px;font-size:14px}
.toast.bad{border-left:5px solid var(--bad)}.toast.good{border-left:5px solid var(--good)}.toast.info{border-left:5px solid var(--acc)}
#sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,96vw);max-height:82vh;display:none;flex-direction:column;z-index:10}
#sheet.open{display:flex}
#sheet header,#drawer header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line)}
#sheet h2,#drawer h2{margin:0;font-size:19px}
#sheetBody{padding:12px;overflow:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);transform:translateX(105%);transition:transform .25s;z-index:9;display:flex;flex-direction:column;border-radius:0}
#drawer.open{transform:none}
#drawerBody{overflow:auto;padding:10px}
#drawer canvas{width:100%;height:120px;display:block;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-bottom:4px}
#pop{position:fixed;display:none;z-index:7;padding:10px 12px;width:min(280px,92vw);font-size:14px}
#tip{position:fixed;display:none;z-index:7;padding:3px 9px;font-size:13px;pointer-events:none}
#dbg{position:fixed;left:8px;top:120px;display:none;z-index:6;padding:8px;font:12px/1.35 ui-monospace,Menlo,monospace;white-space:pre;max-width:92vw;overflow:hidden}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row>label{min-width:110px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.item{padding:10px;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg)}
.item h3{margin:0 0 4px;font-size:15px}
.item p{margin:2px 0;font-size:13px;color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--mute)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.stamp{display:inline-block;padding:2px 8px;border:2px solid currentColor;border-radius:4px;transform:rotate(-6deg);font-weight:bold;letter-spacing:.1em;font-size:12px;text-transform:uppercase;opacity:.85}
.rule{display:grid;grid-template-columns:44px 1fr;gap:4px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rule .f{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.rule select,.rule input{min-height:44px;width:auto;max-width:108px}
h4{margin:12px 0 4px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
.badge[hidden]{display:none}
progress{accent-color:var(--acc);height:14px}
[data-theme=brass] button{border-width:2px;text-transform:uppercase;font-size:13px;letter-spacing:.05em}
@media (max-width:640px){.stat{min-width:76px;padding:3px 8px}.stat b{font-size:14px}#bar button{padding:4px 8px;font-size:13px}}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}#chip.show{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-label="Hydropower diorama. Drag to orbit, right-drag or shift-drag to pan, wheel to zoom."></canvas>
<div id="top" role="region" aria-label="Status"></div>
<div id="toasts" aria-live="polite"></div>
<div id="bar" role="toolbar" aria-label="Main toolbar"></div>
<div id="pop" class="card" role="dialog" aria-label="Details"></div>
<div id="tip" class="card" role="tooltip"></div>
<div id="dbg" class="card"></div>
<aside id="drawer" class="card" aria-label="SCADA drawer"><header><h2>SCADA</h2><button id="drawerX" aria-label="Close SCADA">✕</button></header><div id="drawerBody"></div></aside>
<section id="sheet" class="card" role="dialog" aria-modal="false" aria-labelledby="sheetT"><header><h2 id="sheetT"></h2><button id="sheetX" aria-label="Close panel">✕</button></header><div id="sheetBody"></div></section>
<script>
var Game=(function(){'use strict';
/* ================= SIMULATION (pure: no DOM, no THREE, no Math.random) ================= */
const M=Math,sqrt=M.sqrt,exp=M.exp,logM=M.log,sin=M.sin,cos=M.cos,pow=M.pow,min=M.min,max=M.max,floor=M.floor,PI=3.141592653589793;
const abs=x=>sqrt(x*x),clamp=(x,a,b)=>min(b,max(a,x)),sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const CONFIG=Object.freeze({
 RHO:1000,/*kg/m3*/G:9.81,/*m/s2*/NU:1.0e-6,/*m2/s*/H_ATM:10.33,/*m*/H_VAP:0.24,/*m*/
 K_MINOR:1.5,/*-*/PEN_SLOPE_L:1.6,/*penstock length per m head, -*/PEN_L0:120,/*m*/
 RAMP:1.65/45,/*m3/s per s*/RES_WINDOW:60,/*s*/RES_CALL:900,/*s*/RES_TOL:0.95,/*-*/RES_FEE:9,/*$/MW/h*/RES_FINE:400,/*$/MW*/
 RES_P:0.06,/*call prob per h*/RES_P_EMG:0.3,/*per h in emergency*/H_REF:50,/*m*/
 SPEEDS:Object.freeze([1,10,60,300,1800,3600]),/*sim-s per s*/DTS:Object.freeze([1,1,5,5,30,30]),/*s*/
 SEASON_DAYS:30,/*d*/YEAR_DAYS:120,/*d*/T_MEAN:10,/*degC*/T_AMP:12,/*degC*/T_DIURNAL:5,/*degC*/
 P_HEAT:0.08,/*per summer day*/P_STORM:0.07,/*per day*/HEAT_DT:8,/*degC*/
 WIND_IN:3,WIND_RATED:12,WIND_OUT:25,/*m/s*/WIND_KW:500,/*kW per rotor*/SOLAR_KW:250,/*kWp per array*/
 SOIL_DAY:0.004,/*per day*/SOIL_MAX:0.3,/*-*/CLEAN_COST:4000,/*$ per site*/
 PRICE_BASE:55,/*$/MWh*/PRICE_IMPACT:1.2,/*$/MWh per MW*/PRICE_MIN:-20,/*$/MWh*/
 Q_RIVER:0.6,/*m3/s*/Q_ENV:0.25,/*m3/s*/ENV_FEE:0.5,/*$/m3*/EVAP:0.2,/*mm/day per degC*/DEAD_FRAC:0.05,/*-*/
 BASIN_R:110,/*m*/BASIN_D0:4,/*m*/EXC_COST:6,/*$/m3*/EXC_RATE:18,/*m3/s tier1*/DAM_COST:20,/*$/m3*/DAM_RATE:1.4,/*m3/s tier1*/
 DAM_MIN:8,DAM_MAX:60,/*m*/DAM_PERMIT_H:30,/*m*/
 WEAR:0.012,/*%/h running*/WEAR_CAV:8,/*x*/WEAR_PEN:0.004,/*%/h at 3 m/s*/REPAIR_FRAC:0.25,/*of new cost at 0% health*/
 BAT_SOC_MIN:0.10,BAT_SOC_MAX:0.95,/*-*/BAT_FADE:0.00015,/*per full cycle*/BAT_LO:0.85,BAT_HI:1.15,/*x mean forecast*/
 LOAN_APR:0.08,/*per year*/LOAN_MAX:3e6,/*$*/OM_HOUR:2,/*$/h per site*/START_CASH:60000,/*$*/CAPEX_K:1/30,/*- diorama-economy scale applied to every listed capital cost, loan limit, bankruptcy and win thresholds*/DAM_FILL:0.35,/*- initial impound fraction*/RUNNER_SET:0.55,/*- runner elevation as fraction of dam height*/DISCOUNT:0.08,/*per year*/
 BANKRUPT:-250000,/*$*/BANKRUPT_DAYS:3,/*d*/ENV_FAIL_DAYS:7,/*d*/WIN_WORTH:5e6,/*$*/
 TURB:Object.freeze([{n:'T1 Francis',Qd:1.8,Qmax:1.9,eta:0.90,sigc:0.10,cost:0,sec:3600},{n:'T2 Francis',Qd:4.5,Qmax:5,eta:0.915,sigc:0.09,cost:420000,sec:43200},{n:'T3 Reversible',Qd:9,Qmax:10,eta:0.93,sigc:0.08,cost:1400000,sec:86400}]),
 PUMP:Object.freeze([{n:'P1',Qd:1.5,Qmax:1.7,eta:0.84,cost:0,sec:3600},{n:'P2',Qd:4,Qmax:4.5,eta:0.87,cost:380000,sec:43200},{n:'P3',Qd:8,Qmax:9,eta:0.89,cost:1200000,sec:86400}]),
 PEN:Object.freeze([{n:'Riveted 1.2 m',D:1.2,eps:5e-4,cost:0,sec:3600},{n:'Welded 1.8 m',D:1.8,eps:2e-4,cost:260000,sec:36000},{n:'Lined 2.6 m',D:2.6,eps:1e-4,cost:700000,sec:72000}]),
 BAT:Object.freeze([null,{n:'B1',E:2,P:1,rt:0.88,cost:300000,sec:21600},{n:'B2',E:6,P:3,rt:0.90,cost:800000,sec:36000},{n:'B3',E:16,P:8,rt:0.92,cost:1900000,sec:54000}]),
 EQUIP:Object.freeze([{n:'Crew & shovels',k:1,cost:0},{n:'Excavator fleet',k:1.8,cost:150000},{n:'Cableway & batch plant',k:3,cost:450000}]),
 SOLAR_COST:160000,WIND_COST:520000,PARCEL_COST:30000,/*$*/PARCELS:12,/*tiles*/SOLAR_SEC:14400,WIND_SEC:28800,/*s*/
 PERMITS:Object.freeze({highdam:{n:'High-dam permit',cost:90000},wind:{n:'Wind permit',cost:40000}}),
 SITES:Object.freeze([{n:'Alder Gorge',head:40,cost:0,ph:0.3},{n:'Kestrel Notch',head:95,cost:900000,ph:1.9},{n:'Thunder Stair',head:170,cost:2200000,ph:4.1}]),
 CONTRACTS:Object.freeze([{n:'Village evening block',mw:0.4,from:18,to:22,price:98,pen:70,days:5,bonus:25000},{n:'Mill day shift',mw:0.8,from:8,to:16,price:74,pen:60,days:8,bonus:60000},{n:'City peaker',mw:2.5,from:17,to:21,price:125,pen:110,days:10,bonus:220000}])
});
/* --- named seeded streams (integer hash; state kept in state.rng) --- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=M.imul(h,16777619);}return h>>>0;}
function rnd(st,name){let a=st.rng[name];if(a===undefined)a=hashStr(st.seed+'|'+name);a=(a+0x6D2B79F5)>>>0;st.rng[name]=a;let t=a;t=M.imul(t^(t>>>15),t|1);t^=t+M.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
/* --- terrain (pure; shared by sim and world) — §Construction --- */
function siteParams(seed,idx,bias){const c=CONFIG.SITES[idx],h=hashStr(seed+'|terrain'+idx),p=[];for(let i=0;i<6;i++)p.push(((h>>>(i*5))&31)/31*6.283+c.ph);
 const w=bias==='wide'?1.35:bias==='narrow'?0.75:1,r=bias==='rugged'?1.9:1;return{p:p,head:c.head,w:w,r:r,bx:-430,bz:-60,rim:100+c.head*1.12};}
function riverBed(z){return 100-z*0.012;}
function canyonX(sp,z){return 220+130*sin(z*0.004+sp.p[0])+35*sin(z*0.011+sp.p[1]);}
function terrainH(sp,x,z,exc){
 const d=abs(x-canyonX(sp,z)),wall=sp.head*1.12*(1-exp(-pow(d/(150*sp.w),2)));
 const nz=(7*sin(x*0.013+sp.p[2])*cos(z*0.017+sp.p[3])+3.5*sin(x*0.041+sp.p[4])*sin(z*0.037+sp.p[5]))*sp.r;
 let h=riverBed(z)+wall+nz*clamp(wall/sp.head,0.08,1)+(x>500?(x-500)*0.05:0);
 const db=sqrt((x-sp.bx)*(x-sp.bx)+(z-sp.bz)*(z-sp.bz)),R=CONFIG.BASIN_R;
 h=h+(sp.rim-h)*(1-sstep(R+25,R+140,db));                 /* flat rim apron */
 return h-(CONFIG.BASIN_D0+exc)*(1-sstep(R-12,R+10,db));   /* bowl */
}
/* stage–volume curve of the lower reservoir upstream of the dam — §Reservoirs */
function stageCurve(sp,damZ,height){const N=44,x0=-180,x1=780,z0=-780,cz=(damZ-z0)/N,cx=(x1-x0)/N,base=riverBed(damZ),L=[],V=[],hs=[];
 for(let j=0;j<N;j++)for(let i=0;i<N;i++)hs.push(terrainH(sp,x0+(i+0.5)*cx,z0+(j+0.5)*cz,0));
 for(let k=0;k<=12;k++){const lv=base+height*k/12;let v=0;for(let n=0;n<hs.length;n++)v+=max(0,lv-hs[n]);L.push(lv);V.push(v*cx*cz);}
 return{L:L,V:V};}
function levelFromV(c,v){const n=c.V.length;if(v<=0)return c.L[0];for(let k=1;k<n;k++)if(v<=c.V[k]){const f=(v-c.V[k-1])/max(1e-9,c.V[k]-c.V[k-1]);return c.L[k-1]+f*(c.L[k]-c.L[k-1]);}return c.L[n-1];}
function damVolume(sp,z,h){/* trapezoid profile: crest 6 m, slopes 1:0.7; width from canyon section */
 let w=0;const cx=canyonX(sp,z),crest=riverBed(z)+h;for(let i=-40;i<=40;i++){const g=terrainH(sp,cx+i*12,z,0),hh=max(0,crest-g);w+=12*hh*(6+0.7*hh);}return w;}
/* --- hydraulics (pure) --- */
function friction(Q,D,eps){/* §Hydraulics: Swamee–Jain */const A=PI*D*D/4,v=abs(Q)/A,Re=max(2000,v*D/CONFIG.NU),lg=logM(eps/(3.7*D)+5.74/pow(Re,0.9))/logM(10);return{f:0.25/(lg*lg),v:v};}
function headLoss(Q,pen){/* §Hydraulics: Darcy–Weisbach major + K v²/2g minor */const t=CONFIG.PEN[pen.tier],eps=t.eps*(1+3*(1-pen.health/100)),fr=friction(Q,t.D,eps),vh=fr.v*fr.v/(2*CONFIG.G);
 return{major:fr.f*pen.L/t.D*vh,minor:CONFIG.K_MINOR*vh,v:fr.v,f:fr.f};}
function effCurve(etaMax,q,health){/* §Hydraulics: efficiency parabola about best-efficiency flow */return max(0.05,etaMax*(1-0.5*(1-q)*(1-q))*(0.85+0.15*health/100));}
function turbinePower(site,Q,Hg){/* §Hydraulics: P = rho g Q Hn eta [W] */const t=CONFIG.TURB[site.turb.tier],hl=headLoss(Q,site.pen),Hn=max(0,Hg-hl.major-hl.minor),eta=effCurve(t.eta,Q/t.Qd,site.turb.health);return{P:CONFIG.RHO*CONFIG.G*Q*Hn*eta,Hn:Hn,eta:eta,hl:hl};}
function pumpPower(site,Q,Hg){/* §Hydraulics: P = rho g Q (Hg+hL)/eta [W] */const t=CONFIG.PUMP[site.pump.tier],hl=headLoss(Q,site.pen),Hp=Hg+hl.major+hl.minor,eta=effCurve(t.eta,Q/t.Qd,site.pump.health);return{P:CONFIG.RHO*CONFIG.G*Q*Hp/eta,Hn:Hp,eta:eta,hl:hl};}
function cavitation(site,Q,Hn,Hs,gen){/* §Hydraulics: Thoma sigma and NPSH margins */const t=gen?CONFIG.TURB[site.turb.tier]:CONFIG.PUMP[site.pump.tier],q=Q/t.Qd,sc=(gen?t.sigc:0.09)*pow(CONFIG.H_REF/max(5,Hn),0.8)*(1+2*(q-1)*(q-1));
 const hl=headLoss(Q,site.pen),npsha=CONFIG.H_ATM-CONFIG.H_VAP-Hs-0.3*hl.minor,sigma=npsha/max(5,Hn);return{sigma:sigma,sigc:sc,npsha:npsha,npshr:sc*max(5,Hn),margin:sigma-sc};}
function levels(site,sp){const A=PI*CONFIG.BASIN_R*CONFIG.BASIN_R,fl=sp.rim-CONFIG.BASIN_D0-site.exc,up=fl+site.up.V/A,lo=site.dam.built>=1?levelFromV(site.curve,site.lo.V):riverBed(site.dam.z);return{up:up,lo:lo,floorUp:fl,Hg:up-lo};}
function capability(site,sp){/* §Reserve: deliverable MW inside the ramp window */if(site.dam.built<1||site.turb.health<=0)return 0;const t=CONFIG.TURB[site.turb.tier],Q=min(t.Qmax,CONFIG.RAMP*CONFIG.RES_WINDOW),lv=levels(site,sp);
 let p=turbinePower(site,Q,lv.Hg).P/1e6;const b=CONFIG.BAT[site.bat.tier];if(b)p+=b.P;return p;}
function upCap(site){return PI*CONFIG.BASIN_R*CONFIG.BASIN_R*(CONFIG.BASIN_D0+site.exc-0.5);}
/* --- state --- */
function newSite(i,owned){const head=CONFIG.SITES[i].head;return{id:i,owned:owned,dam:{placed:false,z:200,h:0,built:0},curve:{L:[0,1],V:[0,1]},exc:0,
 up:{V:0},lo:{V:0,cap:0},pen:{tier:0,health:100,L:CONFIG.PEN_L0+head*CONFIG.PEN_SLOPE_L},pump:{tier:0,health:100},turb:{tier:0,health:100},
 Q:0,Qcmd:1.5,mode:'idle',curtail:0,solar:{n:0,soil:0},wind:{n:0},parcels:2,bat:{tier:0,soc:0,fade:0,thru:0},
 wx:{wind:6,cloud:0.4,rain:0,rainDay:0},res:{offer:0,callT:0,el:0,short:0},
